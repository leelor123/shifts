<style>
/* ============================================================
 * Shift & pay tracker — "pay ledger" identity: warm paper, deep
 * petrol ink, amber highlights. Hebrew-first type (IBM Plex Sans
 * Hebrew + Frank Ruhl Libre for figures and headings), squared
 * corners, RTL-aware motion. Accent hue = --h/--s (user setting).
 * ============================================================ */
:root {
  --h: 186; --s: 48%;
  --fs: 1;
  --radius: 14px;
  --radius-s: 10px;
  --nav-h: 72px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --ease: cubic-bezier(.32, .72, 0, 1);
  --app-font: 'Rubik';
  --font: var(--app-font), 'Assistant', system-ui, 'Segoe UI', Arial, sans-serif;
  --display: var(--font);
  --amber: #e2a224; --on-amber: #231a05; --amber-soft: #f6e6c1;

  --primary: hsl(var(--h) var(--s) 27%);
  --on-primary: #fff;
  --primary-container: hsl(var(--h) 34% 90%);
  --on-primary-container: hsl(var(--h) 55% 14%);
  --secondary-container: hsl(var(--h) 20% 89%);
  --on-secondary-container: hsl(var(--h) 30% 18%);
  --surface: #f6f4ee;
  --surface-1: #fdfcf8;
  --surface-2: #f0ede4;
  --surface-3: #e7e3d8;
  --surface-hi: #ffffff;
  --on-surface: #1b2220;
  --on-surface-var: #5b625e;
  --outline: #8c918b;
  --outline-var: #dedad0;
  --line: #e3dfd4;
  --hero: hsl(var(--h) var(--s) 20%);
  --on-hero: #f4f1e8;
  --scrim: rgba(18, 24, 22, .45);
  --good: #0b6b2e; --good-bg: #dcefe2; --good-mark: #1f9d52;
  --warn: #7a4f00; --warn-bg: #fbedc9; --warn-mark: #e2a224;
  --bad: #a3271f; --bad-bg: #f8e0dc; --bad-mark: #cf4436;
  --info-bg: var(--secondary-container);
  --override: #a64b00; --override-bg: #fbe3cf;
  --rest-tint: rgba(226, 162, 36, .16);
  --rest-mark: #b97f0c;
  --grid: #e4e0d6; --axis: #c9c4b8; --ink-muted: #8a8a82;
  --shadow: 0 1px 0 rgba(27, 34, 32, .06);
  --shadow-up: 0 -1px 0 var(--line);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: hsl(var(--h) 46% 62%);
    --on-primary: hsl(var(--h) 60% 10%);
    --primary-container: hsl(var(--h) 30% 20%);
    --on-primary-container: hsl(var(--h) 50% 88%);
    --secondary-container: hsl(var(--h) 14% 21%);
    --on-secondary-container: hsl(var(--h) 25% 88%);
    --surface: #0f1413;
    --surface-1: #151c1b;
    --surface-2: #1a2322;
    --surface-3: #222d2b;
    --surface-hi: #1a2221;
    --on-surface: #e8ede9;
    --on-surface-var: #a5aea9;
    --outline: #6f7a76;
    --outline-var: #2a3533;
    --line: #26302e;
    --hero: hsl(var(--h) 40% 15%);
    --on-hero: #eef2ec;
    --amber-soft: #3a2c0c;
    --scrim: rgba(0, 0, 0, .62);
    --good: #7ed79e; --good-bg: #12301f; --good-mark: #2bb466;
    --warn: #f3cf7a; --warn-bg: #352708; --warn-mark: #e2a224;
    --bad: #ffb0a5; --bad-bg: #44160f; --bad-mark: #e8665a;
    --override: #ffb37a; --override-bg: #3f2209;
    --rest-tint: rgba(226, 162, 36, .14);
    --rest-mark: #e2a224;
    --grid: #26302e; --axis: #34403d;
    --shadow: none;
    --shadow-up: 0 -1px 0 var(--line);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --primary: hsl(var(--h) 46% 62%);
  --on-primary: hsl(var(--h) 60% 10%);
  --primary-container: hsl(var(--h) 30% 20%);
  --on-primary-container: hsl(var(--h) 50% 88%);
  --secondary-container: hsl(var(--h) 14% 21%);
  --on-secondary-container: hsl(var(--h) 25% 88%);
  --surface: #0f1413;
  --surface-1: #151c1b;
  --surface-2: #1a2322;
  --surface-3: #222d2b;
  --surface-hi: #1a2221;
  --on-surface: #e8ede9;
  --on-surface-var: #a5aea9;
  --outline: #6f7a76;
  --outline-var: #2a3533;
  --line: #26302e;
  --hero: hsl(var(--h) 40% 15%);
  --on-hero: #eef2ec;
  --amber-soft: #3a2c0c;
  --scrim: rgba(0, 0, 0, .62);
  --good: #7ed79e; --good-bg: #12301f; --good-mark: #2bb466;
  --warn: #f3cf7a; --warn-bg: #352708; --warn-mark: #e2a224;
  --bad: #ffb0a5; --bad-bg: #44160f; --bad-mark: #e8665a;
  --override: #ffb37a; --override-bg: #3f2209;
  --rest-tint: rgba(226, 162, 36, .14);
  --rest-mark: #e2a224;
  --grid: #26302e; --axis: #34403d;
  --shadow: none;
  --shadow-up: 0 -1px 0 var(--line);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: calc(16px * var(--fs)); }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--surface); color: var(--on-surface);
  line-height: 1.5; overscroll-behavior-y: contain;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }
.num, .money { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.muted { color: var(--on-surface-var); }
.small { font-size: .82rem; }
.tiny { font-size: .72rem; }
.bold { font-weight: 700; }
.center { text-align: center; }
.row-flex { display: flex; align-items: center; gap: 8px; }
.spacer { flex: 1; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s { width: 18px; height: 18px; }
svg.i.l { width: 32px; height: 32px; }

/* ---------- app shell ---------- */
#app { max-width: 600px; margin: 0 auto; min-height: 100%; position: relative; }
.view { padding: calc(8px + var(--safe-t)) 16px calc(var(--nav-h) + var(--safe-b) + 28px); animation: viewIn .28s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.topbar { display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 8px 0 4px; }
.topbar h1 { font-size: 1.5rem; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.topbar .sub { font-size: .85rem; color: var(--on-surface-var); }
.topbar .titles { flex: 1; min-width: 0; }
.section-title { font-size: .95rem; font-weight: 700; margin: 22px 4px 10px; display: flex; align-items: center; gap: 8px; }
.section-title .spacer + * { font-weight: 500; }

/* ---------- bottom navigation ---------- */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: var(--surface-2); box-shadow: var(--shadow-up);
  display: flex; justify-content: center;
}
.nav-inner { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 600px; align-items: center; }
.nav button {
  background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: .75rem; font-weight: 600; color: var(--on-surface-var); padding: 10px 0; cursor: pointer;
}
.nav button .pill { width: 60px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background .2s; position: relative; }
.nav button.on { color: var(--on-surface); }
.nav button.on .pill { background: var(--secondary-container); color: var(--on-secondary-container); }
.nav .fab {
  width: 64px; height: 64px; border-radius: 22px; margin: -18px auto 0; display: grid; place-items: center;
  background: var(--primary); color: var(--on-primary); box-shadow: 0 4px 14px hsla(var(--h), 60%, 40%, .35); border: 0;
}
.nav .fab svg { width: 30px; height: 30px; }
.dot-badge { direction: ltr; position: absolute; top: 2px; inset-inline-end: 12px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad-mark); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }

/* ---------- cards & surfaces ---------- */
.card { background: var(--surface-1); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.card.hi { background: var(--surface-hi); box-shadow: var(--shadow); }
.card.tonal { background: var(--primary-container); color: var(--on-primary-container); }
.card.outlined { background: transparent; border: 1px solid var(--outline-var); }
.card h3 { margin: 0 0 8px; font-size: 1rem; }
.card .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.card .card-head h3 { margin: 0; flex: 1; }
.card-link { cursor: pointer; }

.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpis.three { grid-template-columns: repeat(3, 1fr); }
.kpi { background: var(--surface-2); border-radius: 16px; padding: 12px; min-width: 0; }
.card.tonal .kpi { background: hsla(0, 0%, 100%, .45); }
:root[data-theme="dark"] .card.tonal .kpi { background: hsla(0, 0%, 0%, .2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card.tonal .kpi { background: hsla(0, 0%, 0%, .2); } }
.kpi .l { font-size: .78rem; color: var(--on-surface-var); }
.card.tonal .kpi .l { color: inherit; opacity: .8; }
.kpi .v { font-size: 1.25rem; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .d { font-size: .75rem; margin-top: 2px; }
.hero-num { font-size: 2.4rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }

.delta { font-size: .78rem; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.delta.flat { color: var(--on-surface-var); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 22px; border-radius: 24px; border: 0; cursor: pointer;
  background: var(--primary); color: var(--on-primary); font-weight: 600; font-size: 1rem;
  transition: transform .1s, filter .2s, background .2s; text-align: center; line-height: 1.2;
}
.btn:active { transform: scale(.97); }
.btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn.outlined { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
.btn.text { background: transparent; color: var(--primary); padding: 0 12px; }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.big { min-height: 64px; font-size: 1.15rem; border-radius: 32px; width: 100%; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: .88rem; }
.btn:disabled { opacity: .45; pointer-events: none; }
.icon-btn { width: 48px; height: 48px; border-radius: 24px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--on-surface-var); position: relative; flex: none; }
.icon-btn:active { background: var(--surface-3); }
.icon-btn.tonal { background: var(--surface-2); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1; }

/* ---------- chips & segmented ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--outline-var); background: transparent; font-size: .88rem; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.chip.on { background: var(--secondary-container); border-color: transparent; color: var(--on-secondary-container); font-weight: 600; }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; }
.seg { display: flex; border: 1px solid var(--outline); border-radius: 22px; overflow: hidden; }
.seg button { flex: 1; min-height: 42px; border: 0; background: transparent; font-weight: 600; font-size: .9rem; cursor: pointer; padding: 0 8px; }
.seg button + button { border-inline-start: 1px solid var(--outline); }
.seg button.on { background: var(--secondary-container); color: var(--on-secondary-container); }

/* ---------- lists ---------- */
.list { background: var(--surface-1); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 64px; cursor: pointer; position: relative; border: 0; background: none; width: 100%; text-align: start; }
.item + .item { border-top: 1px solid var(--outline-var); }
.item:active { background: var(--surface-3); }
.item .lead { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; font-weight: 700; }
.item .body { flex: 1; min-width: 0; }
.item .t, .item .s, .switch-row .t, .switch-row .s { display: block; }
.item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font-size: .82rem; color: var(--on-surface-var); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .trail { text-align: end; flex: none; }
.item .trail .a { font-weight: 700; }
.role-bar { width: 6px; align-self: stretch; border-radius: 3px; flex: none; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: var(--surface-3); color: var(--on-surface-var); vertical-align: middle; }
.tag.override { background: var(--override-bg); color: var(--override); }
.tag.rest { background: var(--rest-tint); color: var(--rest-mark); }
.tag.planned { background: var(--secondary-container); color: var(--on-secondary-container); }
.tag.good { background: var(--good-bg); color: var(--good); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag svg.i { width: 13px; height: 13px; }

/* ---------- forms ---------- */
.field { display: block; margin-bottom: 14px; }
.field > .lbl { display: block; font-size: .82rem; font-weight: 600; color: var(--on-surface-var); margin: 0 4px 6px; }
.field .hint { display: block; font-size: .75rem; color: var(--on-surface-var); margin: 4px 4px 0; }
.input, select.input, textarea.input {
  width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--outline-var);
  background: var(--surface-hi); font-size: 1rem; outline: none; transition: border-color .15s, box-shadow .15s;
}
textarea.input { min-height: 90px; resize: vertical; }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px hsla(var(--h), 70%, 55%, .18); }
.input[type="time"], .input[type="date"], .input[type="number"], .input.ltr { direction: ltr; text-align: right; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.switch-row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; min-height: 56px; cursor: pointer; }
.switch-row .body { flex: 1; }
.switch-row .t { font-weight: 600; }
.switch-row .s { font-size: .8rem; color: var(--on-surface-var); }
.switch { appearance: none; width: 52px; height: 32px; border-radius: 16px; background: var(--surface-3); border: 2px solid var(--outline); position: relative; flex: none; cursor: pointer; transition: background .2s, border-color .2s; margin: 0; }
.switch::after { content: ''; position: absolute; top: 50%; inset-inline-start: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--outline); transform: translateY(-50%); transition: all .2s var(--ease); }
.switch:checked { background: var(--primary); border-color: var(--primary); }
.switch:checked::after { inset-inline-start: 24px; width: 22px; height: 22px; background: var(--on-primary); }
.radio-list label { display: flex; align-items: center; gap: 12px; padding: 12px 4px; cursor: pointer; }
.radio-list input { width: 22px; height: 22px; accent-color: var(--primary); }
.color-pick { display: flex; gap: 10px; flex-wrap: wrap; }
.color-pick button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
.color-pick button.on { border-color: var(--on-surface); box-shadow: inset 0 0 0 3px var(--surface); }

/* ---------- timer ---------- */
.timer-card { text-align: center; padding: 20px 16px; }
.timer-card .clock { font-size: 3rem; font-weight: 800; letter-spacing: .02em; direction: ltr; font-variant-numeric: tabular-nums; line-height: 1.1; }
.timer-card .meta { margin: 6px 0 14px; color: var(--on-surface-var); font-size: .9rem; }
.timer-card.running { background: var(--primary-container); color: var(--on-primary-container); }
.timer-card.running .meta { color: inherit; opacity: .85; }
.pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--bad-mark); margin-inline-end: 6px; animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(208, 59, 59, .55); } 70% { box-shadow: 0 0 0 10px rgba(208, 59, 59, 0); } 100% { box-shadow: 0 0 0 0 rgba(208, 59, 59, 0); } }
.role-picker { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }

/* ---------- progress ---------- */
.progress { height: 12px; border-radius: 6px; background: var(--surface-3); overflow: hidden; position: relative; }
.progress > i { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 6px; background: var(--primary); transition: width .6s var(--ease); }
.progress > b { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 6px; background: var(--primary); opacity: .3; }
.card.tonal .progress { background: hsla(0, 0%, 100%, .5); }

/* ---------- insights ---------- */
.insight { display: flex; gap: 12px; padding: 12px 0; }
.insight + .insight { border-top: 1px solid var(--outline-var); }
.insight .ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.insight .t { font-weight: 700; }
.insight .b { font-size: .9rem; }
.insight .x { font-size: .76rem; color: var(--on-surface-var); margin-top: 4px; }
.sev-info .ic { background: var(--secondary-container); color: var(--on-secondary-container); }
.sev-warn .ic { background: var(--warn-bg); color: var(--warn); }
.sev-critical .ic { background: var(--bad-bg); color: var(--bad); }
.sev-good .ic { background: var(--good-bg); color: var(--good); }
.notif.unread { background: var(--surface-2); }
.notif .when { font-size: .72rem; color: var(--on-surface-var); }

/* ---------- calendar ---------- */
.cal-nav { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.cal-nav h2 { flex: 1; text-align: center; font-size: 1.1rem; margin: 0; }
.cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: .75rem; color: var(--on-surface-var); font-weight: 600; margin-bottom: 4px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; touch-action: pan-y; }
.cal-day {
  aspect-ratio: .78; border-radius: 12px; background: var(--surface-1); border: 0; padding: 4px 2px; display: flex; flex-direction: column; align-items: center;
  cursor: pointer; position: relative; min-width: 0; overflow: hidden;
}
.cal-day.other { opacity: .38; }
.cal-day.rest { background: var(--rest-tint); }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--primary); }
.cal-day.sel { background: var(--secondary-container); }
.cal-day .dn { font-weight: 700; font-size: .95rem; line-height: 1.2; }
.cal-day .hd { font-size: .58rem; color: var(--on-surface-var); line-height: 1; }
.cal-day .dots { display: flex; gap: 2px; margin-top: 3px; flex-wrap: wrap; justify-content: center; }
.cal-day .dots i { width: 7px; height: 7px; border-radius: 50%; }
.cal-day .dots i.pl { background: transparent !important; box-shadow: inset 0 0 0 1.5px currentColor; }
.cal-day .amt { font-size: .6rem; font-weight: 700; margin-top: auto; direction: ltr; white-space: nowrap; }
.cal-day .ovr { position: absolute; top: 3px; inset-inline-end: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--override); }
.cal-day .hol { position: absolute; top: 3px; inset-inline-start: 3px; font-size: .55rem; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: .78rem; color: var(--on-surface-var); margin: 10px 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.week-row { display: flex; gap: 10px; padding: 10px 12px; align-items: stretch; }
.week-row + .week-row { border-top: 1px solid var(--outline-var); }
.week-row .wd { width: 52px; flex: none; text-align: center; }
.week-row .wd .n { font-size: 1.3rem; font-weight: 800; line-height: 1.1; }
.week-row.rest { background: var(--rest-tint); }
.week-row .tl { flex: 1; min-width: 0; }
.timeline { position: relative; height: 24px; border-radius: 6px; background: var(--surface-2); margin: 4px 0; overflow: hidden; }
.timeline i { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; }
.timeline .rz { position: absolute; top: 0; bottom: 0; background: var(--rest-tint); border-inline: 1px dashed var(--rest-mark); }

/* ---------- breakdown table ---------- */
.bd { width: 100%; border-collapse: collapse; font-size: .88rem; }
.bd td { padding: 8px 4px; border-bottom: 1px solid var(--outline-var); vertical-align: top; }
.bd td.a { text-align: left; font-weight: 700; white-space: nowrap; direction: ltr; }
.bd tr.tot td { font-weight: 800; border-bottom: 0; font-size: 1rem; }
.bd .f { font-size: .76rem; color: var(--on-surface-var); direction: ltr; text-align: right; unicode-bidi: plaintext; }

/* ---------- findings ---------- */
.finding { border-radius: 16px; padding: 14px; margin-bottom: 10px; background: var(--surface-1); border-inline-start: 6px solid var(--outline-var); }
.finding.ok { border-color: var(--good-mark); }
.finding.warn { border-color: var(--warn-mark); }
.finding.bad { border-color: var(--bad-mark); }
.finding .ft { display: flex; gap: 8px; align-items: flex-start; font-weight: 700; }
.finding .ft .amt { margin-inline-start: auto; color: var(--bad); white-space: nowrap; }
.finding .fd { font-size: .9rem; margin-top: 6px; }
.finding .fb { font-size: .76rem; color: var(--on-surface-var); margin-top: 6px; }
.conf { font-size: .72rem; font-weight: 700; }
.conf.high { color: var(--good); } .conf.medium { color: var(--warn); } .conf.low { color: var(--on-surface-var); }
.status-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.status-summary div { border-radius: 14px; padding: 10px; text-align: center; font-weight: 700; }
.status-summary .ok { background: var(--good-bg); color: var(--good); }
.status-summary .warn { background: var(--warn-bg); color: var(--warn); }
.status-summary .bad { background: var(--bad-bg); color: var(--bad); }
.disclaimer { font-size: .76rem; color: var(--on-surface-var); background: var(--surface-1); border-radius: 12px; padding: 10px 12px; margin: 12px 0; display: flex; gap: 8px; }
.code { white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .78rem; background: var(--surface-2); border-radius: 12px; padding: 10px; max-height: 300px; overflow: auto; direction: rtl; text-align: right; }

/* ---------- charts ---------- */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-size: 11px; fill: var(--on-surface-var); font-family: inherit; }
.chart .grid line { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart-tip { position: fixed; z-index: 60; pointer-events: none; background: var(--on-surface); color: var(--surface); padding: 6px 10px; border-radius: 10px; font-size: .8rem; box-shadow: var(--shadow); white-space: nowrap; transform: translate(-50%, -110%); }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--on-surface-var); margin-top: 6px; }
.chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: middle; }
.hbar { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: .85rem; }
.hbar .nm { width: 70px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { flex: 1; height: 14px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.hbar .track i { display: block; height: 100%; border-radius: 4px; }
.hbar .vv { width: 92px; flex: none; text-align: left; direction: ltr; font-weight: 600; font-variant-numeric: tabular-nums; }
/* admin dashboard */
.admin .section-title { margin-top: 18px; }
.adm-bar { display: flex; align-items: center; gap: 10px; margin: 9px 0; font-size: .85rem; }
.adm-bar .nm { width: 118px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adm-bar .track { flex: 1; height: 12px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.adm-bar .track i { display: block; height: 100%; border-radius: 6px; background: var(--primary); min-width: 2px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.adm-bar .vv { width: 74px; flex: none; text-align: left; direction: ltr; font-weight: 600; font-variant-numeric: tabular-nums; font-size: .8rem; }
.adm-add { display: flex; gap: 8px; margin: 10px 0 8px; }
.adm-add .input { flex: 1; min-width: 0; font-family: ui-monospace, monospace; font-size: .85rem; }
.adm-add .btn { flex: none; }
.admin .kpi .v { font-variant-numeric: tabular-nums; }
.adm-foot { display: flex; align-items: center; justify-content: space-between; margin: 14px 4px 4px; }
@media (max-width: 380px) {
  .adm-bar { gap: 8px; }
  .adm-bar .nm { width: 92px; font-size: .8rem; }
  .adm-bar .vv { width: 64px; font-size: .75rem; }
}
.stackbar { display: flex; height: 18px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--surface); }
.stackbar i { display: block; height: 100%; }

/* ---------- sheets, dialogs, toasts ---------- */
.backdrop { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; transition: opacity .25s; }
.backdrop.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; margin: 0 auto; max-width: 600px;
  background: var(--surface); border-radius: 28px 28px 0 0; max-height: 94vh; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .3s var(--ease); box-shadow: var(--shadow-up);
}
.sheet.show { transform: none; }
.sheet.full { height: 94vh; }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--outline); margin: 10px auto 2px; flex: none; }
.sheet .sh-head { display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 16px; flex: none; }
.sheet .sh-head h2 { flex: 1; font-size: 1.2rem; margin: 0; }
.sheet .sh-body { overflow-y: auto; padding: 4px 16px 16px; flex: 1; overscroll-behavior: contain; }
.sheet .sh-foot { padding: 12px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--outline-var); display: flex; gap: 8px; flex: none; background: var(--surface); }
.sheet .sh-foot .btn { flex: 1; }
.dialog { position: fixed; z-index: 50; inset: 0; display: grid; place-items: center; padding: 24px; }
.dialog .box { background: var(--surface-hi); border-radius: 28px; padding: 24px; width: 100%; max-width: 400px; box-shadow: var(--shadow); animation: pop .2s var(--ease); }
.dialog .box h3 { margin: 0 0 8px; font-size: 1.2rem; }
.dialog .box .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
.toast {
  position: fixed; z-index: 70; left: 16px; right: 16px; bottom: calc(var(--nav-h) + var(--safe-b) + 12px); margin: 0 auto; max-width: 560px;
  background: var(--on-surface); color: var(--surface); border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 12px;
  box-shadow: var(--shadow); transform: translateY(30px); opacity: 0; transition: all .25s var(--ease);
}
.toast.show { transform: none; opacity: 1; }
.toast .act { background: none; border: 0; color: var(--primary-container); font-weight: 800; cursor: pointer; padding: 6px 8px; }
.banner { display: flex; gap: 10px; align-items: center; background: var(--secondary-container); color: var(--on-secondary-container); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; font-size: .9rem; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner .btn { min-height: 36px; padding: 0 14px; font-size: .85rem; }

/* ---------- empty states ---------- */
.empty { text-align: center; padding: 28px 16px; color: var(--on-surface-var); }
.empty .art { width: 96px; height: 96px; margin: 0 auto 12px; border-radius: 32px; background: var(--primary-container); color: var(--on-primary-container); display: grid; place-items: center; }
.empty .art svg { width: 48px; height: 48px; }
.empty h3 { color: var(--on-surface); margin: 0 0 6px; }

/* ---------- onboarding & lock ---------- */
.wizard { min-height: 100vh; display: flex; flex-direction: column; padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b)); max-width: 600px; margin: 0 auto; }
.wizard .steps { display: flex; gap: 6px; margin: 8px 0 20px; }
.wizard .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); }
.wizard .steps i.on { background: var(--primary); }
.wizard h1 { font-size: 1.7rem; margin: 0 0 6px; }
.wizard .lead { color: var(--on-surface-var); margin: 0 0 18px; }
.wizard .content { flex: 1; animation: viewIn .3s var(--ease); }
.wizard .foot { display: flex; gap: 10px; padding-top: 12px; position: sticky; bottom: 0; background: var(--surface); padding-bottom: 4px; }
.wizard .foot .btn { flex: 1; }
.wizard .foot.col { flex-direction: column; }
.wizard .foot.col .btn { flex: none; width: 100%; }
.role-edit { display: grid; grid-template-columns: 44px 1fr 110px 40px; gap: 8px; align-items: center; margin-bottom: 10px; }
.role-edit .sw { width: 40px; height: 40px; border-radius: 12px; border: 0; cursor: pointer; }
@media (max-width: 380px) { .role-edit { grid-template-columns: 40px 1fr 76px 32px; gap: 6px; } }
.lock { position: fixed; inset: 0; z-index: 100; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
.pin-dots { display: flex; gap: 14px; }
.pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--outline); }
.pin-dots i.f { background: var(--primary); border-color: var(--primary); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; direction: ltr; }
.pin-pad button { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 1.6rem; font-weight: 600; cursor: pointer; }
.pin-pad button:active { background: var(--surface-3); }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

/* ---------- misc ---------- */
.share-card { background: linear-gradient(160deg, var(--primary-container), var(--surface-1)); }
.divider { height: 1px; background: var(--outline-var); margin: 12px 0; }
details.collapse { background: var(--surface-1); border-radius: 16px; margin-bottom: 12px; }
details.collapse > summary { list-style: none; padding: 14px 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
details.collapse > summary::-webkit-details-marker { display: none; }
details.collapse > summary::after { content: '‹'; margin-inline-start: auto; transform: rotate(-90deg); transition: transform .2s; font-size: 1.3rem; }
details.collapse[open] > summary::after { transform: rotate(90deg); }
details.collapse > .in { padding: 0 16px 14px; }
.ov-block { border: 1px dashed var(--outline-var); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
.ov-block.on { border-style: solid; border-color: var(--override); background: var(--override-bg); }
.ov-block .ov-head { display: flex; align-items: center; gap: 10px; }
.ov-block .ov-head .t { flex: 1; font-weight: 700; }
.ov-block .ov-in { margin-top: 10px; }
.seg-line { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 8px; align-items: end; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: .9rem; }
.kv + .kv { border-top: 1px dashed var(--outline-var); }
.ver { font-size: .75rem; color: var(--on-surface-var); text-align: center; margin: 18px 0; }
.swipe-area { touch-action: pan-y; }
.compare-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; align-items: center; padding: 8px 0; font-size: .86rem; }
.compare-row + .compare-row { border-top: 1px solid var(--outline-var); }
.compare-row .h { font-size: .72rem; color: var(--on-surface-var); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (min-width: 420px) { .kpis.wide4 { grid-template-columns: repeat(4, 1fr); } }


/* ============================================================
 * Identity layer (overrides the base component styles above)
 * ============================================================ */
h1, h2, .topbar h1, .wizard h1, .sheet .sh-head h2, .hero-num, .bday-title, .chat-hello { font-family: var(--display); }
.topbar h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -.01em; }
.topbar .sub { font-size: .82rem; }
.hero-num { font-weight: 700; font-size: 2.6rem; letter-spacing: -.025em; }
.kpi .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.section-title { font-size: .78rem; font-weight: 600; color: var(--on-surface-var); letter-spacing: .02em; margin: 24px 2px 10px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); margin-inline-start: 6px; order: 99; }
.section-title .spacer { display: none; }

/* views: quick, direction-aware entrance (no generic fade-up) */
.view { animation: none; }
.view.enter-next { animation: slideFromStart .22s var(--ease); }
.view.enter-prev { animation: slideFromEnd .22s var(--ease); }
@keyframes slideFromStart { from { transform: translateX(-10px); } to { transform: none; } }
@keyframes slideFromEnd { from { transform: translateX(10px); } to { transform: none; } }

/* cards: paper sheets with a hairline instead of tinted blobs */
.card { background: var(--surface-1); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: var(--radius); }
.card.outlined { background: transparent; }
.card.tonal { background: var(--hero); color: var(--on-hero); border-color: transparent; }
.card.tonal .kpi { background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .08); }
.card.tonal .kpi .l, .card.tonal .tiny, .card.tonal .small { color: inherit; opacity: .82; }
.card.tonal .hero-num { color: #fff; }
.card.tonal .progress { background: rgba(255, 255, 255, .14); }
.card.tonal .progress > i { background: var(--amber); }
.card.tonal .progress > b { background: var(--amber); opacity: .35; }
.card.tonal .delta.up { color: #8fe0ae; } .card.tonal .delta.down { color: #ffb4a8; }
.kpi { background: var(--surface-2); border-radius: var(--radius-s); }
.list { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius); }
.item + .item { border-top-color: var(--line); }
.item .lead { border-radius: 10px; }
details.collapse { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius); }

/* buttons: squared, firm */
.btn { border-radius: 10px; min-height: 48px; font-weight: 600; letter-spacing: .005em; transition: background .15s, filter .15s, box-shadow .15s; }
.btn:active { transform: none; filter: brightness(.92); }
.btn.big { border-radius: 12px; min-height: 58px; font-size: 1.1rem; }
.btn.tonal { background: var(--surface-3); color: var(--on-surface); }
.btn.outlined { border-color: var(--outline-var); color: var(--on-surface); }
.btn.text { color: var(--primary); }
.icon-btn { border-radius: 10px; }
.icon-btn.tonal { background: var(--surface-1); border: 1px solid var(--line); }
.chip { border-radius: 8px; border-color: var(--line); background: var(--surface-1); }
.chip.on { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.seg { border-radius: 10px; border-color: var(--line); background: var(--surface-1); padding: 3px; gap: 3px; }
.seg button { border-radius: 8px; min-height: 40px; }
.seg button + button { border-inline-start: 0; }
.seg button.on { background: var(--primary); color: var(--on-primary); }
.input, select.input, textarea.input { border-radius: 10px; border-color: var(--line); background: var(--surface-hi); }
.tag { border-radius: 6px; }
.banner { border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--surface-1); color: var(--on-surface); }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }

/* timer: amber clock on ink when running */
.timer-card.running { background: var(--hero); color: var(--on-hero); border-color: transparent; }
.timer-card.running .clock { color: var(--amber); }
.timer-card .clock { font-family: var(--display); font-weight: 600; letter-spacing: .01em; }
.timer-card.running .btn.big { background: var(--amber); color: var(--on-amber); }
.timer-card.running .btn.tonal { background: rgba(255, 255, 255, .1); color: var(--on-hero); }

/* bottom navigation: hairline + amber marker, square action button */
.nav { background: var(--surface-1); box-shadow: none; border-top: 1px solid var(--line); }
.nav button .pill { width: 44px; height: 30px; border-radius: 8px; }
.nav button.on .pill { background: transparent; color: var(--primary); }
.nav button.on .pill::before { content: ''; position: absolute; top: -11px; width: 22px; height: 3px; border-radius: 0 0 3px 3px; background: var(--amber); }
.nav button.on { color: var(--on-surface); font-weight: 700; }
.nav .fab { width: 56px; height: 56px; border-radius: 16px; background: var(--amber); color: var(--on-amber); box-shadow: 0 6px 16px rgba(226, 162, 36, .35); margin-top: -14px; }
.dot-badge { background: var(--bad-mark); }

/* sheets: drawer motion */
.sheet { border-radius: 18px 18px 0 0; background: var(--surface); transition: transform .34s var(--ease); }
.sheet .grab { background: var(--outline-var); width: 40px; }
.sheet .sh-foot { border-top-color: var(--line); }
.dialog .box { border-radius: 16px; border: 1px solid var(--line); }
.toast { border-radius: 10px; }

/* calendar */
.cal-day { border-radius: 8px; background: var(--surface-1); border: 1px solid var(--line); }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--amber); }
.cal-nav h2 { font-family: var(--display); }

/* home quick actions */
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 6px; }
.quick button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-1); cursor: pointer; font-weight: 600; font-size: .82rem; color: var(--on-surface); }
.quick button svg { color: var(--primary); }
.quick button:active { background: var(--surface-3); }

/* brand mark (app icon) for login, wizard and legal screens */
.brand-mark { width: 72px; height: 72px; margin: 0 auto 14px; background: url("icon-192.png") center / contain no-repeat; border-radius: 18px; }
.brand-mark.big { width: 96px; height: 96px; border-radius: 24px; }
.brand-name { font-family: var(--display); font-weight: 800; font-size: 2.5rem; letter-spacing: -.03em; line-height: 1; margin: 6px 0 4px; }
.brand-sub { color: var(--on-surface-var); font-weight: 600; margin-bottom: 14px; }
.empty .art { border-radius: 18px; background: var(--surface-2); color: var(--primary); }

/* birthday */
.bday { position: relative; overflow: hidden; background: var(--amber-soft); border-color: transparent; }
.bday-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
.bday-confetti { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(circle, var(--amber) 2px, transparent 2.5px), radial-gradient(circle, var(--primary) 1.6px, transparent 2px), radial-gradient(circle, var(--bad-mark) 1.6px, transparent 2px); background-size: 46px 46px, 38px 38px, 58px 58px; background-position: 0 0, 18px 12px, 30px 26px; opacity: .35; animation: confetti 6s linear infinite; }
@keyframes confetti { to { background-position: 0 92px, 18px 88px, 30px 142px; } }
.bday > div:not(.bday-confetti) { position: relative; }

/* assistant chat */
.chat-sheet .sh-body { display: flex; flex-direction: column; }
.chat-consent { display: flex; gap: 8px; font-size: .76rem; color: var(--on-surface-var); background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 8px 10px; margin-bottom: 10px; }
.chat-share { display: flex; gap: 6px; align-items: flex-start; margin-top: 4px; cursor: pointer; }
.chat-share input { margin-top: 3px; accent-color: var(--primary); }
.chat-empty { text-align: center; padding: 18px 0 6px; }
.chat-hello { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
.chat-sugg { flex-wrap: wrap; justify-content: center; overflow: visible; }
.chat-sugg .chip { height: auto; min-height: 36px; padding: 8px 12px; white-space: normal; text-align: start; }
.chat-log { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; font-size: .94rem; line-height: 1.55; word-wrap: break-word; }
.msg.user { align-self: flex-start; background: var(--primary); color: var(--on-primary); border-start-start-radius: 4px; white-space: pre-wrap; }
.msg.assistant { align-self: flex-end; background: var(--surface-1); border: 1px solid var(--line); border-start-end-radius: 4px; }
.msg.assistant p { margin: 0 0 6px; } .msg.assistant p:last-child { margin: 0; }
.msg.assistant ul { margin: 4px 0 6px; padding-inline-start: 18px; }
.msg.error { border-color: var(--bad-mark); }
.msg .dots { display: inline-flex; gap: 4px; }
.msg .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--outline); animation: blink 1.2s infinite; }
.msg .dots i:nth-child(2) { animation-delay: .2s; } .msg .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.chat-legal { text-align: center; margin: 10px 0 2px; }
.chat-sheet .sh-foot { align-items: flex-end; gap: 8px; }
textarea.input.chat-input { min-height: 46px; height: 46px; max-height: 140px; resize: none; padding: 11px 12px; flex: 1; }
.chat-send { background: var(--primary); color: var(--on-primary); width: 46px; height: 46px; }
.chat-sheet .sh-foot .chat-send svg { transform: scaleX(-1); }

/* legal documents */
.legal { font-size: .92rem; line-height: 1.7; }
.legal h4 { font-family: var(--display); font-size: 1.05rem; margin: 18px 0 4px; }
.legal p { margin: 0 0 8px; }
.legal ul { padding-inline-start: 20px; margin: 4px 0 10px; }
.legal-meta { color: var(--on-surface-var); font-size: .8rem; }
.legal-summary ul { margin: 6px 0 0; padding-inline-start: 18px; line-height: 1.7; }

/* ---------- print (PDF report) ---------- */
#print-root { display: none; }
@media print {
  body { background: #fff; color: #000; }
  #app, .nav, .sheet, .backdrop, .toast, .lock { display: none !important; }
  #print-root { display: block; padding: 0; font-size: 11pt; }
  #print-root h1 { font-size: 18pt; margin: 0 0 4pt; }
  #print-root table { width: 100%; border-collapse: collapse; margin: 8pt 0; }
  #print-root th, #print-root td { border: 1px solid #bbb; padding: 4pt 6pt; text-align: right; font-size: 9.5pt; }
  #print-root th { background: #eee; }
  #print-root .kp { display: inline-block; border: 1px solid #ccc; border-radius: 6pt; padding: 6pt 10pt; margin: 0 0 6pt 6pt; }
  @page { size: A4; margin: 14mm; }
}

.btn:disabled { opacity: 1; background: var(--surface-3); color: var(--on-surface-var); }

/* font picker (Settings › Appearance) */
.font-pick { display: grid; gap: 8px; }
.font-pick button { display: flex; align-items: center; gap: 12px; text-align: start; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-1); cursor: pointer; color: var(--on-surface); }
.font-pick button.on { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.font-pick .fp-sample { flex: 1; font-size: 1.15rem; line-height: 1.3; }
.font-pick .fp-sample small { display: block; font-size: .78rem; color: var(--on-surface-var); }
.font-pick .fp-num { font-size: 1.25rem; font-weight: 700; }

/* ---- feedback effects (Settings › Look › Effects & sounds) ---- */
/* tap ring: the outline of the tapped control expands from its centre and fades */
.fx-ring { position: fixed; z-index: 9999; pointer-events: none; box-sizing: border-box; animation: fx-ring .5s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes fx-ring {
  from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 55%, transparent); }
  to { box-shadow: 0 0 0 12px color-mix(in srgb, var(--primary) 0%, transparent); }
}
.fx-coin { position: fixed; z-index: 9999; pointer-events: none; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; display: grid; place-items: center; font: 800 12px/1 var(--font); color: #8a5300; background: radial-gradient(circle at 35% 35%, #ffe08a, #ffb524 65%, #d68a00); box-shadow: 0 0 0 1.5px #c98200 inset, 0 3px 8px rgba(214, 138, 0, .35); animation: fx-coin 1s cubic-bezier(.2, .8, .3, 1) forwards; }
@keyframes fx-coin { 0% { transform: translateY(0) scale(.4) rotateY(0); opacity: 0; } 20% { opacity: 1; } 60% { transform: translateY(-34px) scale(1) rotateY(360deg); opacity: 1; } 100% { transform: translateY(-46px) scale(.9) rotateY(540deg); opacity: 0; } }
.fx-shake { animation: fx-shake .42s cubic-bezier(.36, .07, .19, .97) both; }
@keyframes fx-shake { 10%, 90% { translate: -2px 0; } 20%, 80% { translate: 4px 0; } 30%, 50%, 70% { translate: -7px 0; } 40%, 60% { translate: 7px 0; } }

/* ---- opening animation ---- */
#intro { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 30%, #143b8a 0%, #0d2b6b 55%, #0a2156 100%); color: #fff; overflow: hidden; }
#intro .intro-stage { display: flex; flex-direction: column; align-items: center; margin-top: -6vh; }
#intro .intro-mark { position: relative; width: 132px; height: 132px; }
#intro .intro-logo { width: 100%; height: 100%; overflow: visible; }
#intro .intro-logo path { fill: none; stroke-width: 104; stroke-linecap: round; stroke-linejoin: round; }
#intro .intro-logo .g { stroke: #2ee59d; }
#intro .intro-logo .y { stroke: #ffb524; }
#intro .intro-word { font: 800 2.9rem/1 'Rubik', system-ui, sans-serif; letter-spacing: -.03em; margin-top: 26px; }
#intro .intro-sub { font: 600 1rem/1.4 'Rubik', 'Assistant', system-ui, sans-serif; color: rgba(255, 255, 255, .72); margin-top: 8px; }
#intro .intro-coins { position: absolute; inset: 50% auto auto 50%; width: 0; height: 0; }
#intro .intro-coins i { position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 14px/1 'Rubik', sans-serif; font-style: normal; color: #8a5300; background: radial-gradient(circle at 35% 35%, #ffe08a, #ffb524 65%, #d68a00); box-shadow: 0 0 0 1.5px #c98200 inset, 0 4px 10px rgba(0, 0, 0, .25); opacity: 0; animation: intro-coin .9s cubic-bezier(.2, .8, .3, 1) forwards; }
@keyframes intro-coin {
  0% { opacity: 0; transform: translate(0, 0) scale(.3) rotate(0); }
  15% { opacity: 1; }
  55% { opacity: 1; transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--r)); }
  100% { opacity: 0; transform: translate(calc(var(--dx) * 1.15), calc(var(--dy) + 70px)) scale(.8) rotate(calc(var(--r) * 2)); }
}
/* full version: draw → clock spin → coins → name */
#intro.play .intro-logo path { stroke-dasharray: 1 2; stroke-dashoffset: 1; animation: intro-draw .6s cubic-bezier(.65, 0, .35, 1) forwards; }
#intro.play .intro-logo .y { animation-delay: .16s; }
#intro.play .intro-logo { animation: intro-spin .6s cubic-bezier(.45, 0, .25, 1) .68s both; }
#intro.play .intro-word { opacity: 0; animation: intro-up .5s cubic-bezier(.2, .8, .3, 1) .78s forwards; }
#intro.play .intro-sub { opacity: 0; animation: intro-up .5s cubic-bezier(.2, .8, .3, 1) .9s forwards; }
@keyframes intro-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes intro-spin { from { transform: rotate(-360deg) scale(1); } 60% { transform: rotate(14deg) scale(1.06); } to { transform: rotate(0) scale(1); } }
@keyframes intro-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
/* still waiting for the app: the logo keeps turning */
#intro.wait .intro-logo { animation: intro-turn 1.1s linear infinite; }
@keyframes intro-turn { to { transform: rotate(360deg); } }
#intro.out { animation: intro-out .5s cubic-bezier(.7, 0, .3, 1) forwards; pointer-events: none; }
#intro.out .intro-stage { animation: intro-stage-out .5s cubic-bezier(.7, 0, .3, 1) forwards; }
@keyframes intro-out { to { opacity: 0; } }
@keyframes intro-stage-out { to { transform: scale(.82); opacity: 0; } }
#intro.still.out { animation-duration: .25s; }

/* ---- pull to refresh ---- */
html, body { overscroll-behavior-y: contain; }
.ptr { position: fixed; top: calc(var(--safe-t) + 6px); left: 50%; z-index: 60; transform: translate(-50%, -64px); opacity: 0; pointer-events: none; }
.ptr.settle { transition: transform .35s var(--ease), opacity .35s var(--ease); }
.ptr-disc { position: relative; width: 44px; height: 44px; border-radius: 50%; background: var(--surface-hi); box-shadow: 0 4px 14px rgba(0, 0, 0, .16), 0 0 0 1px var(--line); display: grid; place-items: center; transition: background-color .2s; }
.ptr-disc svg { width: 26px; height: 26px; overflow: visible; }
.ptr-disc path { fill: none; stroke-width: 120; stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: calc(1 - var(--p, 0)); }
.ptr-disc .g { stroke: #2ee59d; }
.ptr-disc .y { stroke: #ffb524; }
.ptr.armed .ptr-disc { background: #0d2b6b; animation: ptr-pop .25s cubic-bezier(.34, 1.56, .64, 1); }
.ptr.spin .ptr-disc { background: #0d2b6b; animation: intro-turn .8s linear infinite; --p: 1; }
.ptr-check { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font: 800 20px/1 var(--font); opacity: 0; transform: scale(.5); transition: opacity .2s, transform .25s cubic-bezier(.34, 1.56, .64, 1); }
.ptr.done .ptr-disc { background: var(--good-mark); transform: none !important; }
.ptr.done .ptr-disc svg { opacity: 0; }
.ptr.done .ptr-check { opacity: 1; transform: none; }
@keyframes ptr-pop { 50% { scale: 1.18; } }

/* ---- small moments ---- */
body.fx .first .wave { display: inline-block; transform-origin: 70% 80%; animation: fx-wave 1.6s ease-in-out .2s 1; }
@keyframes fx-wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(-4deg); } 50% { transform: rotate(10deg); } }
body.fx .first .progress i, body.fx .first .progress b { animation: fx-fill .9s cubic-bezier(.2, .8, .3, 1) both; transform-origin: right; }
@keyframes fx-fill { from { transform: scaleX(0); } }
body.fx .first .dot-badge { animation: fx-badge .5s cubic-bezier(.34, 1.56, .64, 1) .3s both; }
@keyframes fx-badge { from { transform: scale(0); } }
html:not(.vt-reveal) #view { view-transition-name: page; }
html:not(.vt-reveal) .nav { view-transition-name: nav; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html.vt-reveal::view-transition-new(root) { animation: fx-reveal .6s cubic-bezier(.4, 0, .2, 1) both; }
html[data-nav] { --vt-shift: -12px; }
html[data-nav="prev"] { --vt-shift: 12px; }
::view-transition-old(page) { animation: vt-out .14s ease-in both; }
::view-transition-new(page) { animation: vt-in .26s cubic-bezier(.2, .8, .3, 1) .03s both; }
::view-transition-group(nav) { animation-duration: .18s; }
@keyframes vt-out { to { opacity: 0; transform: translateX(calc(var(--vt-shift) * -1)); } }
@keyframes vt-in { from { opacity: 0; transform: translateX(var(--vt-shift)); } }
@keyframes fx-reveal { from { clip-path: circle(0 at var(--vt-x, 50%) var(--vt-y, 50%)); } to { clip-path: circle(150vmax at var(--vt-x, 50%) var(--vt-y, 50%)); } }
.payday { background: linear-gradient(135deg, #0d2b6b, #1d4a8f); color: #fff; border: 0; }
.payday .pd-title { font: 800 1.35rem/1.2 var(--display); display: flex; align-items: center; gap: 8px; }
.payday .pd-emoji { font-size: 1.6rem; display: inline-block; animation: fx-float 2.4s ease-in-out infinite; }
.payday .btn { background: #ffb524; color: #231a05; margin-top: 12px; }
@keyframes fx-float { 50% { transform: translateY(-4px) rotate(-6deg); } }
@media (prefers-reduced-motion: reduce) { #intro *, .ptr * { animation: none !important; } }
.fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9998; }
body.fx .btn, body.fx .nav .fab, body.fx .chip, body.fx .quick button, body.fx .icon-btn, body.fx .nav .pill, body.fx .item { transition: transform .22s cubic-bezier(.34, 1.56, .64, 1), background-color .15s, filter .15s; }
body.fx .btn:active, body.fx .quick button:active, body.fx .chip:active { transform: scale(.94); }
body.fx .nav .fab:active { transform: scale(.88) rotate(-8deg); }
body.fx .nav .pill { transition: transform .12s ease-out, background-color .15s; }
body.fx .nav button:active .pill { transform: scale(.9); }
body.fx .icon-btn:active { transform: scale(.86); }
body.fx .item:active { transform: scale(.985); }

/* ---- home: one number, one action, one highlight ---- */
.home-top { display: flex; align-items: center; gap: 2px; min-height: 60px; padding: 6px 0 0; }
.home-top .titles { flex: 1; min-width: 0; }
.home-top h1 { font-size: 1.3rem; font-weight: 700; margin: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home-top .sub { font-size: .8rem; color: var(--on-surface-var); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home-top .icon-btn { position: relative; }
.home-hero { text-align: center; padding: 34px 8px 26px; margin: 4px -8px 6px; border-radius: 24px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color .15s; }
.home-hero:active { background: var(--surface-2); }
.home-hero .hh-label { font-size: .85rem; font-weight: 600; color: var(--on-surface-var); }
.home-hero .hero-num { font-size: 3.4rem; line-height: 1.05; margin: 6px 0 10px; }
.home-hero .hh-stats { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 6px 10px; font-size: .88rem; color: var(--on-surface-var); }
.home-hero .hh-stats b { color: var(--on-surface); font-weight: 700; }
.home-hero .hh-stats i { width: 3px; height: 3px; border-radius: 50%; background: var(--outline); opacity: .6; }
.home-hero .hh-goal { max-width: 240px; margin: 18px auto 0; }
.progress.thin { height: 6px; border-radius: 3px; }
.progress.thin > i, .progress.thin > b { border-radius: 3px; }
.home-hero .hh-goal-l { font-size: .78rem; color: var(--on-surface-var); margin-top: 8px; }
.home-action { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 4px 0 18px; }
.home-action .btn.start { width: 100%; }
.role-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 10px 6px 12px; font: 600 .85rem var(--font); color: var(--on-surface-var); cursor: pointer; }
.role-chip .sw { width: 9px; height: 9px; border-radius: 50%; }
.role-chip .chev { display: grid; transform: rotate(-90deg); opacity: .6; }
.role-chip .chev svg { width: 14px; height: 14px; }
.timer-card .tc-head { display: flex; align-items: center; gap: 4px; font-size: .88rem; font-weight: 700; text-align: start; }
.timer-card .tc-head .tiny { opacity: .75; font-weight: 500; }
.timer-card .tc-actions { display: flex; gap: 10px; align-items: center; }
.timer-card .tc-actions .btn.big { flex: 1; }
.icon-btn.lg { width: 56px; height: 56px; border-radius: 16px; flex: none; }
.timer-card.running .icon-btn.tonal { background: rgba(255, 255, 255, .12); color: inherit; }
.highlight { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-radius: 14px; padding: 13px 14px; margin: 0 0 22px; background: var(--surface-2); color: var(--on-surface); font: 500 .92rem/1.3 var(--font); text-align: start; cursor: pointer; }
.highlight .hl-ic { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--primary-container); color: var(--on-primary-container); flex: none; }
.highlight.sev-warn .hl-ic, .highlight.sev-critical .hl-ic { background: var(--warn-bg); color: var(--warn); }
.highlight.sev-good .hl-ic { background: var(--good-bg); color: var(--good); }
.highlight .hl-t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.highlight .hl-more { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--on-surface-var); }
.highlight > svg:last-child { width: 16px; height: 16px; opacity: .5; flex: none; }
.home-list-head { display: flex; align-items: center; justify-content: space-between; font-size: .85rem; font-weight: 700; color: var(--on-surface-var); margin: 0 4px 8px; }
.banner.slim { padding: 8px 12px; font-size: .85rem; gap: 8px; margin-bottom: 10px; }
.banner.slim .btn.text { padding: 4px 8px; min-height: 0; }

/* ---- my rights ---- */
.rights .rt-intro { display: flex; gap: 12px; align-items: center; padding: 4px 4px 12px; }
.rights .rt-intro > svg { width: 34px; height: 34px; color: var(--primary); flex: none; }
.rights .rt-search { margin-bottom: 6px; }
.rights .rt-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.rights .rt-row:last-child { border-bottom: 0; }
.rights .rt-row .t { font-weight: 600; }
.rights .rt-row .d { font-size: .85rem; color: var(--on-surface-var); }
.rights .rt-mark { flex: none; display: grid; place-items: center; width: 22px; height: 22px; color: var(--primary); }
.rights .rt-youth { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; }
.rights .rt-youth .rt-row { border-color: rgba(0, 0, 0, .08); }
.rights .rt-topics { padding: 2px 14px; }
.rights .rt-topic { border-bottom: 1px solid var(--line); }
.rights .rt-topic:last-child { border-bottom: 0; }
.rights .rt-topic summary { display: flex; align-items: center; gap: 10px; padding: 14px 0; font-weight: 700; cursor: pointer; list-style: none; }
.rights .rt-topic summary::-webkit-details-marker { display: none; }
.rights .rt-topic summary > span:first-of-type { flex: 1; }
.rights .rt-topic summary .chev { display: grid; transition: transform .2s; opacity: .5; }
.rights .rt-topic[open] summary .chev { transform: rotate(-90deg); }
.rights .rt-body { padding: 0 2px 14px; font-size: .92rem; line-height: 1.6; }
.rights .rt-body p { margin: 0 0 8px; }
.rights a { color: var(--primary); font-weight: 600; }
.rights .rt-help ol { margin: 0 0 12px; padding-inline-start: 20px; line-height: 1.7; }
.highlight.go .hl-ic { background: var(--primary); color: var(--on-primary); }

/* ---- onboarding: friendly questions ---- */
.wizard.ob .content { animation: none; }
.wizard.ob .content.ob-next { animation: ob-in-next .38s cubic-bezier(.2, .8, .3, 1) both; }
.wizard.ob .content.ob-prev { animation: ob-in-prev .38s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes ob-in-next { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes ob-in-prev { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
.ob-progress { height: 6px; border-radius: 3px; background: var(--surface-3); margin: 8px 0 10px; overflow: hidden; }
.ob-progress i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #2ee59d, var(--primary)); transition: width .5s cubic-bezier(.2, .8, .3, 1); margin-inline-start: 0; }
.ob-count { font-size: .8rem; font-weight: 700; color: var(--on-surface-var); margin-bottom: 14px; }
.ob-hero { font-size: 3.2rem; line-height: 1; margin: 6px 0 12px; display: inline-block; animation: ob-pop .5s cubic-bezier(.34, 1.56, .64, 1) .08s both, ob-float 3s ease-in-out .6s infinite; }
.ob-hero.sm { font-size: 1.6rem; margin: 0; animation: ob-pop .45s cubic-bezier(.34, 1.56, .64, 1) both; }
@keyframes ob-pop { from { transform: scale(.2) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ob-float { 50% { transform: translateY(-5px) rotate(-4deg); } }
.wizard.ob h1 { font-size: 1.75rem; }
.ob-live { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--primary-container); color: var(--on-primary-container); font-size: .92rem; line-height: 1.5; }
.ob-live:empty { display: none; }
.ob-live svg { vertical-align: -3px; }
.ob-welcome { text-align: center; padding-top: 4vh; }
.ob-points { display: grid; gap: 10px; margin: 26px 0 18px; text-align: start; }
.ob-points > div { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface-1); border: 1px solid var(--line); font-weight: 600; animation: ob-in-next .5s cubic-bezier(.2, .8, .3, 1) calc(.15s + var(--d) * .12s) both; }
.ob-consent { text-align: center; margin-top: 4px; }
.ob-done { text-align: center; padding-top: 3vh; }
.ob-check { width: 92px; height: 92px; margin: 0 auto 16px; }
.ob-check svg { width: 100%; height: 100%; }
.ob-check circle { fill: var(--good-bg); stroke: var(--good-mark); stroke-width: 3; stroke-dasharray: 160; stroke-dashoffset: 160; animation: ob-draw .6s ease-out .1s forwards; }
.ob-check path { fill: none; stroke: var(--good-mark); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: ob-draw .35s ease-out .55s forwards; }
@keyframes ob-draw { to { stroke-dashoffset: 0; } }
.ob-summary { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 16px 0; }
.ob-summary span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface-2); font-size: .85rem; font-weight: 600; animation: ob-pop .4s cubic-bezier(.34, 1.56, .64, 1) .7s both; }
.ob-summary i { width: 9px; height: 9px; border-radius: 50%; }
.ob-save { margin: 18px 0 6px; padding: 14px; border-radius: 16px; border: 1px dashed var(--outline-var); }
.btn.ob-google { background: #fff; color: #1f1f1f; border: 1px solid #dadce0; gap: 10px; }
@media (prefers-reduced-motion: reduce) { .wizard.ob *, .ob-hero { animation: none !important; } .ob-check circle, .ob-check path { stroke-dashoffset: 0; } }
.rights .rt-results { margin-top: 10px; }
.rights .rt-hit { animation: ob-in-next .3s cubic-bezier(.2, .8, .3, 1) both; }
.rights .rt-hit-t { display: flex; align-items: center; gap: 8px; font-weight: 800; margin-bottom: 8px; color: var(--primary); }
.rights .rt-none { text-align: center; }
.rights .rt-none .btn { margin-top: 12px; }

/* ============================================================
 * styles-v3.css — Shaati's design system, layered on styles.css
 * (see tools/build.js).
 *
 * Friendly but grown-up: one brand colour (the accent the user
 * picked, --h; violet by default) carried consistently, green for
 * "go", amber for money, clean cool neutrals, soft shadows instead
 * of glows, icons always sitting in a tinted tile, and motion only
 * where it means something. The mascot and the celebrations bring
 * the fun; the rest stays calm and tidy.
 * ============================================================ */

/* ---------------- tokens ---------------- */
:root {
  --radius: 20px; --radius-s: 14px;
  --pop: cubic-bezier(.34, 1.56, .64, 1);
  /* brand */
  --brand: hsl(var(--h) 78% 58%);
  --brand-strong: hsl(var(--h) 66% 46%);
  --brand-soft: hsl(var(--h) 92% 96%);
  --on-brand-soft: hsl(var(--h) 62% 38%);
  /* every white label on these passes WCAG AA (checked: 4.6:1 or more) */
  --grad-brand: linear-gradient(135deg, hsl(calc(var(--h) - 4) 76% 56%) 0%, hsl(calc(var(--h) + 8) 66% 44%) 100%);
  --grad-hero: linear-gradient(140deg, hsl(calc(var(--h) - 8) 72% 52%) 0%, hsl(var(--h) 66% 44%) 52%, hsl(calc(var(--h) + 10) 62% 31%) 100%);
  --grad-go: linear-gradient(135deg, #078656 0%, #055c3d 100%);
  --grad-money: linear-gradient(135deg, #ffc23d 0%, #f59b16 100%);
  --display: 'Fredoka', var(--font);
  /* supporting colours, each with a soft tint for tiles (text in these colours on their tint passes AA) */
  --violet: hsl(var(--h) 60% 46%); --violet-soft: hsl(var(--h) 92% 96%);
  --mint: #0b7d55; --mint-soft: #e2f7ee;
  --amber: #8f5800; --amber-soft: #fff2d6;
  --sky: #1567ad; --sky-soft: #e3f1fd;
  --pink: #b8285f; --pink-soft: #fde8f0;
  --orange: #a8480b; --orange-soft: #feecdf;
  /* shadows: quiet, never coloured glows */
  --sh-1: 0 1px 2px rgba(18, 14, 48, .05), 0 1px 1px rgba(18, 14, 48, .03);
  --sh-2: 0 10px 28px -10px rgba(18, 14, 48, .22);
  --sh-brand: 0 8px 18px -8px hsla(var(--h), 70%, 42%, .55);
  /* cool, slightly brand-tinted neutrals */
  --surface: hsl(var(--h) 30% 98%);
  --surface-1: #ffffff;
  --surface-2: hsl(var(--h) 26% 96%);
  --surface-3: hsl(var(--h) 20% 92%);
  --surface-hi: #ffffff;
  --on-surface: #17141f;
  --on-surface-var: #625e72;
  --outline: hsl(var(--h) 10% 62%);
  --outline-var: hsl(var(--h) 16% 87%);
  --line: hsl(var(--h) 18% 91%);
  --primary: var(--brand-strong);
  --on-primary: #fff;
  --primary-container: var(--brand-soft);
  --on-primary-container: var(--on-brand-soft);
  --secondary-container: hsl(var(--h) 40% 94%);
  --on-secondary-container: hsl(var(--h) 45% 26%);
  --hero: hsl(var(--h) 50% 22%);
  --pk-a: var(--brand); --pk-b: var(--brand-strong);
  /* kept for older rules */
  --c-violet: var(--brand); --c-mint: #22c98e; --c-orange: #f47b2f; --c-lemon: #ffd23f;
  --grad-1: var(--grad-brand); --grad-2: var(--grad-go); --grad-3: var(--grad-money); --grad-4: var(--grad-brand);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: hsl(var(--h) 85% 70%); --brand-strong: hsl(var(--h) 80% 74%);
    --brand-soft: hsl(var(--h) 30% 19%); --on-brand-soft: hsl(var(--h) 90% 85%);
    --violet: hsl(var(--h) 85% 76%); --violet-soft: hsl(var(--h) 30% 19%);
    --mint: #5fe0b0; --mint-soft: #11301f; --amber: #ffcf6b; --amber-soft: #33270d; --sky: #7cc3ff; --sky-soft: #0f2a40;
    --pink: #ff8fb7; --pink-soft: #3a1626; --orange: #ffab72; --orange-soft: #3a210f;
    --surface: hsl(var(--h) 22% 7%); --surface-1: hsl(var(--h) 18% 11%); --surface-2: hsl(var(--h) 16% 14%); --surface-3: hsl(var(--h) 14% 19%); --surface-hi: hsl(var(--h) 18% 12%);
    --on-surface: #eeecf6; --on-surface-var: #a6a2b8; --outline: hsl(var(--h) 10% 45%); --outline-var: hsl(var(--h) 14% 22%); --line: hsl(var(--h) 14% 18%);
    --on-primary: hsl(var(--h) 60% 12%);
    --secondary-container: hsl(var(--h) 20% 20%); --on-secondary-container: hsl(var(--h) 40% 88%);
    --sh-1: 0 1px 2px rgba(0, 0, 0, .3); --sh-2: 0 12px 30px -10px rgba(0, 0, 0, .6); --sh-brand: 0 8px 18px -8px rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  --brand: hsl(var(--h) 85% 70%); --brand-strong: hsl(var(--h) 80% 74%);
  --brand-soft: hsl(var(--h) 30% 19%); --on-brand-soft: hsl(var(--h) 90% 85%);
  --violet: hsl(var(--h) 85% 76%); --violet-soft: hsl(var(--h) 30% 19%);
  --mint: #5fe0b0; --mint-soft: #11301f; --amber: #ffcf6b; --amber-soft: #33270d; --sky: #7cc3ff; --sky-soft: #0f2a40;
  --pink: #ff8fb7; --pink-soft: #3a1626; --orange: #ffab72; --orange-soft: #3a210f;
  --surface: hsl(var(--h) 22% 7%); --surface-1: hsl(var(--h) 18% 11%); --surface-2: hsl(var(--h) 16% 14%); --surface-3: hsl(var(--h) 14% 19%); --surface-hi: hsl(var(--h) 18% 12%);
  --on-surface: #eeecf6; --on-surface-var: #a6a2b8; --outline: hsl(var(--h) 10% 45%); --outline-var: hsl(var(--h) 14% 22%); --line: hsl(var(--h) 14% 18%);
  --on-primary: hsl(var(--h) 60% 12%);
  --secondary-container: hsl(var(--h) 20% 20%); --on-secondary-container: hsl(var(--h) 40% 88%);
  --sh-1: 0 1px 2px rgba(0, 0, 0, .3); --sh-2: 0 12px 30px -10px rgba(0, 0, 0, .6); --sh-brand: 0 8px 18px -8px rgba(0, 0, 0, .6);
}

/* ---------------- base ---------------- */
body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 60% at 50% -10%, hsla(var(--h), 90%, 80%, .16), transparent 60%); }
h1, h2, .topbar h1, .home-top h1, .wizard h1 { letter-spacing: -.02em; }
.card, .list, details.collapse { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--sh-1); }
.item + .item { border-top-color: var(--line); }
.input, select.input, textarea.input { border-radius: 14px; border-color: var(--outline-var); background: var(--surface-1); }
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px hsla(var(--h), 85%, 60%, .16); }
.sheet { border-radius: 26px 26px 0 0; background: var(--surface); }
.dialog .box { border-radius: 24px; background: var(--surface-1); border: 0; box-shadow: var(--sh-2); }
.toast { border-radius: 16px; background: #1d1a2b; color: #f3f1fa; box-shadow: var(--sh-2); }
.section-title { color: var(--on-surface-var); }
.section-title svg { color: var(--brand); }
a { color: var(--brand-strong); }

/* buttons: the brand gradient for the main action, quiet tints for the rest */
.btn { border-radius: 16px; font-weight: 700; }
.btn.big { border-radius: 18px; }
.btn:where(:not(.tonal, .text, .outlined, .danger, .ob-google, .go, :disabled)) { background: var(--grad-brand); color: #fff; box-shadow: var(--sh-brand); }
.btn.tonal { background: var(--brand-soft); color: var(--on-brand-soft); }
.btn.outlined { border-color: var(--outline-var); color: var(--on-surface); }
.btn.text { color: var(--brand-strong); }
.btn.go { background: var(--grad-go); color: #fff; box-shadow: 0 8px 18px -8px rgba(5, 92, 61, .6); }
.btn.ob-google { background: #fff; color: #1f1f1f; border: 1px solid #dadce0; box-shadow: var(--sh-1); }
body.fx .btn:active, body.fx .chip:active, body.fx .sc:active, body.fx .am-tile:active, body.fx .ob-chip:active { transform: scale(.96); }
.chip { border-radius: 999px; background: var(--surface-1); border-color: var(--outline-var); }
.chip.on { background: var(--brand-strong); color: var(--on-primary); border-color: transparent; }
.seg { background: var(--surface-2); border: 0; border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border-radius: 10px; color: var(--on-surface-var); }
.seg button.on { background: var(--surface-1); color: var(--brand-strong); box-shadow: var(--sh-1), 0 0 0 1px var(--line); }
.switch:checked { background: var(--brand-strong) !important; }
.tag { border-radius: 8px; }

/* icon tiles: every icon sits on a soft tint (no loose emoji in the interface) */
.itile { width: 40px; height: 40px; border-radius: 12px; display: inline-grid; place-items: center; flex: none; }
.itile svg { width: 22px; height: 22px; }
.itile.t-violet { background: var(--violet-soft); color: var(--violet); }
.itile.t-mint { background: var(--mint-soft); color: var(--mint); }
.itile.t-amber { background: var(--amber-soft); color: var(--amber); }
.itile.t-sky { background: var(--sky-soft); color: var(--sky); }
.itile.t-pink { background: var(--pink-soft); color: var(--pink); }
.itile.t-orange { background: var(--orange-soft); color: var(--orange); }
.itile.t-glass { background: rgba(255, 255, 255, .2); color: #fff; }
.list .item > .itile { margin: 0; }

/* settings rows: the same tints, in turn */
.set-list .item .lead { background: var(--violet-soft); color: var(--violet); }
.set-list .item:nth-child(6n+2) .lead { background: var(--mint-soft); color: var(--mint); }
.set-list .item:nth-child(6n+3) .lead { background: var(--amber-soft); color: var(--amber); }
.set-list .item:nth-child(6n+4) .lead { background: var(--sky-soft); color: var(--sky); }
.set-list .item:nth-child(6n+5) .lead { background: var(--pink-soft); color: var(--pink); }
.set-list .item:nth-child(6n) .lead { background: var(--orange-soft); color: var(--orange); }

/* bottom bar: a tinted pill for the current tab, an amber + */
.nav { background: color-mix(in srgb, var(--surface-1) 90%, transparent); backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px); border-top: 1px solid var(--line); box-shadow: none; }
.nav button { color: var(--on-surface-var); }
.nav button .pill { width: 56px; height: 32px; border-radius: 16px; transition: background .2s; }
.nav button.on .pill { background: var(--brand-soft); color: var(--brand-strong); }
.nav button.on .pill::before { display: none; }
.nav button.on { color: var(--brand-strong); font-weight: 700; }
body.fx .nav button.on .pill svg { animation: nav-pop .35s var(--pop); }
.nav .fab { border-radius: 50%; width: 58px; height: 58px; background: var(--grad-money); color: #2b1a00; box-shadow: 0 10px 22px -8px rgba(245, 155, 22, .7); border: 4px solid var(--surface); margin-top: -22px; }
body.fx .nav .fab:active { transform: scale(.9) rotate(90deg); }
@keyframes nav-pop { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

/* ---------------- home ---------------- */
.home-top .icon-btn { background: var(--surface-1); border: 1px solid var(--line); border-radius: 14px; width: 44px; height: 44px; margin-inline-start: 6px; box-shadow: var(--sh-1); color: var(--on-surface); }
.home-hero { position: relative; overflow: hidden; isolation: isolate; color: #fff; border-radius: 26px; margin: 6px 0 14px; padding: 26px 16px 22px; background: var(--grad-hero); box-shadow: 0 18px 36px -18px hsla(var(--h), 70%, 40%, .75); }
/* the one bold element: a watch dial behind the month's pay (hours turn into money) */
.home-hero::before { content: ''; position: absolute; z-index: -1; pointer-events: none; width: 280px; height: 280px; bottom: -150px; right: -110px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0) 68%); }
.hh-dial { position: absolute; z-index: -1; pointer-events: none; width: 250px; height: 250px; top: -125px; left: -125px; border-radius: 50%;
  background: repeating-conic-gradient(from -1deg, rgba(255, 255, 255, .34) 0 2deg, transparent 2deg 30deg), repeating-conic-gradient(from -.5deg, rgba(255, 255, 255, .16) 0 1deg, transparent 1deg 6deg);
  -webkit-mask: radial-gradient(circle, transparent 0 61%, #000 61.5% 66%, transparent 66.5%); mask: radial-gradient(circle, transparent 0 61%, #000 61.5% 66%, transparent 66.5%); }
.hh-dial::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .18); }
/* pressing the card: a cheap opacity change (a filter here would repaint the moving light on every frame) */
.home-hero:active { background: var(--grad-hero); opacity: .94; }
.hh-spark { display: none; }
.home-hero .hh-label, .home-hero .hh-stats, .home-hero .hh-goal-l { color: rgba(255, 255, 255, .86); }
.home-hero .hh-stats b, .home-hero .hero-num { color: #fff; }
.home-hero .hero-num { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; font-size: 3.5rem; line-height: 1.05; margin: 8px 0 16px; }
.home-hero .hh-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; max-width: 340px; margin: 0 auto; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .14); border-radius: 16px; padding: 10px 4px; }
.home-hero .hh-stats > span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.home-hero .hh-stats > span + span { border-inline-start: 1px solid rgba(255, 255, 255, .16); }
.home-hero .hh-stats b { font-family: var(--display); font-size: 1.1rem; font-weight: 600; }
.home-hero .hh-stats small { font-size: .74rem; color: rgba(255, 255, 255, .82); }
.home-hero .progress { background: rgba(255, 255, 255, .22); }
.home-hero .progress i { background: #fff; } .home-hero .progress b { background: rgba(255, 255, 255, .4); }
.home-hero .term { color: inherit; text-decoration-color: rgba(255, 255, 255, .55); }
.home-action .btn.start { background: var(--grad-go); color: #fff; min-height: 66px; border-radius: 20px; font-size: 1.15rem; font-weight: 700; box-shadow: 0 12px 24px -12px rgba(5, 92, 61, .8); }
.home-action .btn.start svg { background: rgba(255, 255, 255, .22); border-radius: 50%; padding: 6px; width: 32px; height: 32px; }
.timer-card.running { background: linear-gradient(140deg, hsl(calc(var(--h) - 4) 45% 20%) 0%, hsl(var(--h) 50% 28%) 100%); border-radius: 24px; box-shadow: var(--sh-2); }
.timer-card.running .clock { color: #ffc23d; }
.timer-card.running .btn.big { background: var(--grad-money); color: #2b1a00; box-shadow: none; }
.highlight { border-radius: 16px; background: var(--surface-1); border: 1px solid var(--line); box-shadow: var(--sh-1); }
.highlight .hl-ic { background: var(--brand-soft); color: var(--brand-strong); border-radius: 10px; }
.empty.fun { padding: 18px 16px 6px; }
.empty.fun .mascot { margin-bottom: 4px; }

/* four doors */
.shortcuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 22px; }
.sc { display: flex; flex-direction: column; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-1); box-shadow: var(--sh-1); border-radius: 18px; padding: 12px 4px 10px; font: 600 .76rem/1.25 var(--font); color: var(--on-surface); cursor: pointer; transition: transform .2s var(--pop); text-align: center; }
.sc > span:last-child { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* first steps */
.card.guide { border: 1.5px solid color-mix(in srgb, var(--brand) 30%, var(--line)); padding: 14px; }
.guide-head { display: flex; align-items: center; gap: 10px; }
.guide-head .gh-t { flex: 1; } .guide-head .gh-t b { font-size: 1.05rem; }
.guide-head .icon-btn { width: 36px; height: 36px; }
.guide-bar { height: 6px; border-radius: 3px; background: var(--surface-3); margin: 10px 0 8px; overflow: hidden; }
.guide-bar i { display: block; height: 100%; border-radius: 3px; background: var(--grad-go); transition: width .6s var(--pop); }
.gs { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; }
.gs-dot { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 2px solid var(--outline-var); font-weight: 800; font-size: .8rem; margin-top: 1px; }
.gs.ok .gs-dot { background: #22c98e; border-color: #22c98e; color: #fff; }
.gs.ok .gs-t { color: var(--on-surface-var); text-decoration: line-through; text-decoration-color: var(--outline); }
.gs.next .gs-dot { border-color: var(--brand); box-shadow: 0 0 0 4px hsla(var(--h), 85%, 60%, .15); }
.gs-b { flex: 1; min-width: 0; } .gs-t { font-weight: 700; }
.gs-s { font-size: .84rem; color: var(--on-surface-var); margin: 2px 0 8px; }
.gs-acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* coach marks */
.coach { position: fixed; inset: 0; z-index: 9990; cursor: pointer; animation: coach-in .3s ease both; }
.coach.out { animation: coach-out .25s ease forwards; }
@keyframes coach-in { from { opacity: 0; } }
@keyframes coach-out { to { opacity: 0; } }
.coach-hole { position: absolute; box-shadow: 0 0 0 9999px rgba(14, 10, 36, .7); outline: 2px solid rgba(255, 255, 255, .85); outline-offset: 2px; }
.coach-tip { position: absolute; left: 16px; right: 16px; display: flex; align-items: center; gap: 10px; background: var(--surface-1); color: var(--on-surface); border-radius: 20px; padding: 12px 14px; box-shadow: var(--sh-2); animation: bubble-in .4s var(--pop) both; max-width: 520px; margin: 0 auto; }
