          const cur = fields[f.key];
          cur.value += pv.value;
          if (pv.qty != null) cur.qty = (cur.qty || 0) + pv.qty;
          cur.line += ' | ' + line;
          cur.rate = cur.qty ? cur.value / cur.qty : cur.rate;
        }
        continue;
      }
      fields[f.key] = Object.assign({ line }, pv);
    }
    return { fields, other, period: detectPeriod(text), lineCount: rawLines.length };
  }

  /* ---------------- redaction (before optional AI) ---------------- */
  function redact(text) {
    let count = 0;
    const lines = text.split(/\r?\n/).map((line) => {
      let l = line;
      if (/(רחוב|רח'|רח׳|כתובת|מיקוד|ת\.ד|דירה|שכונת|ישוב:|יישוב:)/.test(l)) { count++; return '[כתובת הוסתרה]'; }
      if (/(בנק|סניף|חשבון|IBAN|מס' חשבון)/i.test(l)) {
        l = l.replace(/\d[\d\-\s]{2,}\d/g, () => { count++; return '[פרטי בנק הוסתרו]'; });
      }
      if (/(ת\.ז|ת"ז|ת״ז|תעודת זהות|מספר זהות|מס' זהות|זהות)/.test(l)) {
        l = l.replace(/\d[\d\-\s]{4,}\d/g, () => { count++; return '[ת״ז הוסתרה]'; });
      }
      l = l.replace(/\b\d{9}\b/g, () => { count++; return '[מספר הוסתר]'; });
      l = l.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, () => { count++; return '[אימייל הוסתר]'; });
      l = l.replace(/(?:\+972[-\s]?|\b0)(?:5\d|[2-489]|7\d)[-\s]?\d{3}[-\s]?\d{4}\b/g, () => { count++; return '[טלפון הוסתר]'; });
      return l;
    });
    return { text: lines.join('\n'), count };
  }

  /** JSON schema for the optional AI extraction (structured output).
   *  Kept flat with no optional/union types: qty and rate are 0 when absent. */
  function aiSchema() {
    return {
      type: 'object',
      properties: {
        period: { type: 'string', description: 'Pay month as YYYY-MM, or empty string' },
        fields: {
          type: 'array',
          items: {
            type: 'object',
            properties: {
              key: { type: 'string', enum: FIELDS.map((f) => f.key) },
              value: { type: 'number' }, qty: { type: 'number' }, rate: { type: 'number' },
            },
            required: ['key', 'value', 'qty', 'rate'], additionalProperties: false,
          },
        },
        otherLines: {
          type: 'array',
          items: {
            type: 'object',
            properties: { label: { type: 'string' }, amount: { type: 'number' }, type: { type: 'string', enum: ['payment', 'deduction', 'employer', 'info'] } },
            required: ['label', 'amount', 'type'], additionalProperties: false,
          },
        },
        notes: { type: 'string' },
      },
      required: ['period', 'fields', 'otherLines', 'notes'], additionalProperties: false,
    };
  }
  function aiPrompt() {
    return 'You read the text of an Israeli payslip (תלוש שכר) produced by PDF text extraction or Hebrew OCR. ' +
      'Hebrew words may appear reversed (visual order) and table columns may be out of order; reconstruct the meaning carefully. ' +
      'Personal details were replaced with placeholders such as [ת״ז הוסתרה]; ignore them.\n' +
      'Return the monthly amounts in ILS for every field key below that appears in the payslip (omit keys that do not appear). ' +
      'For hour-based lines also return qty (hours) and rate (ILS per hour); use 0 when a line has no quantity or rate. ' +
      'Deductions are positive numbers. Do not invent values. Year-to-date (מצטבר) columns go only to the ytd* keys.\n' +
      'Field keys: ' + FIELDS.map((f) => `${f.key} = ${f.label}`).join('; ') + '.\n' +
      'Put every other payment, deduction or employer-contribution line in otherLines. ' +
      'period is the pay month (YYYY-MM) if visible, otherwise an empty string. notes: one short Hebrew sentence about anything unclear, or an empty string.';
  }
  /** Convert AI JSON to the same {fields, other, period} shape as parseText. */
  function fromAi(json) {
    const fields = {};
    for (const x of json.fields || []) {
      if (!FIELD[x.key] || x.value == null) continue;
      fields[x.key] = { value: +x.value, qty: x.qty ? +x.qty : undefined, rate: x.rate ? +x.rate : undefined, line: 'AI' };
    }
    const other = (json.otherLines || []).map((o) => ({ line: o.label, value: o.amount, guess: o.type === 'deduction' ? 'otherDed' : o.type === 'payment' ? 'otherPay' : 'ignore' }));
    return { fields, other, period: /^\d{4}-\d{2}$/.test(json.period || '') ? json.period : null, notes: json.notes || '' };
  }

  /* ---------------- analysis ---------------- */
  const val = (F, k) => (F[k] && F[k].value != null && !isNaN(F[k].value) ? +F[k].value : null);
  const qty = (F, k) => (F[k] && F[k].qty != null && !isNaN(F[k].qty) ? +F[k].qty : null);

  /** App-side expectations for a pay period. */
  function expected(model, pk, useAuto) {
    const emp = model.ctx.primaryEmployer();
    const P = Engine.periodByKey(pk, emp);
    const results = useAuto && model.autoResults && model.autoResults.size ? model.autoResults : model.results;
    const m = Object.assign({}, model, { results });
    const t = Engine.totals(m, P.from, P.to);
    const pay = { base: 0, ot125: 0, ot150: 0, rest150: 0, rest175: 0, rest200: 0 };
    const hrs = { base: 0, ot125: 0, ot150: 0, rest150: 0, rest175: 0, rest200: 0 };
    const shifts = [];
    for (const r of results.values()) {
      if (r.status !== 'done' || r.dateKey < P.from || r.dateKey > P.to) continue;
      shifts.push(r);
      for (const l of r.lines) {
        const k = l.rest ? ['rest150', 'rest175', 'rest200'][l.tier] : ['base', 'ot125', 'ot150'][l.tier];
        pay[k] += l.amount; hrs[k] += l.hours;
      }
    }
    shifts.sort((a, b) => a.start - b.start);
    const net = Engine.netEstimate({ gross: t.gross, pensionBase: Engine.pensionBaseOf(t, model.ctx.settings), deductions: t.deductions, periodTo: P.to }, model.ctx.settings);
    return { P, t, pay, hrs, shifts, net, avgRate: t.hours ? t.wage / t.hours : 0, baseRate: hrs.base ? pay.base / hrs.base : 0 };
  }

  /**
   * Compare a verified payslip to the recorded shifts.
   * slip = { period:'YYYY-MM', fields:{...}, other:[{line,value,guess}] }
   */
  function analyze(slip, model) {
    const S = model.ctx.settings;
    const F = slip.fields || {};
    const E = expected(model, slip.period, false);
    const A = expected(model, slip.period, true);
    const overridesInPeriod = E.shifts.filter((r) => r.overridden || r.dayRuleHit);
    const hasOv = overridesInPeriod.length > 0;
    const findings = [];
    let fid = 0;
    const add = (o) => findings.push(Object.assign({ id: 'f' + (++fid), amount: 0, shifts: [], confidence: 'medium', fromOverride: null }, o));
    const ovNote = (appVal, autoVal, slipVal, tol) => {
      if (!hasOv || Math.abs(appVal - autoVal) < tol) return null;
      if (slipVal != null && Math.abs(slipVal - autoVal) <= Math.abs(slipVal - appVal)) {
        return `הפער נובע כנראה מעקיפה ידנית שהזנת ב-${overridesInPeriod.length} משמרות: בלי העקיפה האפליקציה הייתה מחשבת ${U.num(autoVal, 2)} — קרוב למה שבתלוש.`;
      }
      return `שים לב: ${overridesInPeriod.length} משמרות בתקופה כוללות עקיפה ידנית (חישוב אוטומטי: ${U.num(autoVal, 2)}).`;
    };
    const dates = (rs) => rs.map((r) => U.fmtDate(r.dateKey, 'short')).join(', ');

    /* 1. total hours */
    let covered = []; // shifts already identified as unpaid — excluded from the OT / rest checks to avoid double counting
    const slipHours = HOUR_FIELDS.reduce((s, k) => s + (qty(F, k) || 0), 0) || val(F, 'workHours');
    const appHours = E.t.hours;
    if (slipHours == null || slipHours === 0) {
      add({ area: 'שעות', status: 'warn', title: 'לא זוהו שעות בתלוש', detail: `באפליקציה רשומות ${U.hours(appHours)} שעות לתקופה. אם התלוש מציג שעות, הוסף אותן במסך האימות כדי לבדוק התאמה.`, basis: 'אין כמות שעות בשורות התלוש שזוהו.', confidence: 'low' });
    } else {
      const diff = appHours - slipHours;
      if (diff > 0.25) {
        // try to name the missing shift(s)
        // which shift(s) are probably missing? 1) the last shifts of the period (cut-off), 2) a single shift of that length
        let suspects = [], how = '', conf = 'medium';
        let acc = 0; const tail = [];
        for (let i = E.shifts.length - 1; i >= 0 && acc < diff - 0.3; i--) { acc += E.shifts[i].paidHours; tail.unshift(E.shifts[i]); }
        if (tail.length && Math.abs(acc - diff) <= 0.3) {
          suspects = tail; conf = 'high';
          how = tail.length > 1 ? 'המשמרות האחרונות בתקופה — ייתכן שנכנסו לתלוש הבא' : 'המשמרת האחרונה בתקופה — ייתכן שנכנסה לתלוש הבא';
        } else {
          const same = E.shifts.filter((r) => Math.abs(r.paidHours - diff) <= 0.3);
          if (same.length === 1) { suspects = same; how = 'משמרת באורך השעות החסרות'; conf = 'high'; }
          else if (same.length > 1) { suspects = same; how = 'אחת מהמשמרות באורך הזה'; }
        }
        if (conf === 'high') covered = suspects;
        const exact = conf === 'high' ? suspects.reduce((x, r) => x + r.wage, 0) : 0;
        const amount = exact || diff * E.avgRate;
        add({ area: 'שעות', status: 'bad', title: 'שעות שלא שולמו', amount, shifts: suspects.map((r) => r.id),
          detail: `רשמת ${U.hours(appHours)} שעות, בתלוש ${U.hours(slipHours)}. חסרות ${U.hours(diff)} שעות` + (suspects.length ? ` (${how}: ${dates(suspects)})` : '') + (exact ? `. השכר על ${suspects.length > 1 ? 'המשמרות האלה' : 'המשמרת הזו'} לפי החישוב: ${U.money(amount)} (כולל תוספות).` : `. לפי שכר ממוצע של ${U.money(E.avgRate)} לשעה ≈ ${U.money(amount)}.`),
          basis: 'השוואת סך השעות בתלוש לשעות ששולמו לפי המשמרות שרשמת לתקופה ' + '⁦' + U.fmtDate(E.P.from, 'short') + '–' + U.fmtDate(E.P.to, 'short') + '⁩.',
          confidence: conf, fromOverride: ovNote(appHours, A.t.hours, slipHours, 0.1) });
      } else if (diff < -0.25) {
        add({ area: 'שעות', status: 'warn', title: 'בתלוש יש יותר שעות ממה שרשמת', detail: `בתלוש ${U.hours(slipHours)} שעות, באפליקציה ${U.hours(appHours)}. אולי שכחת לרשום משמרת?`, basis: 'השוואת סך השעות.', confidence: 'medium' });
      } else {
        add({ area: 'שעות', status: 'ok', title: 'סך השעות תואם', detail: `${U.hours(slipHours)} שעות בתלוש מול ${U.hours(appHours)} באפליקציה.`, basis: 'השוואת סך השעות.', confidence: 'high' });
      }
    }

    /* 2. hourly base rate */
    const bq = qty(F, 'base'), bv = val(F, 'base');
    if (bq && bv && E.hrs.base > 0) {
      const slipRate = F.base.rate || bv / bq;
      // rates actually used in the period (per role, by date)
      const rates = [];
      for (const r of E.shifts) for (const l of r.lines) if (!l.rest && l.tier === 0) rates.push(l.rate);
      const minRate = rates.length ? Math.min(...rates) : E.baseRate;
      const maxRate = rates.length ? Math.max(...rates) : E.baseRate;
      const mixed = maxRate - minRate > 0.01;
      if (slipRate < minRate - 0.02) {
        // below even the lowest agreed rate → certainly underpaid on every regular hour
        const amount = (E.baseRate - slipRate) * bq;
        add({ area: 'תעריף', status: 'bad', title: 'תעריף לשעה נמוך מהמוסכם', amount,
          detail: `בתלוש ${U.money(slipRate)} לשעה, ${mixed ? `נמוך מהתעריף הנמוך ביותר שלך בתקופה (${U.money(minRate)})` : `התעריף שהגדרת ${U.money(minRate)}`}. על ${U.hours(bq)} שעות רגילות ≈ ${U.money(amount)}.`,
          basis: 'שכר יסוד ÷ שעות רגילות בתלוש, מול התעריף לפי תאריך המשמרת (כולל היסטוריית תעריפים).',
          confidence: mixed ? 'medium' : 'high', fromOverride: ovNote(E.baseRate, A.baseRate, slipRate, 0.01) });
      } else if (mixed && slipRate < E.baseRate - 0.02 && Math.abs(bq - E.hrs.base) <= 0.25) {
        add({ area: 'תעריף', status: 'warn', title: 'תעריף ממוצע נמוך מהצפוי', amount: (E.baseRate - slipRate) * bq,
          detail: `בתלוש ${U.money(slipRate)} לשעה בממוצע; לפי המשמרות שרשמת הממוצע המשוקלל ${U.money(E.baseRate)} (תעריפים ⁦${U.money(minRate)}–${U.money(maxRate)}⁩). ייתכן שחלק מהשעות שולמו בתעריף של תפקיד זול יותר — או שחסרות שעות בתפקיד היקר.`,
          basis: 'השוואת ממוצע משוקלל; תלוי בתמהיל התפקידים.', confidence: 'low' });
      } else {
        add({ area: 'תעריף', status: 'ok', title: 'התעריף לשעה תקין', detail: `${U.money(slipRate)} לשעה בתלוש (באפליקציה: ${mixed ? '⁦' + U.money(minRate) + '–' + U.money(maxRate) + '⁩' : U.money(E.baseRate)}).` + (mixed && Math.abs(bq - E.hrs.base) > 0.25 ? ' הממוצע לא הושווה כי מספר השעות שונה.' : ''), basis: 'שכר יסוד ÷ שעות רגילות.', confidence: mixed ? 'medium' : 'high' });
      }
    }

    /* 3. Shabbat & holiday */
    const slipRestH = (qty(F, 'rest150') || 0) + (qty(F, 'rest175') || 0) + (qty(F, 'rest200') || 0);
    const slipRestPay = (val(F, 'rest150') || 0) + (val(F, 'rest175') || 0) + (val(F, 'rest200') || 0);
    const covSum = (f) => covered.reduce((x, r) => x + f(r), 0);
    const appRestH = E.t.restHours - covSum((r) => r.restHours);
    if (appRestH > 0.01 || slipRestH > 0 || slipRestPay > 0) {
      const restShifts = E.shifts.filter((r) => r.restHours > 0 && !covered.includes(r));
      if (slipRestH === 0 && slipRestPay === 0 && appRestH > 0.25) {
        const amount = E.t.restPremium;
        add({ area: 'שבת וחג', status: 'bad', title: 'לא שולמה תוספת שבת/חג', amount, shifts: restShifts.map((r) => r.id),
          detail: `רשמת ${U.hours(appRestH)} שעות בשבת/חג (${dates(restShifts)}), ובתלוש לא מופיעה שורת שבת/חג. התוספת (מעבר ל-100%) ≈ ${U.money(amount)}.`,
          basis: 'חלון השבת/חג לפי ' + (S.rest.mode === 'city' ? 'זמני כניסה ויציאה ב' + S.rest.city : 'השעות הקבועות שהגדרת') + ', ' + (model.ctx.primaryEmployer().restPct || 150) + '%.',
          confidence: 'medium', fromOverride: ovNote(appRestH, A.t.restHours, 0, 0.1) });
      } else if (slipRestH > 0 && appRestH - slipRestH > 0.25) {
        const missingH = appRestH - slipRestH;
        const amount = missingH * E.avgRate * ((model.ctx.primaryEmployer().restPct || 150) - 100) / 100;
        add({ area: 'שבת וחג', status: 'bad', title: 'חסרות שעות שבת/חג', amount, shifts: restShifts.map((r) => r.id),
          detail: `באפליקציה ${U.hours(appRestH)} שעות שבת/חג, בתלוש ${U.hours(slipRestH)}. ${U.hours(missingH)} שעות כנראה שולמו כרגילות; התוספת החסרה ≈ ${U.money(amount)}.`,
          basis: 'השוואת שעות 150%/175%/200% בתלוש לשעות בתוך חלון השבת/חג.', confidence: 'medium',
          fromOverride: ovNote(appRestH, A.t.restHours, slipRestH, 0.1) });
      } else if (slipRestH > 0 && slipRestPay > 0) {
        const eff = slipRestPay / slipRestH;
        const exp = E.pay.rest150 + E.pay.rest175 + E.pay.rest200;
        const expRate = appRestH > 0 ? exp / appRestH : 0;
        if (expRate > 0 && eff < expRate * 0.97) {
          const amount = (expRate - eff) * slipRestH;
          add({ area: 'שבת וחג', status: 'bad', title: 'תעריף שבת/חג נמוך', amount, detail: `בתלוש ${U.money(eff)} לשעת שבת, צפוי ${U.money(expRate)}. ≈ ${U.money(amount)}.`, basis: 'סכום ÷ שעות בשורות השבת/חג.', confidence: 'medium' });
        } else add({ area: 'שבת וחג', status: 'ok', title: 'שעות שבת/חג תקינות', detail: `${U.hours(slipRestH)} שעות בתלוש מול ${U.hours(appRestH)} באפליקציה.`, basis: 'שעות 150%/175%/200%.', confidence: 'medium' });
      } else if (slipRestH > appRestH + 0.25) {
        add({ area: 'שבת וחג', status: 'warn', title: 'בתלוש יותר שעות שבת/חג', detail: `בתלוש ${U.hours(slipRestH)}, באפליקציה ${U.hours(appRestH)}. ייתכן שהמעסיק מגדיר את חלון השבת אחרת — אפשר לכוון בהגדרות › שבת וחגים.`, basis: 'השוואת שעות.', confidence: 'low' });
      } else add({ area: 'שבת וחג', status: 'ok', title: 'שעות שבת/חג תקינות', detail: `${U.hours(slipRestH)} שעות.`, basis: 'השוואת שעות.', confidence: 'medium' });
    }

    /* 4. overtime */
    const slipOt = (qty(F, 'ot125') || 0) + (qty(F, 'ot150') || 0);
    const appOt1 = E.t.hoursBy.ot1 - covSum((r) => r.hoursBy.ot1), appOt2 = E.t.hoursBy.ot2 - covSum((r) => r.hoursBy.ot2);
    const appOt = appOt1 + appOt2;
    if (appOt > 0.25 || slipOt > 0) {
      const otShifts = E.shifts.filter((r) => r.hoursBy.ot1 + r.hoursBy.ot2 > 0 && !covered.includes(r));
      if (appOt - slipOt > 0.25) {
        const missing125 = Math.max(0, appOt1 - (qty(F, 'ot125') || 0));
        const missing150 = Math.max(0, appOt2 - (qty(F, 'ot150') || 0));
        const amount = E.avgRate * (missing125 * 0.25 + missing150 * 0.5);
        add({ area: 'שעות נוספות', status: 'bad', title: 'שעות נוספות חסרות', amount, shifts: otShifts.map((r) => r.id),
          detail: `באפליקציה ${U.hours(appOt1)} ש׳ ב-125% ו-${U.hours(appOt2)} ש׳ ב-150% (${dates(otShifts)})${covered.length ? ', לא כולל המשמרות שחסרות לגמרי' : ''}; בתלוש ${U.hours(qty(F, 'ot125') || 0)} ו-${U.hours(qty(F, 'ot150') || 0)}. התוספת החסרה ≈ ${U.money(amount)}.`,
          basis: 'שעות נוספות יומיות אחרי ' + model.ctx.primaryEmployer().otThreshold + ' שעות (לפי ההגדרות).', confidence: 'medium',
          fromOverride: ovNote(appOt, A.t.hoursBy.ot1 + A.t.hoursBy.ot2, slipOt, 0.1) });
      } else add({ area: 'שעות נוספות', status: 'ok', title: 'שעות נוספות תקינות', detail: `${U.hours(slipOt)} בתלוש מול ${U.hours(appOt)} באפליקציה.`, basis: 'השוואת שעות 125%/150%.', confidence: 'medium' });
    }

    /* 5. travel */
    const slipTravel = val(F, 'travel');
    if (E.t.travel > 0 || slipTravel) {
      const d = E.t.travel - (slipTravel || 0);
      const emp = model.ctx.primaryEmployer();
      const basis = `${E.t.workDays} ימי עבודה × ${U.money(emp.travelPerDay)}` + (+emp.travelMonthlyCap ? `, תקרה ${U.money(emp.travelMonthlyCap)}` : '') + '.';
      if (d > 1) add({ area: 'נסיעות', status: 'bad', title: 'החזר נסיעות חסר', amount: d, detail: `צפוי ${U.money(E.t.travel)}, בתלוש ${U.money(slipTravel || 0)}.` + (val(F, 'workDays') ? ` המעסיק רשם ${val(F, 'workDays')} ימי עבודה.` : ''), basis, confidence: 'high', fromOverride: ovNote(E.t.travel, A.t.travel, slipTravel, 0.5) });
      else if (d < -1) add({ area: 'נסיעות', status: 'warn', title: 'נסיעות גבוהות מהצפוי', detail: `בתלוש ${U.money(slipTravel)}, צפוי ${U.money(E.t.travel)}. אולי התעריף היומי שהגדרת שונה?`, basis, confidence: 'medium' });
      else add({ area: 'נסיעות', status: 'ok', title: 'נסיעות תקינות', detail: U.money(slipTravel || 0), basis, confidence: 'high' });
    }

    /* 6. minimum wage */
    const rateForMin = bq && bv ? (F.base.rate || bv / bq) : E.baseRate;
    if (rateForMin > 0) {
      const MW = Engine.minWageFor(S, (slip.period || U.todayKey().slice(0, 7)) + '-15');
      const mw = MW.hourly;
      if (rateForMin + 0.005 < mw) {
        const h = bq || E.hrs.base;

          basis: 'צו ההרחבה לפנסיה חובה. הסכום הוא כסף שהמעסיק אמור להפקיד לקרן, לא לנטו.', confidence: S.startDate ? 'medium' : 'low',
          note: 'אם הייתה לך קרן פנסיה פעילה לפני כן — ההפרשה אמורה להתחיל כבר אחרי 3 חודשים (ולעיתים רטרואקטיבית). כדאי לוודא מול המעסיק.' });
      } else if (pe) {

          detail: `${U.money(pe)} = ${U.num(p, 2)}% מ-${U.money(pBase)} (צפוי ~${S.pension.employeePct}%).` + (pr ? ` מעסיק: ${U.money(pr)} (${U.num(pBase ? pr / pBase * 100 : 0, 2)}%).` : ''),
          basis: (S.pension.base === 'base' ? 'הבסיס המשוער: כל השעות × התעריף הבסיסי (בלי תוספות)' : 'הבסיס המשוער: ברוטו פחות נסיעות והבראה') + '. השכר הקובע לפנסיה עשוי להיות שונה לפי ההסכם — אפשר לשנות בהגדרות › נטו משוער.', confidence: 'low' });

        else add({ area: 'הבראה', status: 'ok', title: 'שולמו דמי הבראה', detail: `${U.money(rec)} (הערכה: ${U.money(exp)}).`, basis: 'צו ההרחבה לדמי הבראה.', confidence: 'low' });

  /** Waterfall steps gross → net. */
  function waterfall(F) {

/* ============================================================

 * the name rises; then it opens onto the app. It doubles as the
 * loading indicator: if the app needs more time, the logo keeps
 * turning. Tap to skip. Short version on later opens in the same

 * ============================================================ */

  let seen = false;
  try { seen = sessionStorage.getItem('introSeen') === '1'; sessionStorage.setItem('introSeen', '1'); } catch (e) { /* ignore */ }

  const full = !seen && !fromShortcut && Fx.motion();

        const c = document.createElement('i');
        const a = (-90 + (i - 3) * 26) * Math.PI / 180;
        c.style.setProperty('--dx', Math.round(Math.cos(a) * (90 + (i % 2) * 30)) + 'px');
        c.style.setProperty('--dy', Math.round(Math.sin(a) * (80 + (i % 3) * 22)) + 'px');

      try { await Promise.race([fb.fs.waitForPendingWrites(fb.db), sleep(8000).then(() => { throw new Error('timeout'); })]); }
      catch (e) {
        const ok = await UI.confirm('יש שינויים שעוד לא עלו לענן', 'כנראה אין חיבור לאינטרנט. אם תתנתק עכשיו, השינויים האחרונים מהטלפון הזה יאבדו.', 'התנתק בכל זאת', true);
        if (!ok) return false;
      }
    }
    await shutdown();
    return true;
  };
  async function shutdown() {
    detach();

    const last = Date.parse((user.metadata && user.metadata.lastSignInTime) || '') || 0;

      const snap = await fs.getDocs(fs.collection(db, 'users', uid, st));

        const b = fs.writeBatch(db);
        snap.docs.slice(i, i + 400).forEach((d) => b.delete(d.ref));

      }

    await fs.deleteDoc(fs.doc(db, 'users', uid));

    const goalNet = S.settings.goal.type === 'net';

    const pct = goal ? Math.min(100, (curVal / goal) * 100) : 0;
    if (goal && pct >= 100) App.celebrateOnce('goal-' + P.key, () => { root.Fx.celebrate('money'); UI.toast('הגעת ליעד החודשי! 🎯'); });
    const projPct = goal && proj && proj.withPlanned ? Math.min(100, ((goalNet ? proj.withPlanned * (sum.gross ? sum.net.net / sum.gross : 0.85) : proj.withPlanned) / goal) * 100) : 0;

      <div class="hh-stats"><span>${sum.net.minor ? 'נטו' : 'נטו משוער'} <b>${money(sum.net.net, 0)}</b></span><i></i><span><b class="num">${U.hm(sum.hours * 60)}</b> ש׳</span><i></i><span><b>${sum.shifts}</b> משמרות</span></div>
      ${goal ? `<div class="hh-goal"><div class="progress thin"><b style="width:${projPct}%"></b><i style="width:${pct}%"></i></div>
        <div class="hh-goal-l">${U.num(pct, 0)}% מיעד ${money(goal, 0)}${proj && proj.pace ? ` · צפי ${money(proj.pace, 0)}` : ''}</div></div>`
        : (proj && proj.pace ? `<div class="hh-goal-l">צפי לסוף ${emp.periodStartDay > 1 ? 'התקופה' : 'החודש'}: ${money(proj.pace, 0)}</div>` : '')}
    </section>`;
  }

  /* ---------------- one line worth knowing (opens everything else) ---------------- */
  function highlight() {
    const now = Date.now();
    const sevOrder = { critical: 0, warn: 1, good: 2, info: 3 };
    const unread = S.notifications.filter((n) => !n.read && n.cat !== 'summary').sort((a, b) => (sevOrder[a.severity] - sevOrder[b.severity]) || b.createdAt - a.createdAt);
    const urgent = unread.filter((n) => n.severity === 'critical' || n.severity === 'warn');
    const next = [...App.model.results.values()].filter((r) => r.status === 'planned' && r.start > now && r.start - now < 36 * 3600000).sort((a, b) => a.start - b.start)[0];
    const weekly = S.notifications.filter((n) => n.type === 'weekly' && !n.read && now - n.createdAt < 4 * U.DAY).sort((a, b) => b.createdAt - a.createdAt)[0];
    const live = App.insights ? App.insights.live.slice().sort((a, b) => b.priority - a.priority) : [];
    let item = null;
    const soon = !S.activeShift && [...App.model.results.values()].filter((r) => r.status === 'planned' && r.start > now - 60 * 60000 && r.start < now + 30 * 60000).sort((a, b) => a.start - b.start)[0];
    if (soon) item = { act: 'start-planned', id: soon.id, ic: 'play', cls: 'go', t: `משמרת מתוכננת ב-${U.epochHM(soon.start)} · התחל עכשיו` };
    else if (urgent[0]) item = { act: 'insights', ic: 'alert', cls: 'sev-' + urgent[0].severity, t: urgent[0].title };
    else if (next) item = { act: 'shift-open', id: next.id, ic: 'calendar', cls: '', t: `משמרת ${U.epochKey(next.start) === U.todayKey() ? 'היום' : 'מחר'} ב-${U.epochHM(next.start)} · ${App.roleName(next.segments[0].roleId)}` };
    else if (weekly) item = { act: 'insights', ic: 'sparkle', cls: '', t: 'הסיכום השבועי שלך מוכן' };
    else if (unread[0]) item = { act: 'insights', ic: App.severityIcon[unread[0].severity] || 'bulb', cls: 'sev-' + (unread[0].severity || 'info'), t: unread[0].title };
    else if (live[0]) item = { act: 'insights', ic: 'bulb', cls: '', t: live[0].title };
    if (!item) return '';
    const more = Math.max(0, unread.length - (unread.some((n) => n.title === item.t) ? 1 : 0));
    return `<button class="highlight ${item.cls}" data-act="${item.act}"${item.id ? ` data-id="${item.id}"` : ''}>
      <span class="hl-ic">${icon(item.ic, 's')}</span><span class="hl-t">${esc(item.t)}</span>${more ? `<span class="hl-more">+${more}</span>` : ''}${icon('left', 's')}</button>`;
  }

  function birthdayCard() {
    const b = S.settings.birthDate;
    if (!b || b.slice(5) !== U.todayKey().slice(5)) return '';

      h += `<div class="banner slim warn">${icon('cloud', 's')}<div style="flex:1">${last ? 'עבר זמן מאז הגיבוי האחרון' : 'עוד לא גיבית'}</div><button class="btn text sm" data-act="backup-now">גבה</button></div>`;
    }

  App.views.home = function () {
    const unread = S.notifications.filter((n) => !n.read && n.cat !== 'summary').length;
    const today = U.todayKey();
    const hd = HebCal.hebrewDate(today);
    const hol = HebCal.holidaysOn(today).map((h) => h.name).join(', ');
    const results = [...App.model.results.values()];
    const now = Date.now();
    // planned shifts whose time has passed wait for a "done" tap, so they come first
    const pending = results.filter((r) => r.status === 'planned' && r.start < now).sort((a, b) => b.start - a.start).slice(0, 2);
    const recent = results.filter((r) => r.status === 'done').sort((a, b) => b.start - a.start).slice(0, 3);
    const name = S.settings.userName ? ', ' + esc(String(S.settings.userName).split(' ')[0]) : '';

      ${birthdayCard()}
      ${paydayCard()}
      ${banners()}
      ${hero()}
      ${actionBlock()}
      ${highlight()}
      ${pending.length + recent.length ? `<div class="home-list-head"><span>${pending.length ? 'לסמן כבוצעה' : 'משמרות אחרונות'}</span><button class="btn text sm" data-act="go-shifts">הכול</button></div>
        <div class="list home-list">${pending.map((r) => App.shiftItem(r, { showOk: true })).join('')}${recent.slice(0, Math.max(1, 3 - pending.length)).map((r) => App.shiftItem(r)).join('')}</div>`
        : UI.emptyState('clock', 'עוד אין משמרות', 'לחץ על "התחל משמרת" כשאתה מתחיל לעבוד, או על + כדי להוסיף משמרת שכבר עשית.', '')}
    `;
  };

  /* ---------------- actions ---------------- */
  App.actions['pick-role'] = async (el) => { await Store.setMeta({ lastRole: el.dataset.id }); App.rerender(); };
  App.actions['start-planned'] = (el) => { const sh = App.shift(el.dataset.id); if (sh && !S.activeShift) App.startShift(sh.roleId, { fromPlanned: sh.id }); };
  App.actions['choose-role'] = () => App.sheetsApi.pickRole('תפקיד למשמרת', async (rid) => { await Store.setMeta({ lastRole: rid }); App.rerender(); });
  App.actions['timer-start'] = async (el) => {

    let id = el && el.dataset && el.dataset.role;

      App.sheetsApi.pickRole('באיזה תפקיד?', (rid) => App.startShift(rid));
      return;
    }
    App.startShift(id || S.meta.lastRole || (roles[0] && roles[0].id));
  };
  App.actions['timer-stop'] = () => App.stopShift();
  App.actions['timer-break'] = () => App.toggleBreak();
  App.actions['timer-switch'] = () => {
    const a = S.activeShift;
    App.sheetsApi.pickRole('לאיזה תפקיד עברת?', (rid) => App.switchRole(rid), App.roles(a.employerId).filter((r) => r.id !== App.currentRole()));
  };
  App.actions['go-summary'] = () => { App.reportsState.sub = 'summary'; App.reportsState.type = 'month'; App.reportsState.anchor = U.todayKey(); App.go('reports'); };
  App.actions['go-shifts'] = () => { App.reportsState.sub = 'list'; App.go('reports'); };
  App.actions['mark-done'] = async (el, e) => {
    e.stopPropagation();
    const sh = Store.clone(App.shift(el.dataset.id));
    sh.status = 'done';
    await App.saveOps([{ store: 'shifts', put: sh }], 'סימון כבוצעה', 'המשמרת סומנה כבוצעה');
  };
  App.actions['notif-read'] = async (el) => {
    const n = S.notifications.find((x) => x.id === el.dataset.id);
    if (n) await Store.put('notifications', Object.assign({}, n, { read: true }));
  };
  App.actions['settings-goal'] = (el, e) => { e.stopPropagation(); App.sheetsApi.settingsSection('goal'); };
  App.actions['backup-now'] = () => App.doBackup(false);
})(typeof window !== 'undefined' ? window : globalThis);

  /* ---------------- draft <-> shift ---------------- */
  function emptyOv() {
    return {
      rest: { on: false, scope: 'auto', fromT: '', toT: '', pct: '', amount: '' },
      ot: { on: false, mode: 'off', hours: '', pct: '', amount: '' },
      night: { on: false, mode: 'off', pct: '', amount: '' },
      travel: { on: false, mode: 'off', amount: '' },
      rate: { on: false, rate: '' },
    };
  }
  function draftFrom(sh, opts) {
    opts = opts || {};
    const emp = S.employers[0];
    const roles = App.roles();
    if (!sh) {
      const src = opts.copyFrom || null;
      const t = opts.template || null;
      const date = opts.date || U.todayKey();
      const d = {
        id: null, status: opts.status || (date > U.todayKey() ? 'planned' : 'done'), statusTouched: !!opts.status,
        employerId: (src && src.employerId) || (t && t.employerId) || emp.id, date,
        startT: src ? U.epochHM(src.start) : t ? t.startT : '08:00', endT: src ? U.epochHM(src.end) : t ? t.endT : '16:00',
        roleId: (src && src.roleId) || (t && t.roleId) || S.meta.lastRole || (roles[0] && roles[0].id),
        splits: src ? (src.splits || []).map((x) => ({ t: U.epochHM(x.at), roleId: x.roleId })) : t && t.splits ? t.splits.slice() : [],
        breakMin: src ? src.breakMin || 0 : t ? t.breakMin || 0 : App.employer(emp.id).defaultBreakMin || 0,
        breakPaid: src ? src.breakPaid !== false : t ? t.breakPaid !== false : App.employer(emp.id).defaultBreakPaid !== false,
        noTravel: src ? !!src.noTravel : t ? !!t.noTravel : false, note: '', items: [], ov: emptyOv(), reason: '',
      };
      return d;
    }
    const ov = emptyOv();
    const o = sh.overrides || {};
    if (o.rest) Object.assign(ov.rest, { on: true, scope: o.rest.scope || 'auto', fromT: o.rest.from ? U.epochHM(o.rest.from) : '', toT: o.rest.to ? U.epochHM(o.rest.to) : '', pct: o.rest.pct || '', amount: o.rest.amount != null ? o.rest.amount : '' });
    if (o.ot) Object.assign(ov.ot, { on: true, mode: o.ot.mode, hours: o.ot.hours || '', pct: o.ot.pct || '', amount: o.ot.amount != null ? o.ot.amount : '' });
    if (o.night) Object.assign(ov.night, { on: true, mode: o.night.mode, pct: o.night.pct || '', amount: o.night.amount != null ? o.night.amount : '' });
    if (o.travel) Object.assign(ov.travel, { on: true, mode: o.travel.mode, amount: o.travel.amount != null ? o.travel.amount : '' });
    if (o.rate) Object.assign(ov.rate, { on: true, rate: o.rate.rate });
    return {
      id: sh.id, status: sh.status || 'done', statusTouched: true, employerId: sh.employerId, date: U.epochKey(sh.start),
      startT: U.epochHM(sh.start), endT: U.epochHM(sh.end), roleId: sh.roleId,
      splits: (sh.splits || []).map((x) => ({ t: U.epochHM(x.at), roleId: x.roleId })),
      breakMin: sh.breakMin || 0, breakPaid: sh.breakPaid !== false, noTravel: !!sh.noTravel, note: sh.note || '',
      items: (sh.items || []).map((x) => Object.assign({}, x)), ov, reason: sh.overrideReason || '',
      createdAt: sh.createdAt, demo: sh.demo,
    };
  }
  const numOrNull = (v) => (v === '' || v == null || isNaN(+v) ? null : +v);
  function shiftFrom(d) {
    const start = U.toEpoch(d.date, d.startT || '00:00');
    let end = U.toEpoch(d.date, d.endT || '00:00');
    if (end <= start) end = U.toEpoch(U.addDays(d.date, 1), d.endT || '00:00');
    const at = (t) => { let e = U.toEpoch(d.date, t); if (e < start) e = U.toEpoch(U.addDays(d.date, 1), t); return e; };
    const ov = {};
    if (d.ov.rest.on) {
      ov.rest = { scope: d.ov.rest.scope };
      if (d.ov.rest.scope === 'range' && d.ov.rest.fromT && d.ov.rest.toT) { ov.rest.from = at(d.ov.rest.fromT); ov.rest.to = at(d.ov.rest.toT); }
      if (numOrNull(d.ov.rest.pct)) ov.rest.pct = +d.ov.rest.pct;
      if (numOrNull(d.ov.rest.amount) != null) ov.rest.amount = +d.ov.rest.amount;
    }
    if (d.ov.ot.on) ov.ot = { mode: d.ov.ot.mode, hours: numOrNull(d.ov.ot.hours), pct: numOrNull(d.ov.ot.pct), amount: numOrNull(d.ov.ot.amount) };
    if (d.ov.night.on) ov.night = { mode: d.ov.night.mode, pct: numOrNull(d.ov.night.pct), amount: numOrNull(d.ov.night.amount) };
    if (d.ov.travel.on) ov.travel = { mode: d.ov.travel.mode, amount: numOrNull(d.ov.travel.amount) };
    if (d.ov.rate.on && numOrNull(d.ov.rate.rate)) ov.rate = { rate: +d.ov.rate.rate };
    const sh = {
      id: d.id || U.uid(), kind: 'shift', status: d.status, employerId: d.employerId, roleId: d.roleId,
      start, end, splits: d.splits.filter((x) => x.t && x.roleId).map((x) => ({ at: at(x.t), roleId: x.roleId })),
      breakMin: +d.breakMin || 0, breakPaid: !!d.breakPaid, noTravel: !!d.noTravel, note: d.note || '',
      items: d.items.filter((x) => +x.amount), overrides: Object.keys(ov).length ? ov : null, overrideReason: Object.keys(ov).length ? d.reason : '',
    };
    if (d.createdAt) sh.createdAt = d.createdAt;
    if (d.demo) sh.demo = true;
    return sh;
  }
  function priorMinFor(sh) {
    const k = U.epochKey(sh.start);
    let m = 0;
    for (const s of S.shifts) {
      if (s.id === sh.id || s.employerId !== sh.employerId || (s.status === 'planned') !== (sh.status === 'planned')) continue;
      if (U.epochKey(s.start) === k && s.start < sh.start) { const r = App.result(s.id); if (r) m += r.paidMin; }
    }
    return m;
  }
  App.previewShift = (sh) => Engine.computeShift(sh, App.model.ctx, { priorMin: priorMinFor(sh) });

  /* ---------------- breakdown & timeline (shared) ---------------- */
  App.timelineHtml = function (r) {

    for (const s of r.segments) {
      const role = App.role(s.roleId);
      h += `<i style="inset-inline-start:${pos(s.start)}%;width:${pos(s.end) - pos(s.start)}%;background:${role ? role.color : '#999'};opacity:.85"></i>`;
    }
    const rests = r.slices.filter((s) => s.rest);
    if (rests.length) {
      const a = rests[0].a, b = rests[rests.length - 1].b;
      h += `<span class="rz" style="inset-inline-start:${pos(a)}%;width:${pos(b) - pos(a)}%"></span>`;
    }
    h += '</div>';
    const labels = [`<span class="num">${U.epochHM(r.start)}</span>`];
    if (rests.length) labels.push(`<span class="tag rest">${icon('candle')} ⁦${U.epochHM(rests[0].a)}–${U.epochHM(rests[rests.length - 1].b)}⁩</span>`);
    labels.push(`<span class="num">${U.epochHM(r.end)}${U.epochKey(r.end) !== r.dateKey ? ' (+1)' : ''}</span>`);
    return h + `<div class="row-flex tiny muted" style="justify-content:space-between">${labels.join('')}</div>`;
  };
  App.breakdownHtml = function (r, sh) {
    if (!r) return '';
    const emp = App.employer(r.employerId);
    let rows = '';
    for (const l of r.lines) {
      rows += `<tr><td><span style="color:${l.color}">●</span> ${esc(l.roleName)} · ${esc(l.label)}<div class="f">${U.hours(l.hours)} ש׳ × ${U.money(l.rate)} × ${l.pct}%</div></td><td class="a">${U.money(l.amount)}</td></tr>`;
    }
    for (const x of r.extras) rows += `<tr><td>${esc(x.label)}${x.detail ? `<div class="f">${esc(x.detail)}</div>` : ''}</td><td class="a">${U.money(x.amount)}</td></tr>`;
    rows += `<tr><td><b>שכר עבודה</b></td><td class="a">${U.money(r.wage)}</td></tr>`;
    const tr = r.travel;
    if (r.status !== 'planned' || tr.amount) {
      rows += `<tr><td>נסיעות${tr.mode === 'none' ? ' (ללא)' : tr.mode === 'manual' ? ' (ידני)' : ''}<div class="f">${tr.mode === 'auto' ? 'ליום עבודה · נספר פעם אחת ביום' + (+emp.travelMonthlyCap ? `, עד תקרה של ${U.money(emp.travelMonthlyCap, 0)} לחודש` : '') : ''}</div></td><td class="a">${U.money(tr.amount)}</td></tr>`;
    }
    for (const it of (sh && sh.items) || []) {
      const neg = it.type === 'deduction';
      rows += `<tr><td>${esc(it.label || Engine.ADJ_LABELS[it.type])}${it.type === 'tips' ? '<div class="f">טיפים — לא נכללים בברוטו</div>' : ''}${neg ? '<div class="f">ניכוי — יורד מהנטו</div>' : ''}</td><td class="a">${neg ? '−' : ''}${U.money(it.amount)}</td></tr>`;
    }
    rows += `<tr class="tot"><td>סה״כ</td><td class="a">${U.money(r.total)}</td></tr>`;
    const notes = [];
    notes.push(`זמן במשמרת: ${U.hm(r.elapsedMin)}` + (r.roundingDeltaMin ? ` · עיגול: ${r.roundingDeltaMin > 0 ? '+' : ''}${r.roundingDeltaMin} דק׳` : ''));
    if (r.breakMin) notes.push(`הפסקה ${r.breakMin} דק׳ ${r.breakPaid ? 'בתשלום' : 'ללא תשלום — נוכתה יחסית מכל השעות'}`);
    notes.push(`שעות נוספות אחרי ${r.thresholdH} שעות ביום` + (r.priorMin ? ` · כבר עבדת ${U.hm(r.priorMin)} באותו יום לפני המשמרת` : '') + (r.isNightShift && emp.nightShiftShortDay ? ' (משמרת לילה)' : ''));
    const wins = r.restLabels.length ? r.slices.filter((s) => s.autoRest) : [];
    if (r.autoRestMin > 0) notes.push(`חלון ${esc(r.restLabels.join(', ') || 'שבת/חג')} במשמרת: ⁦${U.epochHM(wins[0].a)}–${U.epochHM(wins[wins.length - 1].b)}⁩ (${S.settings.rest.mode === 'city' ? 'לפי ' + esc(S.settings.rest.city === '__custom' ? 'מיקום מותאם' : S.settings.rest.city) : 'שעות קבועות'})`);
    if (r.warnings.length) notes.push('⚠️ ' + r.warnings.join(', '));
    return `<table class="bd">${rows}</table><div class="tiny muted" style="margin-top:8px">${notes.map((n) => '• ' + n).join('<br>')}</div>`;
  };

  /** Planned copies of a shift on the same weekday for the next n weeks (same local times, DST-safe). */
  App.weeklyCopies = function (sh, n) {
    const at = (epoch, i) => U.toEpoch(U.addDays(U.epochKey(epoch), 7 * i), U.epochHM(epoch));
    const ops = [];
    for (let i = 1; i <= n; i++) {
      const start = at(sh.start, i), end = at(sh.end, i);
      const busy = S.shifts.some((x) => x.employerId === sh.employerId && x.start < end && x.end > start);
      if (busy) continue;
      ops.push({ store: 'shifts', put: {
        id: U.uid(), kind: 'shift', employerId: sh.employerId, roleId: sh.roleId, status: 'planned', start, end,
        breakMin: sh.breakMin || 0, breakPaid: sh.breakPaid !== false, noTravel: !!sh.noTravel,
        splits: (sh.splits || []).map((x) => ({ at: at(x.at, i), roleId: x.roleId })), items: [], note: '',
      } });
    }
    return ops;
  };

  App.saveTemplate = async function (sh) {
    const name = await UI.promptText('שמירת תבנית', 'שם התבנית', `${App.roleName(sh.roleId)} ⁦${U.epochHM(sh.start)}–${U.epochHM(sh.end)}⁩`);
    if (!name) return;
    await App.saveOps([{ store: 'templates', put: {
      id: U.uid(), name, roleId: sh.roleId, employerId: sh.employerId, startT: U.epochHM(sh.start), endT: U.epochHM(sh.end),
      breakMin: sh.breakMin || 0, breakPaid: sh.breakPaid !== false, noTravel: !!sh.noTravel,
      splits: (sh.splits || []).map((x) => ({ t: U.epochHM(x.at), roleId: x.roleId })),
    } }], 'שמירת תבנית', 'התבנית נשמרה');
  };

          ${ovCount() ? `<label class="field"><span class="lbl">סיבה (לא חובה)</span>${inp('reason', d.reason, 'placeholder="למשל: המעסיק לא מחשיב את השעה הזו כשבת"')}</label>

/* ============================================================
 * views-calendar.js — month & week calendar.

(function (root) {
  'use strict';
  const { U, HebCal, Store, UI, App } = root;
  const S = Store.S;
  const { icon, esc } = UI;

  App.calState = { mode: 'month', anchor: U.todayKey() };

  function dayData() {
    const map = {};
    for (const r of App.model.results.values()) {
      const d = (map[r.dateKey] = map[r.dateKey] || { shifts: [], entries: [], total: 0, ov: false });
      d.shifts.push(r);
      if (r.status === 'done') d.total += r.total;
      if (r.overridden || r.dayRuleHit) d.ov = true;
    }
    for (const e of S.entries) {
      const d = (map[e.date] = map[e.date] || { shifts: [], entries: [], total: 0, ov: false });
      d.entries.push(e);
      const v = App.model.entryVals.get(e.id);
      if (v && e.status !== 'planned') d.total += e.type === 'deduction' ? 0 : v.amount;
    }
    return map;
  }
  const shortMoney = (n) => (n >= 1000 ? '₪' + (n / 1000).toFixed(1).replace('.0', '') + 'K' : '₪' + Math.round(n));

  function monthView(map) {
    const mk = App.calState.anchor.slice(0, 7);
    const first = mk + '-01';
    const start = U.weekStart(first, S.settings.weekStart || 0);
    const today = U.todayKey();
    const cfg = App.model.ctx.restCfg;
    let cells = '';
    let monthTotal = 0, monthHours = 0;
    for (let i = 0; i < 42; i++) {
      const k = U.addDays(start, i);
      if (i >= 35 && k.slice(0, 7) !== mk) break;
      const d = map[k];
      const inMonth = k.slice(0, 7) === mk;
      if (d && inMonth) { monthTotal += d.total; monthHours += d.shifts.filter((r) => r.status === 'done').reduce((s, r) => s + r.paidHours, 0); }
      const rest = HebCal.restDayInfo(k, cfg);
      const hol = HebCal.holidaysOn(k);
      const hd = HebCal.hebrewDate(k);
      const dots = d ? d.shifts.slice(0, 4).map((r) => { const role = App.role(r.segments[0] ? r.segments[0].roleId : null); return `<i class="${r.status === 'planned' ? 'pl' : ''}" style="background:${role ? role.color : '#999'};color:${role ? role.color : '#999'}"></i>`; }).join('') + d.entries.slice(0, 2).map((e) => `<i style="background:var(--outline)"></i>`).join('') : '';
      cells += `<button class="cal-day ${inMonth ? '' : 'other'} ${rest ? 'rest' : ''} ${k === today ? 'today' : ''}" data-act="cal-day" data-k="${k}" aria-label="${U.fmtDate(k, 'long')}">
        ${d && d.ov ? '<span class="ovr" title="עקיפה ידנית"></span>' : ''}${hol.some((h) => h.rest) ? '<span class="hol">🕯</span>' : hol.length ? '<span class="hol">•</span>' : ''}
        <span class="dn">${+k.slice(8)}</span><span class="hd">${hd.dayStr}</span><span class="dots">${dots}</span>${d && d.total ? `<span class="amt">${shortMoney(d.total)}</span>` : ''}</button>`;
    }
    const dows = [...Array(7)].map((_, i) => U.HEB_DAYS_SHORT[(i + (S.settings.weekStart || 0)) % 7]);
    const hm = HebCal.hebrewDate(first), hm2 = HebCal.hebrewDate(U.monthEnd(mk));
    const hebLabel = hm.monthStr === hm2.monthStr ? hm.monthStr + ' ' + hm.yearStr : hm.monthStr + '–' + hm2.monthStr + ' ' + hm2.yearStr;
    return `<div class="cal-nav"><button class="icon-btn" data-act="cal-nav" data-dir="-1" aria-label="הקודם">${icon('right')}</button><h2>${U.fmtMonth(mk)}<div class="tiny muted" style="font-weight:400">${esc(hebLabel)}</div></h2><button class="icon-btn" data-act="cal-nav" data-dir="1" aria-label="הבא">${icon('left')}</button></div>
      <div class="cal-dow">${dows.map((x) => `<span>${x}</span>`).join('')}</div>
      <div class="cal-grid swipe-area" id="cal-swipe">${cells}</div>
      <div class="row-flex small" style="margin:10px 4px"><span>סה״כ בחודש: <b>${UI.money(monthTotal, 0)}</b></span><span class="spacer"></span><span class="muted"><span class="num">${U.hm(monthHours * 60)}</span> ש׳</span></div>`;
  }

  function weekView(map) {
    const ws = U.weekStart(App.calState.anchor, S.settings.weekStart || 0);
    const cfg = App.model.ctx.restCfg;
    const today = U.todayKey();
    let rows = '', tot = 0, hrs = 0;
    for (let i = 0; i < 7; i++) {
      const k = U.addDays(ws, i);
      const d = map[k];

      const day0 = U.dayStart(k), day1 = U.dayStart(U.addDays(k, 1));

      let bars = '';
      for (const w of HebCal.restWindows(U.addDays(k, -1), U.addDays(k, 1), cfg)) {
        if (w.end <= day0 || w.start >= day1) continue;
        bars += `<span class="rz" style="inset-inline-start:${pos(w.start)}%;width:${pos(w.end) - pos(w.start)}%"></span>`;
      }
      if (d) for (const r of d.shifts) for (const s of r.segments) {
        const role = App.role(s.roleId);
        if (s.end <= day0 || s.start >= day1) continue;
        bars += `<i style="inset-inline-start:${pos(s.start)}%;width:${Math.max(1.5, pos(s.end) - pos(s.start))}%;background:${role ? role.color : '#999'};opacity:${r.status === 'planned' ? 0.45 : 0.9}"></i>`;
      }
      if (d) { tot += d.total; hrs += d.shifts.filter((r) => r.status === 'done').reduce((s, r) => s + r.paidHours, 0); }

/* ============================================================
 * views-payslip.js — payslip upload, text extraction (pdf.js /
 * Hebrew OCR with tesseract.js), verification, analysis, archive,
 * open-gap tracking and the optional Claude analysis.
 *
 * Without an API key everything runs on the phone. With a key, only
 * redacted text the user reviewed and approved is sent.
 * ============================================================ */
(function (root) {
  'use strict';
  const { U, Engine, Payslip, Store, UI, App, Charts } = root;
  const S = Store.S;
  const { icon, esc, money } = UI;

  const LIBS = {
    pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
    tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    anthropic: 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm',
  };
  const loaded = {};
  function loadScript(src) {
    if (loaded[src]) return loaded[src];
    loaded[src] = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.async = true; s.crossOrigin = 'anonymous';
      s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error('לא ניתן לטעון רכיב (נדרש אינטרנט בשימוש הראשון)')); };
      document.head.appendChild(s);
    });
    return loaded[src];
  }
  const DISCLAIMER = `<div class="disclaimer">${icon('info', 's')}<div>הניתוח הוא כלי עזר בלבד ואינו ייעוץ משפטי או חשבונאי. חישובים שתלויים בהסכם קיבוצי, בחוזה או בוותק מסומנים ברמת ביטחון נמוכה. במקרה של ספק — פנה למשאבי אנוש, לרו״ח, לארגון העובדים או לאתר "כל זכות".</div></div>`;

  /* ---------------- extraction ---------------- */
  async function extractPdf(file, progress) {
    await loadScript(LIBS.pdf);
    const pdfjs = root.pdfjsLib;
    pdfjs.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
    const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
    let lines = [];
    for (let p = 1; p <= Math.min(doc.numPages, 4); p++) {
      progress(`קורא עמוד ${p} מתוך ${doc.numPages}…`);
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      lines = lines.concat(Payslip.linesFromPdfItems(tc.items));
    }
    const text = lines.join('\n');
    if (text.replace(/\s/g, '').length > 80) return { text, source: 'pdf' };
    // scanned PDF → render & OCR
    progress('ה-PDF סרוק — מריץ זיהוי טקסט…');
    const page = await doc.getPage(1);
    const vp = page.getViewport({ scale: 2.5 });
    const canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    return { text: await ocr(canvas, progress), source: 'ocr' };
  }
  async function ocr(image, progress) {
    await loadScript(LIBS.tesseract);
    progress('טוען מנוע זיהוי עברית (פעם ראשונה ~10MB)…');
    const worker = await root.Tesseract.createWorker('heb+eng', 1, {
      logger: (m) => { if (m.status === 'recognizing text') progress(`מזהה טקסט… ${Math.round(m.progress * 100)}%`); },
    });
    try {
      const { data } = await worker.recognize(image);
      return data.text;
    } finally { await worker.terminate(); }
  }
  async function extract(file, progress) {
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) return extractPdf(file, progress);
    return { text: await ocr(file, progress), source: 'ocr' };
  }

  /* ---------------- flow: upload → extract → verify ---------------- */
  App.actions['payslip-new'] = () => {
    if (UI.sheets.length) UI.closeAll();
    UI.openSheet({
      title: 'ניתוח תלוש שכר',
      body: `<div class="small muted" style="margin-bottom:12px">העלה את התלוש (PDF או צילום). הקריאה מתבצעת בטלפון — התלוש לא נשלח לשום מקום.</div>
        <label class="btn big" style="margin-bottom:10px">${icon('upload')} בחר קובץ PDF או תמונה<input type="file" accept="application/pdf,image/*" id="ps-file" hidden></label>
        <label class="btn tonal block" style="margin-bottom:10px">${icon('camera')} צלם את התלוש<input type="file" accept="image/*" capture="environment" id="ps-cam" hidden></label>
        <button class="btn outlined block" data-manual>${icon('edit')} הזנה ידנית (בלי קובץ)</button>
        <div class="tiny muted" style="margin-top:12px">טיפ: PDF מקורי מדויק יותר מצילום. בצילום — תאורה טובה, ישר מלמעלה, כל התלוש בפריים.</div>${DISCLAIMER}`,
      onMount: (el) => {
        const go = async (file) => {
          if (!file) return;
          UI.closeTop();
          setTimeout(() => startExtraction(file), 320);
        };
        el.querySelector('#ps-file').onchange = (e) => go(e.target.files[0]);
        el.querySelector('#ps-cam').onchange = (e) => go(e.target.files[0]);
        el.querySelector('[data-manual]').onclick = () => { UI.closeTop(); setTimeout(() => verifySheet({ fields: {}, other: [], period: defaultPeriod(), text: '', source: 'manual' }), 320); };
      },
    });
  };
  function defaultPeriod() {
    const emp = S.employers[0];
    return U.addMonthKey(Engine.periodOf(U.todayKey(), emp).key, -1);
  }
  async function startExtraction(file) {
    let statusEl = null;
    UI.openSheet({
      title: 'קורא את התלוש…',
      body: `<div class="empty"><div class="art">${icon('receipt')}</div><h3 id="ps-status">מתחיל…</h3><div class="small">${esc(file.name)}</div></div>`,
      onMount: (el) => { statusEl = el.querySelector('#ps-status'); },
    });
    const progress = (t) => { if (statusEl) statusEl.textContent = t; };
    try {
      const fileId = 'file_' + U.uid();
      await Store.putFile(fileId, file, file.name, file.type);
      const { text, source } = await extract(file, progress);
      const parsed = Payslip.parseText(text);
      UI.closeTop();
      setTimeout(() => verifySheet({ fields: parsed.fields, other: parsed.other, period: parsed.period || defaultPeriod(), text, source, fileId, fileName: file.name }), 320);
    } catch (e) {
      console.error(e);

    }
  }

  /* ---------------- verification ---------------- */
  const GROUPS = [['pay', 'תשלומים'], ['ded', 'ניכויים מהעובד'], ['emp', 'הפרשות מעסיק'], ['total', 'סיכומים'], ['info', 'מידע']];
  function verifySheet(draft) {
    const d = { period: draft.period, fields: Store.clone(draft.fields) || {}, other: (draft.other || []).map((o) => Object.assign({ guess: o.guess || 'ignore' }, o)), text: draft.text || '', source: draft.source, fileId: draft.fileId, fileName: draft.fileName, id: draft.id, notes: draft.notes || '' };
    let sheetEl = null;
    const fieldRow = (f) => {
      const v = d.fields[f.key] || {};
      return `<div style="display:grid;grid-template-columns:1fr ${f.hours ? '90px ' : ''}120px 36px;gap:8px;align-items:center;margin-bottom:8px">
        <div class="small"><b>${esc(f.label)}</b>${v.line && v.line !== 'AI' ? `<div class="tiny muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(v.line)}">${esc(v.line)}</div>` : v.line === 'AI' ? '<div class="tiny muted">זוהה ע״י AI</div>' : ''}</div>
        ${f.hours ? `<input class="input" type="number" step="any" inputmode="decimal" data-q="${f.key}" value="${v.qty != null ? v.qty : ''}" placeholder="שעות">` : ''}
        <input class="input" type="number" step="any" inputmode="decimal" data-v="${f.key}" value="${v.value != null ? v.value : ''}" placeholder="${f.kind === 'info' ? '' : '₪'}">
        <button class="icon-btn" data-rm="${f.key}" aria-label="הסר">${icon('x', 's')}</button></div>`;
    };
    function body() {
      const present = Payslip.FIELDS.filter((f) => d.fields[f.key]);
      const missing = Payslip.FIELDS.filter((f) => !d.fields[f.key]);
      return `<div class="banner">${icon('eye')}<div>בדוק שהערכים נכונים ותקן אם צריך. ${d.source === 'ocr' ? 'זיהוי מתמונה עלול לטעות בספרות.' : d.source === 'manual' ? 'הזן את מה שמופיע בתלוש — לפחות ברוטו, נטו ושעות.' : ''}</div></div>
        ${d.notes ? `<div class="banner">${icon('sparkle')}<div>${esc(d.notes)}</div></div>` : ''}
        <label class="field"><span class="lbl">חודש התלוש</span><input class="input" type="month" id="vf-period" value="${d.period || ''}"></label>
        ${GROUPS.map(([kind, label]) => { const fs = present.filter((f) => f.kind === kind); return fs.length ? `<div class="section-title">${label}</div><div class="card">${fs.map(fieldRow).join('')}</div>` : ''; }).join('')}
        <div class="row-flex" style="gap:8px;margin-bottom:12px"><select class="input" id="vf-add" style="flex:1"><option value="">+ הוסף שורה מהתלוש…</option>${missing.map((f) => `<option value="${f.key}">${esc(f.label)}</option>`).join('')}</select></div>
        ${d.other.length ? `<div class="section-title">שורות שלא זוהו</div><div class="card">${d.other.map((o, i) => `<div style="margin-bottom:10px"><div class="small">${esc(o.line)}</div>
          <div class="grid2" style="margin-top:6px"><select class="input" data-og="${i}">${[['ignore', 'התעלם'], ['otherDed', 'ניכוי אחר'], ['otherPay', 'תשלום אחר'], ...Payslip.FIELDS.map((f) => [f.key, f.label])].map(([k, l]) => `<option value="${k}" ${o.guess === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
          <input class="input" type="number" step="any" data-ov="${i}" value="${o.value}"></div></div>`).join('')}</div>` : ''}
        ${d.text ? `<details class="collapse"><summary>${icon('file', 's')} הטקסט שזוהה</summary><div class="in"><div class="code">${esc(d.text)}</div></div></details>` : ''}
        ${d.text ? `<button class="btn outlined block" data-ai>${icon('sparkle')} ניתוח חכם עם Claude ${S.settings.ai.apiKey ? '' : '(דורש מפתח API)'}</button><div class="tiny muted" style="margin:6px 4px 12px">אופציונלי. לפני שליחה יוסתרו ת״ז, פרטי בנק וכתובת, ותראה בדיוק מה נשלח.</div>` : ''}`;
    }
    function readInputs() {
      const el = sheetEl;
      d.period = el.querySelector('#vf-period').value || d.period;
      el.querySelectorAll('[data-v]').forEach((i) => { const k = i.dataset.v; d.fields[k] = d.fields[k] || {}; d.fields[k].value = UI.numIn(i); });
      el.querySelectorAll('[data-q]').forEach((i) => { const k = i.dataset.q; d.fields[k] = d.fields[k] || {}; d.fields[k].qty = UI.numIn(i); if (d.fields[k].qty && d.fields[k].value) d.fields[k].rate = d.fields[k].value / d.fields[k].qty; });
      el.querySelectorAll('[data-og]').forEach((s) => { d.other[+s.dataset.og].guess = s.value; });
      el.querySelectorAll('[data-ov]').forEach((i) => { d.other[+i.dataset.ov].value = UI.numIn(i) || 0; });
    }
    function redraw() { const b = sheetEl.querySelector('.sh-body'); const y = b.scrollTop; b.innerHTML = body(); b.scrollTop = y; bindAdd(); }
    function bindAdd() {
      const add = sheetEl.querySelector('#vf-add');
      if (add) add.onchange = () => { readInputs(); if (add.value) { d.fields[add.value] = { value: null }; redraw(); } };
    }
    UI.openSheet({
      title: 'אימות נתוני התלוש', full: true, body: body(),
      foot: `<button class="btn" data-go>${icon('check')} נתח</button>`,
      onMount: (el) => {
        sheetEl = el; bindAdd();
        el.addEventListener('click', async (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          if (b.dataset.rm) { readInputs(); delete d.fields[b.dataset.rm]; redraw(); }
          if (b.hasAttribute('data-ai')) { readInputs(); App.aiAnalyze(d.text, (res) => { Object.assign(d.fields, res.fields); d.other = res.other.length ? res.other : d.other; if (res.period) d.period = res.period; d.notes = res.notes; d.source = 'ai'; redraw(); }); }
          if (b.hasAttribute('data-go')) {
            readInputs();
            if (!/^\d{4}-\d{2}$/.test(d.period || '')) { UI.invalid('בחר את חודש התלוש'); return; }
            // mapped unknown lines
            for (const o of d.other) {
              if (Payslip.FIELD[o.guess] && !d.fields[o.guess]) d.fields[o.guess] = { value: Math.abs(o.value), line: o.line };
            }
            for (const k of Object.keys(d.fields)) if (d.fields[k].value == null && d.fields[k].qty == null) delete d.fields[k];
            UI.closeTop();
            setTimeout(() => analysisSheet({ id: d.id || 'ps_' + U.uid(), period: d.period, fields: d.fields, other: d.other, text: d.text, source: d.source, fileId: d.fileId, fileName: d.fileName, isNew: !d.id }), 320);
          }
        });
      },
    });
  }

  /* ---------------- analysis ---------------- */
  const STATUS = { ok: ['okc', 'תקין', '✅'], warn: ['alert', 'כדאי לבדוק', '⚠️'], bad: ['xc', 'חסר או שגוי', '❌'] };
  const CONF = { high: 'ביטחון גבוה', medium: 'ביטחון בינוני', low: 'ביטחון נמוך' };
  function prevSlipOf(period, id) {
    return S.payslips.filter((p) => p.period < period && p.id !== id).sort((a, b) => b.period.localeCompare(a.period))[0];
  }
  function analysisHtml(slip, a) {
    const counts = { ok: 0, warn: 0, bad: 0 };
    a.findings.forEach((f) => counts[f.status]++);
    const prev = prevSlipOf(slip.period, slip.id);
    const wf = Payslip.waterfall(slip.fields);
    const lines = Payslip.explainLines(slip.fields, prev && prev.fields);
    const changes = Payslip.compareSlips(prev && prev.fields, slip.fields);
    const msg = Payslip.employerMessage(a, { name: S.settings.userName || '' });
    const order = { bad: 0, warn: 1, ok: 2 };
    return `
      <div class="status-summary"><div class="ok">✅ ${counts.ok}<div class="tiny">תקין</div></div><div class="warn">⚠️ ${counts.warn}<div class="tiny">לבדוק</div></div><div class="bad">❌ ${counts.bad}<div class="tiny">חסר/שגוי</div></div></div>
      ${a.totalMissing > 0 ? `<div class="card tonal"><div class="small">הפרש משוער לטובתך</div><div class="hero-num">${money(a.totalMissing)}</div><div class="tiny">סכום הממצאים המסומנים ❌. בדוק את הפירוט לפני פנייה למעסיק.</div></div>` : counts.bad === 0 ? `<div class="card tonal"><b>${icon('okc', 's')} לא נמצאו חוסרים</b><div class="small">התלוש תואם למשמרות שרשמת${counts.warn ? ', עם כמה נקודות לבדיקה' : ''}.</div></div>` : ''}
      ${a.overridesInPeriod ? `<div class="banner warn">${icon('hand')}<div>${a.overridesInPeriod} משמרות בתקופה כוללות עקיפה ידנית. ממצאים שנובעים מהן מסומנים.</div></div>` : ''}
      <div class="small muted" style="margin:0 4px 10px">תקופה: ⁦${U.fmtDate(a.expected.P.from)}–${U.fmtDate(a.expected.P.to)}⁩ · ${a.expected.shifts.length} משמרות · ${U.hours(a.expected.t.hours)} ש׳</div>
      ${a.findings.slice().sort((x, y) => order[x.status] - order[y.status]).map((f) => `<div class="finding ${f.status}">
        <div class="ft"><span>${STATUS[f.status][2]}</span><span>${esc(f.area)} · ${esc(f.title)}</span>${f.amount > 0 && f.status !== 'ok' ? `<span class="amt">${U.money(f.amount)}</span>` : ''}</div>
        <div class="fd">${esc(f.detail)}</div>
        ${f.fromOverride ? `<div class="fd" style="color:var(--override)">${icon('hand', 's')} ${esc(f.fromOverride)}</div>` : ''}
        ${f.note ? `<div class="fd small">${icon('info', 's')} ${esc(f.note)}</div>` : ''}
        ${f.shifts && f.shifts.length ? `<div style="margin-top:6px">${f.shifts.slice(0, 6).map((id) => { const r = App.result(id); return r ? `<button class="chip" data-act="shift-open" data-id="${id}">${U.fmtDate(r.dateKey, 'short')} · ${U.hm(r.paidMin)}</button>` : ''; }).join(' ')}</div>` : ''}
        <div class="fb">על מה זה מבוסס: ${esc(f.basis)} · <span class="conf ${f.confidence}">${CONF[f.confidence]}</span></div></div>`).join('')}
      ${msg ? `<div class="section-title">${icon('send', 's')} מה לעשות</div><div class="card"><div class="small" style="margin-bottom:8px">הודעה מוכנה למעסיק / משאבי אנוש (אפשר לערוך):</div><textarea class="input" id="ps-msg" rows="10">${esc(msg)}</textarea>
        <div class="btn-row" style="margin-top:8px"><button class="btn tonal" data-copy-msg>${icon('copy')} העתק</button><button class="btn tonal" data-share-msg>${icon('share')} שתף</button></div></div>` : ''}
      ${changes.length ? `<div class="section-title">${icon('alert', 's')} שינויים מהתלוש הקודם</div><div class="card">${changes.map((c) => `<div class="kv"><span>${esc(c.text)}</span></div>`).join('')}</div>` : ''}
      ${wf ? `<div class="section-title">${icon('chart', 's')} מברוטו לנטו</div><div class="card">${Charts.waterfall(wf, { fmt: (v) => U.money(v), axisFmt: (v) => '₪' + (v >= 1000 ? (v / 1000).toFixed(1).replace('.0', '') + 'K' : Math.round(v)) })}
        <div class="tiny muted">כחול = ברוטו, אדום = ניכויים, ירוק = נטו. לחץ על עמודה לפרטים.</div></div>` : ''}
      <div class="section-title">${icon('info', 's')} הסבר לכל שורה</div>
      <div class="list">${lines.map((l) => `<details class="collapse" style="margin:0;border-radius:0"><summary><span style="flex:1">${esc(l.label)}${l.change ? ' <span class="tag warn">שינוי</span>' : ''}</span><span class="money">${l.kind === 'info' ? U.num(l.value, 2) : U.money(l.value)}</span></summary><div class="in small">${esc(l.explain)}${l.qty ? `<br>כמות: ${U.num(l.qty, 2)}` : ''}${l.change ? `<br><b>${esc(l.change)}</b>` : ''}</div></details>`).join('')}</div>
      ${DISCLAIMER}`;
  }
  function analysisSheet(slip) {
    const a = Payslip.analyze(slip, App.model);
    UI.openSheet({
      title: 'ניתוח תלוש · ' + U.fmtMonth(slip.period), full: true,
      body: analysisHtml(slip, a),
      foot: slip.isNew ? `<button class="btn tonal" data-edit>${icon('edit')} תקן נתונים</button><button class="btn" data-save>${icon('check')} שמור בארכיון</button>`
        : `<button class="btn danger" data-del style="flex:0 0 auto">${icon('trash')}</button><button class="btn tonal" data-edit>${icon('edit')} תקן נתונים</button>${slip.fileId ? `<button class="btn tonal" data-file style="flex:0 0 auto">${icon('file')}</button>` : ''}`,
      onMount: (el) => {
        el.addEventListener('click', async (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          if (b.hasAttribute('data-copy-msg')) { await UI.copyText(el.querySelector('#ps-msg').value); UI.toast('ההודעה הועתקה'); }
          if (b.hasAttribute('data-share-msg')) { const t = el.querySelector('#ps-msg').value; if (navigator.share) navigator.share({ text: t }).catch(() => {}); else { await UI.copyText(t); UI.toast('הועתק'); } }
          if (b.hasAttribute('data-edit')) { UI.closeTop(); setTimeout(() => verifySheet(Object.assign({}, slip, { id: slip.isNew ? null : slip.id })), 320); }
          if (b.hasAttribute('data-file')) {
            const f = await Store.getFile(slip.fileId);
            if (f) window.open(URL.createObjectURL(f.blob), '_blank'); else UI.toast('הקובץ לא נמצא');
          }
          if (b.hasAttribute('data-del')) {
            if (!(await UI.confirm('למחוק את התלוש מהארכיון?', '', 'מחק', true))) return;
            UI.closeTop();
            const ops = [{ store: 'payslips', del: slip.id }, ...S.gaps.filter((g) => g.payslipId === slip.id).map((g) => ({ store: 'gaps', del: g.id }))];
            await App.saveOps(ops, 'מחיקת תלוש', 'התלוש נמחק');
          }
          if (b.hasAttribute('data-save')) { UI.closeTop(); await saveSlip(slip, a); }
        });
      },
    });
  }
  async function saveSlip(slip, a) {
    const counts = { ok: 0, warn: 0, bad: 0 };
    a.findings.forEach((f) => counts[f.status]++);
    const rec = {
      id: slip.id, period: slip.period, employerId: S.employers[0].id, fields: slip.fields, other: slip.other,
      text: slip.text, source: slip.source, fileId: slip.fileId || null, fileName: slip.fileName || '',
      summary: { counts, totalMissing: a.totalMissing, gross: slip.fields.gross ? slip.fields.gross.value : null, net: slip.fields.net ? slip.fields.net.value : null },
    };
    const ops = [{ store: 'payslips', put: rec }];
    // open gaps from this slip (replace previous gaps of the same slip)
    S.gaps.filter((g) => g.payslipId === slip.id && g.status === 'open').forEach((g) => ops.push({ store: 'gaps', del: g.id }));
    for (const f of a.findings.filter((x) => x.status === 'bad' && x.amount > 0)) {
      ops.push({ store: 'gaps', put: { id: slip.id + '_' + f.area, payslipId: slip.id, period: slip.period, area: f.area, title: f.title, amount: Math.round(f.amount * 100) / 100, status: 'open' } });
    }
    // did this slip pay back earlier gaps? (a "differences" line close to an open gap)
    const diff = slip.fields.diff ? Math.abs(+slip.fields.diff.value) : 0;
    if (diff > 0) {
      const open = S.gaps.filter((g) => g.status === 'open' && g.period < slip.period);
      const total = open.reduce((s, g) => s + g.amount, 0);
      for (const g of open) {
        if (Math.abs(g.amount - diff) <= g.amount * 0.2 || (open.length > 1 && Math.abs(total - diff) <= total * 0.2)) ops.push({ store: 'gaps', put: Object.assign({}, g, { status: 'maybe', note: `בתלוש ${U.fmtMonth(slip.period)} יש שורת הפרשים של ${U.money(diff)}` }) });
      }
    }
    // notable changes vs previous slip → notifications
    const prev = prevSlipOf(slip.period, slip.id);
    for (const c of Payslip.compareSlips(prev && prev.fields, slip.fields)) {
      ops.push({ store: 'notifications', put: { id: 'pschg-' + slip.period + '-' + c.type, key: 'pschg-' + slip.period + '-' + c.type, type: 'payslipGap', cat: 'money', severity: 'warn', title: 'שינוי בתלוש ' + U.fmtMonth(slip.period), body: c.text, explain: 'השוואה לתלוש הקודם (' + U.fmtMonth(prev.period) + ').', createdAt: Date.now(), read: false } });
    }
    await App.saveOps(ops, 'שמירת תלוש', 'התלוש נשמר בארכיון');
  }
  App.sheetsApi.payslip = (id) => {
    const p = S.payslips.find((x) => x.id === id);
    if (p) analysisSheet(Object.assign({}, p, { isNew: false }));
  };
  App.actions['payslip-open'] = (el) => App.sheetsApi.payslip(el.dataset.id);
  App.actions['gap-set'] = async (el) => {
    const g = S.gaps.find((x) => x.id === el.dataset.id);
    if (g) await App.saveOps([{ store: 'gaps', put: Object.assign({}, g, { status: el.dataset.s }) }], 'עדכון פער', el.dataset.s === 'resolved' ? 'סומן כהוחזר' : 'עודכן');
  };

  /* ---------------- payslips tab (in reports) ---------------- */
  App.payslipsTab = function () {
    const slips = S.payslips.slice().sort((a, b) => b.period.localeCompare(a.period));
    const gaps = S.gaps.filter((g) => g.status !== 'resolved').sort((a, b) => b.period.localeCompare(a.period));
    const trend = slips.slice(0, 12).reverse();
    return `<button class="btn big" data-act="payslip-new" style="margin-bottom:12px">${icon('upload')} העלה תלוש לניתוח</button>
      ${gaps.length ? `<div class="section-title">${icon('alert', 's')} פערים פתוחים<span class="spacer"></span><span class="small">${U.money(gaps.filter((g) => g.status === 'open').reduce((s, g) => s + g.amount, 0), 0)}</span></div>
        <div class="list">${gaps.map((g) => `<div class="item" style="cursor:default"><span class="lead" style="background:${g.status === 'maybe' ? 'var(--warn-bg)' : 'var(--bad-bg)'};color:${g.status === 'maybe' ? 'var(--warn)' : 'var(--bad)'}">${icon(g.status === 'maybe' ? 'refresh' : 'xc')}</span>
          <span class="body"><span class="t">${esc(g.title)} · ${U.fmtMonth(g.period)}</span><span class="s">${g.status === 'maybe' ? esc(g.note || 'ייתכן שהוחזר') : 'עוד לא הוחזר'}</span></span>
          <span class="trail"><span class="a">${money(g.amount, 0)}</span><br><button class="btn text sm" data-act="gap-set" data-id="${esc(g.id)}" data-s="resolved">הוחזר ✓</button></span></div>`).join('')}</div>` : ''}
      ${trend.length >= 2 ? `<div class="section-title">${icon('chart', 's')} מגמות</div><div class="card">${Charts.stacked(trend.map((p) => U.HEB_MONTHS[+p.period.slice(5) - 1].slice(0, 3)), [
        { name: 'נטו', color: '#1baf7a', values: trend.map((p) => (p.fields.net ? +p.fields.net.value : 0)) },
        { name: 'ניכויים', color: '#e34948', values: trend.map((p) => (p.fields.gross && p.fields.net ? Math.max(0, p.fields.gross.value - p.fields.net.value) : 0)) },
      ], { label: 'נטו וניכויים לפי חודש', fmt: (v) => U.money(v, 0) })}
        <div class="tiny muted">גובה העמודה = ברוטו. ${trend.length} תלושים אחרונים.</div></div>` : ''}
      <div class="section-title">${icon('receipt', 's')} ארכיון תלושים</div>
      ${slips.length ? `<div class="list">${slips.map((p) => { const c = (p.summary && p.summary.counts) || {}; return `<button class="item" data-act="payslip-open" data-id="${p.id}"><span class="lead" style="background:var(--surface-3)">${icon('receipt')}</span>
        <span class="body"><span class="t">${U.fmtMonth(p.period)}</span><span class="s">${c.bad ? `❌ ${c.bad} ` : ''}${c.warn ? `⚠️ ${c.warn} ` : ''}${c.ok ? `✅ ${c.ok}` : ''}${p.source === 'ai' ? ' · AI' : ''}</span></span>
        <span class="trail"><span class="a">${p.fields.net ? money(p.fields.net.value, 0) : '—'}</span><br><span class="tiny muted">נטו</span></span></button>`; }).join('')}</div>`
        : UI.emptyState('receipt', 'עוד אין תלושים', 'העלה תלוש כדי לבדוק שקיבלת את כל מה שמגיע לך: שעות, שבתות, נסיעות, פנסיה ועוד.')}
      ${DISCLAIMER}`;
  };

  /* ---------------- optional AI (Claude) ---------------- */
  App.aiAnalyze = function (text, onResult) {
    const key = S.settings.ai.apiKey;
    if (!key) {
      UI.confirm('ניתוח חכם דורש מפתח API', 'אפשר להזין מפתח של Claude בהגדרות › מפתח AI. בלי מפתח — הניתוח המקומי ממשיך לעבוד כרגיל.', 'להגדרות').then((ok) => { if (ok) { UI.closeAll(); setTimeout(() => App.sheetsApi.settingsSection('ai'), 400); } });
      return;
    }
    const red = Payslip.redact(text);
    UI.openSheet({
      title: 'לפני שליחה ל-Claude', full: true,
      body: `<div class="banner warn">${icon('shield')}<div>זה <b>בדיוק</b> הטקסט שיישלח (${red.count} פרטים אישיים הוסתרו אוטומטית). בדוק וערוך — אפשר למחוק גם שם או כל פרט אחר. הקובץ עצמו לא נשלח.</div></div>

    async load() {

      if (ops[10]) ops[10].items.push({ id: U.uid(), type: 'bonus', amount: 150, label: 'בונוס אירוע' });
      if (ops[20]) ops[20].items.push({ id: U.uid(), type: 'deduction', amount: 25, label: 'ארוחה' });
      // planned shifts
      ops.push(mk(U.addDays(today, 1), '16:00', '00:00', miznon, { status: 'planned' }));
      ops.push(mk(U.addDays(today, 3), '08:00', '16:00', sadran, { status: 'planned' }));
      const ent = [
        { id: 'demo_' + U.uid(), kind: 'vacation', date: U.addDays(today, -40), status: 'done', employerId: emp.id, demo: true },
        ...[0, 1, 2].map((d) => ({ id: 'demo_' + U.uid(), kind: 'sick', date: U.addDays(today, -70 + d), status: 'done', employerId: emp.id, demo: true })),
        { id: 'demo_' + U.uid(), kind: 'adjustment', type: 'bonus', amount: 300, label: 'מענק חג', date: U.addDays(today, -25), status: 'done', employerId: emp.id, demo: true },
      ];
      const all = [...ops.map((x) => ({ store: 'shifts', put: x })), ...ent.map((x) => ({ store: 'entries', put: x }))];
      all.push({ store: 'templates', put: { id: 'demo_tpl1', name: 'בוקר סדרן', roleId: sadran, employerId: emp.id, startT: '08:00', endT: '16:00', breakMin: 30, breakPaid: false, noTravel: false, splits: [], demo: true } });
      await Store.apply(all, null);
      // demo needs >1 year of seniority to show recuperation & pension checks; the real value is restored on clear
      await Store.setMeta({ demoPrevStart: S.settings.startDate || null });
      await Store.setSettings((s) => { s.demo = true; if (!s.startDate || s.startDate > U.addDays(today, -400)) s.startDate = U.addDays(today, -400); });
      // a sample payslip for last pay period, with one shift "forgotten" by the employer

      const ex = root.Payslip.expected(App.model, P.key, false);

      <div class="btn-row"><button class="btn tonal" data-legal="terms">${icon('file')} תנאי שימוש</button><button class="btn tonal" data-legal="privacy">${icon('shield')} פרטיות</button></div>
      <label class="switch-row" style="margin-top:8px"><span class="body"><span class="t">קראתי ואני מסכים/ה לתנאי השימוש ולמדיניות הפרטיות</span></span><input type="checkbox" class="switch" id="lg-ok"></label>
      </div><div class="foot"><button class="btn" id="lg-go" disabled>${icon('check')} אישור והמשך</button></div></div>`;
    const ok = v.querySelector('#lg-ok'), go = v.querySelector('#lg-go');
    ok.onchange = () => { go.disabled = !ok.checked; };
    go.onclick = async () => { App.blocking = null; await App.acceptLegal(); nav.style.display = ''; next(); };
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* ---- app/ptr.js ---- */
/* ============================================================
 * ptr.js — pull down to refresh. The logo draws itself as you pull;
 * past the threshold it clicks (sound + vibration); on release it
 * spins while the app syncs with the cloud, looks for a new version
 * and recalculates, then shows a check. Replaces the browser's own
 * pull-to-refresh, which would reload the whole app.
 * ============================================================ */
(function (root) {
  'use strict';
  const { App, Fx } = root;
  const THRESHOLD = 72, MAX = 128, DEAD_ZONE = 14;
  const LOGO = '<svg viewBox="0 0 1024 1024" aria-hidden="true"><path class="g" pathLength="1" d="M300 660 A258 258 0 0 1 603 271 L603 600"/><path class="y" pathLength="1" d="M420 422 L420 753 A258 258 0 0 0 720 362"/></svg>';
  const ind = document.createElement('div');
  ind.className = 'ptr';
  ind.setAttribute('aria-hidden', 'true');
  ind.innerHTML = `<div class="ptr-disc">${LOGO}<span class="ptr-check">✓</span></div>`;
  document.body.appendChild(ind);
  const disc = ind.firstChild;

  let startY = null, dist = 0, armed = false, busy = false;
  const inner = () => document.getElementById('view-inner');
  const blocked = (target) => busy || App.blocking || root.scrollY > 0
    || document.querySelector('.sheet, .dialog, #intro, #lock')
    || (target.closest && target.closest('input, textarea, select, .chart, [data-no-ptr]'));

  function paint(d) {
    const p = Math.min(1, d / THRESHOLD);
    ind.style.transform = `translate(-50%, ${Math.round(d - 64)}px)`;
    ind.style.opacity = Math.min(1, d / 36);
    disc.style.transform = `rotate(${Math.round(d * 3)}deg) scale(${0.7 + 0.3 * p})`;
    disc.style.setProperty('--p', p.toFixed(3));
    const v = inner();
    if (v) v.style.transform = d ? `translateY(${Math.round(d * 0.35)}px)` : '';
  }
  function settle(cls) {
    ind.classList.add('settle');
    const v = inner();
    if (v) { v.style.transition = 'transform .35s var(--ease)'; setTimeout(() => { v.style.transition = ''; }, 380); }
    if (cls) ind.classList.add(cls);
    paint(0);
    setTimeout(() => { ind.classList.remove('settle', 'armed', 'spin', 'done'); }, 420);
  }

  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || blocked(e.target) || !(e.target.closest && e.target.closest('#view'))) { startY = null; return; }
    startY = e.touches[0].clientY;
    dist = 0; armed = false;
    ind.classList.remove('settle');
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (startY == null) return;
    const dy = e.touches[0].clientY - startY - DEAD_ZONE; // a tap with a tiny finger movement never moves the page
    if (dy <= 0 || root.scrollY > 0) { if (dist) paint(0); dist = 0; return; }
    dist = Math.min(MAX, dy * 0.5);
    paint(dist);
    if (dist >= THRESHOLD && !armed) { armed = true; ind.classList.add('armed'); Fx.haptic(12); Fx.play('tick'); }
    else if (dist < THRESHOLD && armed) { armed = false; ind.classList.remove('armed'); }
  }, { passive: true });

  async function end() {
    if (startY == null) return;
    startY = null;
    if (!armed) { if (dist) settle(); dist = 0; return; }
    busy = true;
    ind.classList.add('settle', 'spin');
    paint(THRESHOLD * 0.9);
    const t0 = Date.now();
    try { await App.refresh(); } catch (e) { console.warn('refresh', e); }
    const left = 700 - (Date.now() - t0);
    if (left > 0) await Fx.sleep(left);
    ind.classList.remove('spin');
    ind.classList.add('done');
    Fx.play('pop'); Fx.haptic(10);
    await Fx.sleep(450);
    settle();
    busy = false;
  }
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', () => { if (startY != null) { startY = null; settle(); } }, { passive: true });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
