.ct-t { font-weight: 700; font-size: 1rem; line-height: 1.45; }
.ct-n { font-size: .75rem; color: var(--on-surface-var); margin-top: 4px; }

/* words explained */
.term { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: help; text-decoration: underline dotted 1.5px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 45%, transparent); }
.term-box { display: flex; gap: 12px; align-items: flex-start; text-align: start; }
.term-box h3 { margin: 4px 0 6px; }
.term-box p { margin: 0; line-height: 1.6; color: var(--on-surface-var); }

/* the + menu */
.add-sheet .sh-body { padding-bottom: calc(16px + var(--safe-b)); }
.am-main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.am-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.am-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 18px; padding: 14px 6px; min-height: 92px; background: var(--surface-1); color: var(--on-surface); font: 600 .86rem/1.25 var(--font); cursor: pointer; box-shadow: var(--sh-1); border: 1px solid var(--line); transition: transform .2s var(--pop); text-align: center; }
.am-tile.big { min-height: 112px; font-size: 1rem; font-weight: 700; }
.am-s { display: block; margin-top: -5px; font: 500 .74rem var(--font); opacity: .78; }
.am-tile.big .itile { width: 48px; height: 48px; border-radius: 14px; }
.am-tile.big .itile svg { width: 26px; height: 26px; }
.am-tile.g1 { background: var(--grad-brand); color: #fff; border: 0; box-shadow: var(--sh-brand); }

/* ---------------- mascot ---------------- */
.mascot { display: inline-block; width: var(--sz, 96px); height: calc(var(--sz, 96px) * 1.03); flex: none; vertical-align: middle; }
.mascot svg { width: 100%; height: 100%; overflow: visible; display: block; }
.mascot .m-coin { fill: #ffc53d; stroke: #e8990c; stroke-width: 4; }
.mascot .m-rim { fill: none; stroke: #ffe08a; stroke-width: 2.5; stroke-dasharray: 3 5; }
.mascot .m-shine { fill: #fff; opacity: .5; }
.mascot .m-eye { fill: #2a1b0f; }
.mascot .m-line { fill: none; stroke: #2a1b0f; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
.mascot .m-cheek { fill: #ff8fab; opacity: .5; }
.mascot .m-arm { fill: none; stroke: #e8990c; stroke-width: 7; stroke-linecap: round; }
.mascot .m-shadow { fill: rgba(30, 20, 70, .14); }
.mascot .m-z { font: 800 15px var(--font); fill: var(--brand); }
.mascot .m-body, .mascot .m-shadow, .mascot .m-eyes, .mascot .m-arm, .mascot .m-sprout { transform-box: view-box; }
/* the mascot only floats where it is the star (welcome, done, sign-in); elsewhere it just blinks */
.mascot .m-body { transform-origin: 60px 110px; }
.mascot.hero .m-body, .login-mascot .mascot .m-body { animation: m-bob 3.2s ease-in-out infinite; }
.mascot .m-shadow { transform-origin: 60px 116px; }
.mascot.hero .m-shadow, .login-mascot .mascot .m-shadow { animation: m-shadow 3.2s ease-in-out infinite; }
.mascot .m-eyes { transform-origin: 60px 60px; animation: m-blink 5s infinite; }
.mascot .m-sprout { transform-origin: 60px 24px; animation: m-sprout 3.6s ease-in-out infinite; }
.mascot.m-wave .m-arm-r, .mascot.m-party .m-arm-r { transform-origin: 96px 70px; animation: m-wave .7s ease-in-out 4 alternate; }
.mascot.m-party .m-arm-l { transform-origin: 24px 70px; animation: m-wave-l .7s ease-in-out 4 alternate; }

/* ---------------- motion that feels alive (and costs the phone nothing: transform/opacity only) ---------------- */
/* the pay card: soft light drifting behind the amount, and a highlight sweeping round the dial like a second hand */
.aurora { position: absolute; inset: 0; z-index: -2; overflow: hidden; border-radius: inherit; pointer-events: none; }
.aurora i { position: absolute; width: 75%; aspect-ratio: 1; border-radius: 50%; will-change: transform; }
.aurora i:nth-child(1) { top: -35%; right: -20%; background: radial-gradient(circle, hsla(calc(var(--h) + 48), 95%, 70%, .55), transparent 64%); animation: aurora-a 17s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { bottom: -45%; left: -15%; background: radial-gradient(circle, hsla(calc(var(--h) - 42), 95%, 66%, .5), transparent 64%); animation: aurora-b 21s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { top: 20%; left: 30%; width: 55%; background: radial-gradient(circle, hsla(168, 90%, 62%, .22), transparent 64%); animation: aurora-c 25s ease-in-out infinite alternate; }
@keyframes aurora-a { to { transform: translate(-38%, 30%) scale(1.15); } }
@keyframes aurora-b { to { transform: translate(42%, -26%) scale(1.2); } }
@keyframes aurora-c { 0% { transform: translate(0, 0) scale(.9); } 50% { transform: translate(-30%, 18%) scale(1.15); } 100% { transform: translate(25%, -12%) scale(1); } }
.hh-dial::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 290deg, rgba(255, 255, 255, .15) 320deg, rgba(255, 255, 255, .95) 359deg, transparent 360deg); animation: dial-sweep 7s linear infinite; }
@keyframes dial-sweep { to { transform: rotate(360deg); } }
.timer-card.running { position: relative; overflow: hidden; isolation: isolate; }
.timer-card.running .aurora i:nth-child(3) { display: none; }
/* the main action: now and then a glint of light runs across it (right to left, like the reading direction) */
.home-action .btn.start { position: relative; overflow: hidden; isolation: isolate; }
.home-action .btn.start::after { content: ''; position: absolute; z-index: -1; top: -20%; bottom: -20%; width: 34%; right: 0; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .26), transparent); transform: translateX(130%) skewX(-18deg); animation: glint 5.5s cubic-bezier(.4, 0, .2, 1) 1.6s infinite; pointer-events: none; }
@keyframes glint { 0% { transform: translateX(130%) skewX(-18deg); } 28%, 100% { transform: translateX(-420%) skewX(-18deg); } }
/* the first look at the home screen: one short, orchestrated entrance */
.view.first .home-top, .view.first .home-hero, .view.first .home-action, .view.first .timer-card, .view.first .card.guide, .view.first .highlight, .view.first .shortcuts, .view.first .home-list-head, .view.first .home-list, .view.first .empty.fun { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; }
.view.first .home-hero { animation-delay: .04s; }
.view.first .home-action, .view.first .timer-card { animation-delay: .1s; }
.view.first .card.guide, .view.first .highlight { animation-delay: .16s; }
.view.first .shortcuts { animation-delay: .22s; }
.view.first .home-list-head, .view.first .home-list, .view.first .empty.fun { animation-delay: .28s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.985); } }
.view.first .hero-num { animation: num-in .7s cubic-bezier(.2, .8, .2, 1) .12s both; }
@keyframes num-in { from { opacity: 0; transform: scale(.92); filter: blur(4px); } }
/* the setup questions: the background shapes drift slowly */
.ob-bg i { will-change: transform; animation: ob-blob 24s ease-in-out infinite alternate; }
.ob-bg i:nth-child(2) { animation-duration: 29s; animation-delay: -9s; }
@keyframes ob-blob { to { transform: translate(28px, 40px) scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .aurora i, .hh-dial::before, .home-action .btn.start::after, .view.first *, .ob-bg i { animation: none !important; } }
body:not(.fx) .aurora i, body:not(.fx) .hh-dial::before, body:not(.fx) .home-action .btn.start::after, body:not(.fx) .ob-bg i { animation: none !important; }

/* saved: a check mark that draws itself */
.toast .tk { width: 22px; height: 22px; flex: none; }
.toast .tk circle { fill: #22c98e; transform-origin: center; transform-box: fill-box; animation: tk-pop .35s var(--pop) both; }
.toast .tk path { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; animation: tk-draw .35s ease-out .18s forwards; }
@keyframes tk-pop { from { transform: scale(.3); } }
@keyframes tk-draw { to { stroke-dashoffset: 0; } }
/* loading: shimmering placeholders instead of "loading…" text */

@keyframes skel { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (prefers-reduced-motion: reduce) { .skel, .toast .tk * { animation: none !important; } .toast .tk path { stroke-dashoffset: 0; } }

/* keyboard users always see where they are */
:where(button, a, input, select, textarea, summary, [tabindex]):focus-visible { outline: 3px solid hsla(var(--h), 85%, 60%, .55); outline-offset: 2px; }

/* ---------------- behaviour ---------------- */
/* messages at the bottom never block taps: an invisible (or visible) message used to sit on top of the buttons
   under it (the + menu's last tile, a screen's Next button). Only its own action button takes taps. */

    if (!emp.seniorityEnabled || !settings.startDate) return 0;
    const months = monthsBetween(settings.startDate, k);
    if (months < (+emp.seniorityAfterMonths || 0)) return 0;
    if (emp.seniorityType === 'fixedPerHour') return +emp.seniorityValue || 0;
    // one step per completed year; once eligible, at least one step
    let pct = (+emp.seniorityValue || 0) * Math.max(1, Math.floor(months / 12));
    if (+emp.seniorityCapPct > 0) pct = Math.min(pct, +emp.seniorityCapPct);
    return (rate * pct) / 100;
  }

  /** Daily [from,to] intervals (epochs) of a 'HH:MM'-'HH:MM' window around [a,b]. */
  function dailyWindows(a, b, from, to) {
    const out = [];
    const k0 = U.addDays(U.epochKey(a), -1), k1 = U.epochKey(b);
    for (let k = k0; k <= k1; k = U.addDays(k, 1)) {
      const s = U.toEpoch(k, from);
      const e = to > from ? U.toEpoch(k, to) : U.toEpoch(U.addDays(k, 1), to);
      if (e > a && s < b) out.push([s, e]);
    }
    return out;
  }
  const inAny = (t, ivs) => ivs.some(([s, e]) => t >= s && t < e);
  function overlapMin(a, b, ivs) {
    let m = 0;
    for (const [s, e] of ivs) m += Math.max(0, Math.min(b, e) - Math.max(a, s));
    return m / MIN;
  }

  /** Role segments of a shift: primary role, then role switches at given times. */
  function buildSegments(shift, start, end) {
    const splits = (shift.splits || []).filter((s) => s.at > start && s.at < end && s.roleId).sort((a, b) => a.at - b.at);
    const segs = [];
    let cur = start, role = shift.roleId;
    for (const s of splits) {
      if (s.at > cur) segs.push({ roleId: role, start: cur, end: s.at });
      cur = s.at;
      role = s.roleId;
    }
    if (end > cur) segs.push({ roleId: role, start: cur, end });
    return segs;
  }

  function hasOverrides(shift) {
    const o = shift.overrides;
    if (!o) return false;
    return !!(o.rate || o.rest || o.ot || o.night || o.travel);
  }

  /**
   * Compute pay for one shift.
   * opts.priorMin  — paid minutes already worked earlier the same workday (daily OT)
   * opts.ignoreOverrides — compute as if no manual overrides / day rules existed
   */
  function computeShift(shift, ctx, opts) {
    opts = opts || {};
    const emp = ctx.employer(shift.employerId);
    const settings = ctx.settings;
    const ov = opts.ignoreOverrides ? {} : shift.overrides || {};
    const warnings = [];
    const start = shift.start;
    const rawEnd = shift.end;
    const dk = U.epochKey(start);

    const elapsedMin = (rawEnd - start) / MIN;
    if (!(elapsedMin > 0)) {
      return emptyResult(shift, dk, ['שעת הסיום לפני שעת ההתחלה או שווה לה']);
    }
    const roundedMin = Math.max(0, roundMinutes(elapsedMin, emp.roundingMode, emp.roundingUnit));
    const end = start + roundedMin * MIN;
    const segs = buildSegments(shift, start, end);

    /* ---- windows ---- */
    const ignoreRules = !!opts.ignoreOverrides;
    const wins = HebCal.restWindows(U.addDays(dk, -1), U.addDays(U.epochKey(end), 1), ctx.restCfg, ignoreRules)
      .filter((w) => w.end > start && w.start < end);
    const evesAll = HebCal.restWindows(U.addDays(dk, -1), U.addDays(U.epochKey(end), 2), ctx.restCfg, ignoreRules)
      .filter((w) => w.eveStart && w.start > start && w.eveStart < end)
      .map((w) => [w.eveStart, w.start]);
    const nightOvEarly = ov.night || null;
    const nightIvs = emp.nightEnabled || (nightOvEarly && nightOvEarly.mode === 'pct')
      ? dailyWindows(start, end, emp.nightFrom || '22:00', emp.nightTo || '06:00') : [];
    const lawNight = dailyWindows(start, end, '22:00', '06:00');
    // Did a manual day rule (bulk cancel / force) change the rest windows of this shift?
    let dayRuleHit = false;
    if (!ignoreRules && (ctx.dayRules || []).length) {
      const raw = HebCal.restWindows(U.addDays(dk, -1), U.addDays(U.epochKey(end), 1), ctx.restCfg, true)
        .filter((w) => w.end > start && w.start < end).map((w) => w.start + '-' + w.end).join();
      dayRuleHit = raw !== wins.map((w) => w.start + '-' + w.end).join();
    }

    const restOv = ov.rest || null;
    let restRange = null;
    if (restOv && restOv.scope === 'range' && restOv.from && restOv.to) {
      restRange = [restOv.from, restOv.to > restOv.from ? restOv.to : restOv.to + U.DAY];
    }

    /* ---- slicing ---- */
    const bset = new Set([start, end]);
    const addB = (t) => { if (t > start && t < end) bset.add(t); };
    segs.forEach((s) => { addB(s.start); addB(s.end); });
    wins.forEach((w) => { addB(w.start); addB(w.end); });
    evesAll.forEach(([s, e]) => { addB(s); addB(e); });
    nightIvs.forEach(([s, e]) => { addB(s); addB(e); });
    if (restRange) { addB(restRange[0]); addB(restRange[1]); }
    const bounds = [...bset].sort((a, b) => a - b);

    const autoRestIvs = wins.map((w) => [w.start, w.end]);
    const slices = [];
    for (let i = 0; i < bounds.length - 1; i++) {
      const a = bounds[i], b = bounds[i + 1];
      const mid = (a + b) / 2;
      const seg = segs.find((s) => mid >= s.start && mid < s.end) || segs[segs.length - 1];
      let rest;
      const autoRest = inAny(mid, autoRestIvs);
      if (!restOv || !restOv.scope || restOv.scope === 'auto') rest = autoRest;
      else if (restOv.scope === 'off') rest = false;
      else if (restOv.scope === 'all') rest = true;
      else if (restOv.scope === 'range') rest = restRange ? mid >= restRange[0] && mid < restRange[1] : autoRest;
      else rest = autoRest;
      let night = inAny(mid, nightIvs);
      if (ov.night && ov.night.mode === 'off') night = false;
      if (ov.night && ov.night.mode === 'all') night = true;
      const eve = !rest && inAny(mid, evesAll);
      const win = wins.find((w) => mid >= w.start && mid < w.end);
      slices.push({ a, b, min: (b - a) / MIN, roleId: seg ? seg.roleId : shift.roleId, rest, autoRest, night, eve, winLabel: win ? win.label : null });
    }

    /* ---- breaks ---- */
    const breakMin = Math.max(0, +shift.breakMin || 0);
    const breakPaid = shift.breakPaid !== false;
    if (!breakPaid && breakMin >= roundedMin && roundedMin > 0) warnings.push('ההפסקה ארוכה מהמשמרת');
    const paidFactor = breakPaid || roundedMin === 0 ? 1 : Math.max(0, 1 - breakMin / roundedMin);
    const paidMin = roundedMin * paidFactor;

    /* ---- overtime tiers ---- */
    const lawNightMin = overlapMin(start, end, lawNight);
    const lawNightPaidH = (lawNightMin * paidFactor) / 60; // hours between 22:00-06:00, for reports
    const isNightShift = lawNightMin >= 120;
    let thresholdH = +emp.otThreshold || 8;
    if (emp.nightShiftShortDay && isNightShift) thresholdH = +emp.nightShiftThreshold || 7;
    const otOv = ov.ot || null;
    if (otOv && otOv.mode === 'threshold' && +otOv.hours > 0) thresholdH = +otOv.hours;
    const otOff = otOv && otOv.mode === 'off';
    const t1 = thresholdH * 60;
    const t2 = t1 + (+emp.otTier1Hours || 2) * 60;
    let cum = emp.otMode === 'daily' ? Math.max(0, +opts.priorMin || 0) : 0;

    const pieces = [];
    for (const s of slices) {
      let pm = s.min * paidFactor;
      if (pm <= 0) continue;
      if (otOff) { pieces.push(Object.assign({}, s, { tier: 0, pm })); cum += pm; continue; }
      const edges = [[0, t1], [1, t2], [2, Infinity]];
      let lo = 0;
      for (const [tier, hi] of edges) {
        const from = Math.max(cum, lo), to = Math.min(cum + pm, hi);
        if (to > from) pieces.push(Object.assign({}, s, { tier, pm: to - from }));
        lo = hi;
      }
      cum += pm;
    }

    /* ---- multipliers ---- */
    const restPct = restOv && +restOv.pct > 0 ? +restOv.pct : +emp.restPct || 150;
    const otPct = otOv && otOv.mode === 'pct' && +otOv.pct > 0 ? [100, +otOv.pct, +otOv.pct] : [100, +emp.otTier1Pct || 125, +emp.otTier2Pct || 150];
    const baseRestOt = [+emp.restPct || 150, +emp.restOt1Pct || 175, +emp.restOt2Pct || 200];
    const restPctArr = otOv && otOv.mode === 'pct' && +otOv.pct > 0
      ? [restPct, restPct + (+otOv.pct - 100), restPct + (+otOv.pct - 100)]
      : [restPct, baseRestOt[1] - baseRestOt[0] + restPct, baseRestOt[2] - baseRestOt[0] + restPct];
    const pctOf = (p) => (p.rest ? restPctArr[p.tier] : otPct[p.tier]);
    const regPctOf = (p) => otPct[p.tier]; // what this hour would pay if it weren't a rest hour
    const tier0Of = (p) => (p.rest ? restPctArr[0] : 100);

    const rateOf = (roleId) => {
      if (ov.rate && +ov.rate.rate > 0) return +ov.rate.rate;
      return roleRate(ctx.roles.get(roleId), dk);
    };

    /* ---- wage lines ---- */
    const groups = new Map();
    let base = 0, restPremium = 0, otPremium = 0, nightPremium = 0, evePremium = 0, seniority = 0;
    const hoursBy = { regular: 0, ot1: 0, ot2: 0, rest: 0, restOt1: 0, restOt2: 0, night: 0, eve: 0 };
    const byRole = {};
    for (const p of pieces) {
      const h = p.pm / 60;
      const rate = rateOf(p.roleId);
      const pct = pctOf(p);
      const key = p.roleId + '|' + (p.rest ? 'R' : 'N') + '|' + p.tier + '|' + pct + '|' + rate;
      if (!groups.has(key)) groups.set(key, { roleId: p.roleId, rest: p.rest, tier: p.tier, pct, rate, hours: 0, winLabel: p.winLabel });
      groups.get(key).hours += h;
      base += h * rate;
      if (p.rest) restPremium += h * rate * (pct - regPctOf(p)) / 100;
      otPremium += h * rate * (regPctOf(p) - 100) / 100;
      const sd = seniorityDelta(emp, settings, dk, rate);
      seniority += h * sd * pct / 100;
      if (p.night) hoursBy.night += h;
      if (p.eve) { hoursBy.eve += h; evePremium += h * rate * (+emp.evePct || 0) / 100; }
      const bucket = p.rest ? ['rest', 'restOt1', 'restOt2'][p.tier] : ['regular', 'ot1', 'ot2'][p.tier];
      hoursBy[bucket] += h;
      byRole[p.roleId] = byRole[p.roleId] || { hours: 0, amount: 0 };
      byRole[p.roleId].hours += h;
      byRole[p.roleId].amount += h * rate * pct / 100;
    }
    // night premium
    const nightOv = ov.night || null;
    const nightOn = emp.nightEnabled || (nightOv && (nightOv.mode === 'all' || nightOv.mode === 'pct'));
    if (nightOn) {
      if (nightOv && nightOv.mode === 'all') {
        hoursBy.night = paidMin / 60;
      }
      const npct = nightOv && nightOv.mode === 'pct' && +nightOv.pct >= 0 ? +nightOv.pct : +emp.nightValue || 0;
      for (const p of pieces) {
        const isN = nightOv && nightOv.mode === 'all' ? true : p.night;
        if (!isN) continue;
        const h = p.pm / 60;
        if (emp.nightType === 'fixed' && !(nightOv && nightOv.mode === 'pct')) nightPremium += h * npct;
        else nightPremium += h * rateOf(p.roleId) * npct / 100;
      }
    }

    const lines = [];
    const order = [...groups.values()].sort((a, b) => (a.rest - b.rest) || (a.tier - b.tier));
    for (const g of order) {
      const role = ctx.roles.get(g.roleId);
      const cat = g.rest ? (g.winLabel || 'שבת/חג') : g.tier === 0 ? 'שעות רגילות' : 'שעות נוספות';
      const otNote = g.rest && g.tier > 0 ? ' + שעות נוספות' : '';
      lines.push({
        roleId: g.roleId, roleName: role ? role.name : 'תפקיד', color: role ? role.color : '#888',
        label: cat + otNote, rest: g.rest, tier: g.tier, hours: g.hours, rate: g.rate, pct: g.pct,
        amount: g.hours * g.rate * g.pct / 100,
      });
    }

    /* ---- extras ---- */
    const extras = [];
    if (nightPremium > 0) extras.push({ kind: 'night', label: 'תוספת לילה', detail: U.hours(hoursBy.night) + ' ש׳', amount: nightPremium });
    if (evePremium > 0) extras.push({ kind: 'eve', label: 'תוספת ערב שבת/חג', detail: U.hours(hoursBy.eve) + ' ש׳ × ' + emp.evePct + '%', amount: evePremium });
    if (seniority > 0) extras.push({ kind: 'seniority', label: 'תוספת ותק', detail: '', amount: seniority });

    // minimum paid hours per shift
    let minTopUp = 0;
    const minH = +emp.minShiftHours || 0;
    if (minH > 0 && paidMin < minH * 60 && pieces.length) {
      const last = pieces[pieces.length - 1];
      const topH = (minH * 60 - paidMin) / 60;
      const r = rateOf(last.roleId);
      minTopUp = topH * r * tier0Of(last) / 100;
      extras.push({ kind: 'min', label: 'השלמה למינימום ' + minH + ' ש׳', detail: U.hours(topH) + ' ש׳ × ' + U.money(r) + ' × ' + tier0Of(last) + '%', amount: minTopUp });
    }

    // manual amount overrides (replace the automatic premium with the typed amount)
    let adjust = 0;
    const overrideList = [];
    if (restOv) {
      if (restOv.scope && restOv.scope !== 'auto') overrideList.push(restOv.scope === 'off' ? 'ביטול שבת/חג' : restOv.scope === 'all' ? 'שבת/חג לכל המשמרת' : 'טווח שבת/חג ידני');
      if (+restOv.pct > 0 && +restOv.pct !== (+emp.restPct || 150)) overrideList.push('אחוז שבת/חג ' + restOv.pct + '%');
      if (restOv.amount != null && restOv.amount !== '') {
        const d = +restOv.amount - restPremium;
        adjust += d;
        extras.push({ kind: 'adjust', label: 'תוספת שבת/חג — סכום ידני', detail: 'במקום ' + U.money(restPremium), amount: d });
        overrideList.push('סכום שבת/חג ידני');
      }
    }
    if (otOv) {
      overrideList.push(otOv.mode === 'off' ? 'ביטול שעות נוספות' : otOv.mode === 'threshold' ? 'סף שעות נוספות ' + otOv.hours : otOv.mode === 'pct' ? 'אחוז שעות נוספות ' + otOv.pct + '%' : 'סכום שעות נוספות ידני');
      if (otOv.mode === 'amount') {
        const d = (+otOv.amount || 0) - otPremium;
        adjust += d;
        extras.push({ kind: 'adjust', label: 'שעות נוספות — סכום ידני', detail: 'במקום ' + U.money(otPremium), amount: d });
      }
    }
    if (nightOv) {
      overrideList.push(nightOv.mode === 'off' ? 'ביטול תוספת לילה' : nightOv.mode === 'all' ? 'לילה לכל המשמרת' : nightOv.mode === 'pct' ? 'אחוז לילה ' + nightOv.pct + '%' : 'סכום לילה ידני');
      if (nightOv.mode === 'amount') {
        const d = (+nightOv.amount || 0) - nightPremium;
        adjust += d;
        extras.push({ kind: 'adjust', label: 'תוספת לילה — סכום ידני', detail: 'במקום ' + U.money(nightPremium), amount: d });
      }
    }
    if (ov.rate && +ov.rate.rate > 0) overrideList.push('תעריף ידני ' + U.money(+ov.rate.rate));

    /* ---- travel ---- */
    let travel = { mode: 'auto', amount: +emp.travelPerDay || 0 };
    if (shift.noTravel) travel = { mode: 'none', amount: 0 };
    if (ov.travel) {
      if (ov.travel.mode === 'off') { travel = { mode: 'none', amount: 0 }; overrideList.push('ביטול נסיעות'); }
      else if (ov.travel.mode === 'amount') { travel = { mode: 'manual', amount: +ov.travel.amount || 0 }; overrideList.push('נסיעות ידני'); }
    }

    /* ---- items ---- */
    let bonus = 0, tips = 0, additions = 0, deductions = 0;
    for (const it of shift.items || []) {
      const a = +it.amount || 0;
      if (it.type === 'bonus') bonus += a;
      else if (it.type === 'tips') tips += a;
      else if (it.type === 'addition') additions += a;
      else if (it.type === 'deduction') deductions += a;
    }

    const wage = base + restPremium + otPremium + nightPremium + evePremium + seniority + minTopUp + adjust;
    const restLabels = [...new Set(slices.filter((s) => s.rest && s.winLabel).map((s) => s.winLabel))];
    const autoRestRange = wins.length ? { from: Math.max(start, wins[0].start), to: Math.min(end, wins[wins.length - 1].end) } : null;
    const autoRestMin = slices.filter((s) => s.autoRest).reduce((m, s) => m + s.min, 0);

    if (roundedMin > (+settings.alerts.suspiciousHours || 20) * 60) warnings.push('משמרת ארוכה במיוחד (' + U.hm(roundedMin) + ')');

    return {
      id: shift.id, kind: 'shift', dateKey: dk, employerId: shift.employerId, status: shift.status || 'done',
      start, end, rawEnd, elapsedMin, roundedMin, roundingDeltaMin: roundedMin - Math.round(elapsedMin),
      breakMin, breakPaid, paidMin, paidHours: paidMin / 60,
      segments: segs, slices, pieces, lines, extras,
      base, restPremium, otPremium, nightPremium, evePremium, seniority, minTopUp, adjust,
      wage, hoursBy, byRole,
      restHours: hoursBy.rest + hoursBy.restOt1 + hoursBy.restOt2,
      otHours: hoursBy.ot1 + hoursBy.ot2 + hoursBy.restOt1 + hoursBy.restOt2,
      nightHours: hoursBy.night, lawNightHours: lawNightPaidH, isNightShift,
      travel, bonus, tips, additions, deductions,
      total: wage + travel.amount + bonus + additions,
      restLabels, autoRestRange, autoRestMin,
      thresholdH, priorMin: +opts.priorMin || 0,
      overridden: !opts.ignoreOverrides && hasOverrides(shift), overrideList,
      dayRuleHit,
      warnings,
    };
  }

  function emptyResult(shift, dk, warnings) {
    return {
      id: shift.id, kind: 'shift', dateKey: dk, employerId: shift.employerId, status: shift.status || 'done',
      start: shift.start, end: shift.end, rawEnd: shift.end, elapsedMin: 0, roundedMin: 0, roundingDeltaMin: 0, breakMin: 0, breakPaid: true,
      paidMin: 0, paidHours: 0, segments: [], slices: [], pieces: [], lines: [], extras: [],
      base: 0, restPremium: 0, otPremium: 0, nightPremium: 0, evePremium: 0, seniority: 0, minTopUp: 0, adjust: 0, wage: 0,
      hoursBy: { regular: 0, ot1: 0, ot2: 0, rest: 0, restOt1: 0, restOt2: 0, night: 0, eve: 0 }, byRole: {},
      restHours: 0, otHours: 0, nightHours: 0, lawNightHours: 0, isNightShift: false, travel: { mode: 'none', amount: 0 },
      bonus: 0, tips: 0, additions: 0, deductions: 0, total: 0, restLabels: [], autoRestRange: null, autoRestMin: 0,
      thresholdH: 8, priorMin: 0, overridden: false, overrideList: [], dayRuleHit: false, warnings,
    };
  }

  /**
   * Compute every shift. Shifts of the same employer that start on the
   * same date share the daily overtime counter, in chronological order.
   * Returns Map(id -> result).
   */
  /** A shift the engine can work with: real times, ending after it starts, at most a week long
   *  (a timer someone forgot to stop is still counted; a garbage end date can't make it loop for years). */
  const validShift = (s) => !!s && typeof s === 'object' && typeof s.id === 'string'
    && Number.isFinite(s.start) && Number.isFinite(s.end) && s.end > s.start && s.end - s.start <= 7 * 24 * 3600000;
  const validEntry = (e) => !!e && typeof e === 'object' && typeof e.id === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date || '');
  function computeAll(shifts, ctx, opts) {
    opts = opts || {};
    const out = new Map();
    const groups = new Map();
    for (const s of shifts) {
      if (!s || (s.kind && s.kind !== 'shift')) continue;
      if (!validShift(s)) continue; // a damaged record (an old backup, a bad sync) is skipped, never fatal
      const key = (s.employerId || '') + '|' + U.epochKey(s.start) + '|' + (s.status === 'planned' ? 'p' : 'd');
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    }
    for (const list of groups.values()) {
      list.sort((a, b) => a.start - b.start);
      let prior = 0;
      for (const s of list) {
        let r;
        try { r = computeShift(s, ctx, { priorMin: prior, ignoreOverrides: opts.ignoreOverrides }); } catch (e) {
          if (typeof console !== 'undefined') console.warn('shift skipped, it could not be calculated', s.id, e && e.message);
          continue;
        }
        out.set(s.id, r);
        prior += r.paidMin;
      }
    }
    return out;
  }

  /* ---------------- pay periods ---------------- */
  /** Pay period identified by the month in which it ends. */
  function periodByKey(pk, emp) {
    const S = +(emp && emp.periodStartDay) || 1;
    const payDay = +(emp && emp.payDay) || 9;
    let from, to;
    if (S <= 1) { from = U.monthStart(pk); to = U.monthEnd(pk); }
    else {
      const prev = U.addMonthKey(pk, -1);
      const lastPrev = +U.monthEnd(prev).slice(8);
      from = prev + '-' + U.pad(Math.min(S, lastPrev));
      const lastCur = +U.monthEnd(pk).slice(8);
      to = U.addDays(pk + '-' + U.pad(Math.min(S, lastCur)), -1);
    }
    const nm = U.addMonthKey(pk, 1);
    const payDate = nm + '-' + U.pad(Math.min(payDay, +U.monthEnd(nm).slice(8)));
    return { key: pk, from, to, payDate, label: U.fmtMonth(pk) };
  }
  function periodOf(k, emp) {
    const S = +(emp && emp.periodStartDay) || 1;
    const mk = U.monthKey(k);
    if (S <= 1) return periodByKey(mk, emp);
    const d = +k.slice(8);
    return periodByKey(d >= S ? U.addMonthKey(mk, 1) : mk, emp);
  }

  /* ---------------- leave day values ---------------- */
  function primaryRate(ctx, k) {
    const r = [...ctx.roles.values()].filter((x) => !x.archived)[0];
    return r ? roleRate(r, k) : 0;
  }
  /** Value of one paid leave day before `k`. */
  function dayValue(k, ctx, results) {
    const L = ctx.settings.leave;
    if (L.dayValueMode === 'fixed' && +L.dayFixed > 0) return { value: +L.dayFixed, basis: 'סכום קבוע שהוגדר' };
    if (L.dayValueMode === 'hours') {
      const v = (+L.dayHours || 8) * primaryRate(ctx, k);
      return { value: v, basis: L.dayHours + ' ש׳ × התעריף של התפקיד הראשי' };
    }

    rest: { cat: 'deviation', label: 'שעות שבת וחג' },
    overtime: { cat: 'deviation', label: 'שעות נוספות' },
    hourly: { cat: 'deviation', label: 'ירידה בשכר לשעה' },
    shiftLength: { cat: 'deviation', label: 'אורך משמרת חריג' },
    pattern: { cat: 'deviation', label: 'שינוי בדפוס שעות' },
    long: { cat: 'health', label: 'משמרת ארוכה' },
    rest8: { cat: 'health', label: 'מעט מנוחה בין משמרות' },
    streak: { cat: 'health', label: 'הרבה ימים ברצף' },
    weekHours: { cat: 'health', label: 'שבוע עמוס' },
    projection: { cat: 'money', label: 'צפי חודשי' },
    goal: { cat: 'money', label: 'יעד חודשי' },
    record: { cat: 'money', label: 'שיא אישי' },
    goalShifts: { cat: 'money', label: 'משמרות ליעד' },
    payslipGap: { cat: 'money', label: 'פער בתלוש' },
    travel: { cat: 'money', label: 'נסיעות' },
    timer: { cat: 'reminder', label: 'טיימר פעיל' },
    plannedPast: { cat: 'reminder', label: 'משמרת מתוכננת שעברה' },
    idle: { cat: 'reminder', label: 'לא נרשמו משמרות' },
    suspicious: { cat: 'reminder', label: 'נתון חשוד' },
    payslipDue: { cat: 'reminder', label: 'הזנת תלוש' },
    backup: { cat: 'reminder', label: 'גיבוי' },
    upcoming: { cat: 'reminder', label: 'משמרת קרובה' },
    weekly: { cat: 'summary', label: 'סיכום שבועי' },
    recuperation: { cat: 'money', label: 'דמי הבראה' },
    birthday: { cat: 'reminder', label: 'יום הולדת' },
    minwage: { cat: 'money', label: 'שכר מינימום' },
    youth: { cat: 'health', label: 'חוק עבודת הנוער' },
  };

  const pctDev = (cur, base) => (base > 0 ? ((cur - base) / base) * 100 : cur > 0 ? Infinity : 0);
  const fmtPct = (d) => (d === Infinity ? 'לא היה בתקופות הקודמות' : (d > 0 ? '+' : '') + Math.round(d) + '%');
  const avg = (arr) => (arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : 0);

  /** Metrics of a date range used for comparisons. */
  function metrics(model, from, to) {
    const t = Engine.totals(model, from, to);
    let nightH = 0;
    for (const r of model.results.values()) {
      if (r.status !== 'done' || r.dateKey < from || r.dateKey > to) continue;
      // hours inside 22:00-06:00 regardless of the night-premium setting
      for (const p of r.pieces) {
        const mid = new Date((p.a + p.b) / 2).getHours();
        if (mid >= 22 || mid < 6) nightH += p.pm / 60;
      }
    }
    return {
      from, to, t,
      hours: t.hours, shifts: t.shifts, rest: t.restHours, overtime: t.otHours,
      hourly: t.avgHourly, shiftLength: t.avgShift, nightShare: t.hours > 0 ? (nightH / t.hours) * 100 : 0,
      gross: t.gross, roles: Object.fromEntries(Object.entries(t.byRole).map(([k, v]) => [k, v.hours])),
    };
  }

  function firstShiftKey(model) {
    let first = null;
    for (const r of model.results.values()) if (r.status === 'done' && (!first || r.dateKey < first)) first = r.dateKey;
    return first;
  }

  /** Compare one period to the average of N previous periods. */
  function compareSeries(model, cur, prevs, cfg, unit, keyPrefix, roleName) {
    const out = [];
    const th = +cfg.deviationPct || 20;
    const types = cfg.types || {};
    const curM = metrics(model, cur.from, cur.to);
    const prevM = prevs.map((p) => metrics(model, p.from, p.to));
    const worked = prevM.filter((m) => m.shifts > 0);
    const baseRange = '⁦' + U.fmtDate(prevs[prevs.length - 1].from, 'short') + '–' + U.fmtDate(prevs[0].to, 'short') + '⁩';
    const label = unit === 'week' ? 'השבוע שהסתיים' : 'בחודש שהסתיים';
    const per = unit === 'week' ? 'לשבוע' : 'לחודש';
    const nPrev = prevs.length + (unit === 'week' ? ' השבועות' : ' החודשים');
    const sfx = unit === 'week' ? ' (שבועי)' : ' (חודשי)';
    const explain = (what, base) => `השוואה לממוצע של ${nPrev} הקודמים (${baseRange}): ${what} ${base} ${per}. סף ההתראה: ±${th}%.`;
    const add = (type, cur, base, minAbs, title, body, explainTxt, dir) => {
      if (types[type] === false) return;
      const d = pctDev(cur, base);
      if (Math.abs(cur - base) < minAbs) return;
      if (Math.abs(d) < (type === 'hourly' ? th / 2 : th)) return;
      if (dir === 'down' && d > 0) return;
      out.push({
        key: keyPrefix + type + '-' + curM.from,
        type, severity: type === 'hourly' ? 'warn' : 'info', push: 'anomaly',
        title: title(d) + sfx, body: body(d), explain: explainTxt, data: { cur, base, dev: d },
      });
    };
    const avgOf = (f) => avg(prevM.map(f));
    const avgWorked = (f) => avg(worked.map(f));

    const bh = avgOf((m) => m.hours);
    add('hours', curM.hours, bh, 2,
      (d) => (d > 0 ? 'יותר שעות מהרגיל' : 'פחות שעות מהרגיל'),
      (d) => `${label} עבדת ${U.num(curM.hours, 1)} שעות — ${fmtPct(d)} לעומת הממוצע (${U.num(bh, 1)}).`,
      explain('ממוצע שעות', U.num(bh, 1)));
    const bs = avgOf((m) => m.shifts);
    add('shifts', curM.shifts, bs, 1,
      (d) => (d > 0 ? 'יותר משמרות מהרגיל' : 'פחות משמרות מהרגיל'),
      (d) => `${label} היו ${curM.shifts} משמרות, לעומת ממוצע של ${U.num(bs, 1)} (${fmtPct(d)}).`,
      explain('ממוצע משמרות', U.num(bs, 1)));
    if (curM.shifts > 0 && types.roles !== false) {
      const roleIds = new Set([...Object.keys(curM.roles), ...prevM.flatMap((m) => Object.keys(m.roles))]);
      for (const id of roleIds) {
        const c = curM.roles[id] || 0, b = avgOf((m) => m.roles[id] || 0);
        const d = pctDev(c, b);
        if (Math.abs(c - b) < 3 || Math.abs(d) < th) continue;
        out.push({
          key: keyPrefix + 'roles-' + id + '-' + curM.from, type: 'roles', severity: 'info', push: 'anomaly',
          title: (d > 0 ? 'הרבה יותר ' : 'הרבה פחות ') + roleName(id) + ' מהרגיל' + sfx,
          body: `${label}: ${U.num(c, 1)} שעות ${roleName(id)}, לעומת ${U.num(b, 1)} בממוצע (${fmtPct(d)}).`,
          explain: explain('ממוצע שעות ' + roleName(id), U.num(b, 1)), data: { cur: c, base: b, dev: d, roleId: id },
        });
      }
    }
    const br = avgOf((m) => m.rest);
    add('rest', curM.rest, br, 2,
      (d) => (d > 0 ? 'עלייה בשעות שבת וחג' : 'ירידה בשעות שבת וחג'),
      (d) => `${label}: ${U.num(curM.rest, 1)} שעות שבת/חג, לעומת ${U.num(br, 1)} בממוצע (${fmtPct(d)}).`,
      explain('ממוצע שעות שבת/חג', U.num(br, 1)));
    const bo = avgOf((m) => m.overtime);
    add('overtime', curM.overtime, bo, 1,
      (d) => (d > 0 ? 'עלייה בשעות הנוספות' : 'ירידה בשעות הנוספות'),
      (d) => `${label}: ${U.num(curM.overtime, 1)} שעות נוספות, לעומת ${U.num(bo, 1)} בממוצע (${fmtPct(d)}).`,
      explain('ממוצע שעות נוספות', U.num(bo, 1)));
    if (curM.shifts > 0 && worked.length) {
      const bhr = avgWorked((m) => m.hourly);
      add('hourly', curM.hourly, bhr, 0.5,
        () => 'ירידה בשכר הממוצע לשעה',
        (d) => `${label} השכר הממוצע לשעה היה ${U.money(curM.hourly)}, לעומת ${U.money(bhr)} בממוצע (${fmtPct(d)}). אולי פחות שעות שבת או נוספות?`,
        explain('שכר ממוצע לשעה', U.money(bhr)) + ' (סף לירידה: חצי מהסף הרגיל).', 'down');
      const bl = avgWorked((m) => m.shiftLength);
      add('shiftLength', curM.shiftLength, bl, 0.75,
        (d) => (d > 0 ? 'משמרות ארוכות מהרגיל' : 'משמרות קצרות מהרגיל'),
        (d) => `${label} משמרת ממוצעת נמשכה ${U.num(curM.shiftLength, 1)} ש׳, לעומת ${U.num(bl, 1)} ש׳ בממוצע (${fmtPct(d)}).`,
        explain('אורך משמרת ממוצע', U.num(bl, 1) + ' ש׳'));
      const bn = avgWorked((m) => m.nightShare);
      if (types.pattern !== false && Math.abs(curM.nightShare - bn) >= th) {
        out.push({
          key: keyPrefix + 'pattern-' + curM.from, type: 'pattern', severity: 'info', push: 'anomaly',
          title: (curM.nightShare > bn ? 'יותר עבודת לילה מהרגיל' : 'פחות עבודת לילה מהרגיל') + sfx,
          body: `${label} ${U.num(curM.nightShare, 0)}% מהשעות היו בין 22:00 ל-06:00, לעומת ${U.num(bn, 0)}% בממוצע.`,
          explain: `השוואה לממוצע של ${nPrev} הקודמים (${baseRange}). סף: שינוי של ${th} נקודות אחוז.`, data: { cur: curM.nightShare, base: bn },
        });
      }
    }
    return { alerts: out, cur: curM, prev: prevM };
  }

  /**
   * Run all checks.
   * state = { now, activeShift, payslips, gaps, lastBackup, roleName(id) }
   * Returns { alerts:[], live:[] (non-persistent insights for the home card), weekly }
   */
  function run(model, state) {
    const S = model.ctx.settings;
    const cfg = S.alerts;
    const types = cfg.types || {};
    const now = state.now || Date.now();
    const today = U.epochKey(now);
    const roleName = state.roleName || ((id) => (model.ctx.roles.get(id) || {}).name || 'תפקיד');
    const alerts = [];
    const live = [];
    const on = (t) => types[t] !== false;
    const first = firstShiftKey(model);
    const emp = model.ctx.primaryEmployer();

    /* ---- deviations ---- */
    const ws = U.weekStart(today, S.weekStart || 0);
    const lastWeek = { from: U.addDays(ws, -7), to: U.addDays(ws, -1) };
    // settings come from a form: whole numbers in a sane range, so a typo can't empty a list or loop for ever
    const span = (v, d, lo, hi) => { const n = Math.round(+v); return Number.isFinite(n) && n >= lo ? Math.min(n, hi) : d; };
    const nW = span(cfg.compareWeeks, 4, 1, 26);
    const prevWeeks = [];
    for (let i = 1; i <= nW; i++) prevWeeks.push({ from: U.addDays(lastWeek.from, -7 * i), to: U.addDays(lastWeek.to, -7 * i) });
    const minWeeks = span(cfg.minWeeksData, 4, 1, 52);
    const enoughWeeks = first && U.diffDays(first, lastWeek.from) >= 7 * minWeeks;
    let weekCmp = null;
    if (enoughWeeks) {
      weekCmp = compareSeries(model, lastWeek, prevWeeks, cfg, 'week', 'w-', roleName);
      alerts.push(...weekCmp.alerts);
    }
    const curP = Engine.periodOf(today, emp);
    const lastP = Engine.periodByKey(U.addMonthKey(curP.key, -1), emp);
    const nM = span(cfg.compareMonths, 3, 1, 12);
    const prevPs = [];
    for (let i = 1; i <= nM; i++) prevPs.push(Engine.periodByKey(U.addMonthKey(lastP.key, -i), emp));
    const enoughMonths = first && first <= prevPs[prevPs.length - 1].to && U.diffDays(first, lastP.from) >= 7 * minWeeks;
    if (enoughMonths) {
      const mc = compareSeries(model, lastP, prevPs, cfg, 'month', 'm-', roleName);
      alerts.push(...mc.alerts);
    }

    /* ---- health ---- */
    const done = [...model.results.values()].filter((r) => r.status === 'done').sort((a, b) => a.start - b.start);
    const recentFrom = U.addDays(today, -14);
    /* ---- the law ---- */
    if (on('minwage')) {
      const mw = Engine.minWageFor(S, today);
      const adult = Engine.legalMinWage(today, null).hourly;
      for (const role of model.ctx.roles.values()) {
        if (role.archived) continue;
        const rate = Engine.roleRate(role, today);
        if (!(rate > 0) || rate + 0.005 >= mw.hourly) continue;
        // without a birth date the adult minimum is used; a teen may be fine at a lower rate
        const maybeTeen = !S.birthDate && !mw.custom && rate >= Engine.legalMinWage(today, U.addDays(today, -16 * 366)).hourly - 0.005;
        alerts.push({ key: `minw-${role.id}-${mw.from}-${mw.hourly}-${rate}`, type: 'minwage', severity: maybeTeen ? 'warn' : 'critical', push: maybeTeen ? 'anomaly' : 'critical', ref: role.id,
          title: `התעריף ב${role.name} נמוך משכר המינימום`,
          body: maybeTeen
            ? `${U.money(rate)} לשעה, פחות משכר המינימום למבוגר (${U.money(adult)}). מתחת לגיל 18 המינימום נמוך יותר: הוסף תאריך לידה בהגדרות כדי לבדוק לפי הגיל שלך.`
            : `${U.money(rate)} לשעה, ושכר המינימום${mw.youth ? ` לגיל ${mw.age}` : ''} הוא ${U.money(mw.hourly)}. חסרים ${U.money(mw.hourly - rate)} על כל שעה.`,
          explain: mw.custom ? 'לפי שכר המינימום שהגדרת בהגדרות.' : `חוק שכר מינימום, התעריף מ-${U.fmtDate(mw.from)}${mw.youth ? ' (לנוער: ' + Math.round(mw.share * 100) + '% משכר המבוגר)' : ''}.` });
      }
    }
    const ageNow = Engine.ageAt(S.birthDate, today);
    if (on('youth') && ageNow != null && ageNow < 18) {
      const from = U.addDays(today, -28);
      const found = { night: [], day: [], breaks: [], eve: [], week: [] };
      const dayMin = new Map(), weekMin = new Map();
      for (const r of done) {
        if (r.dateKey < from) continue;
        const age = Engine.ageAt(S.birthDate, r.dateKey);
        if (age == null || age >= 18) continue;
        const R = Engine.youthRules(age, S.leave && S.leave.workWeek);
        let night = 0;
        for (let t = r.start; t < r.rawEnd; t += 5 * 60000) {
          const d = new Date(t), h = d.getHours() + d.getMinutes() / 60;
          if (h >= R.nightFrom || h < R.nightTo) night += 5;
        }
        if (night >= 15) found.night.push({ k: r.dateKey, id: r.id, txt: `${U.fmtDate(r.dateKey, 'dm')} עד ${U.epochHM(r.rawEnd)}`, R });
        if (r.elapsedMin > R.breakAfterHours * 60 && (+r.breakMin || 0) < R.breakMin) found.breaks.push({ k: r.dateKey, id: r.id, txt: U.fmtDate(r.dateKey, 'dm'), R });
        dayMin.set(r.dateKey, (dayMin.get(r.dateKey) || 0) + r.paidMin);
        const wk = U.weekStart(r.dateKey, 0);
        weekMin.set(wk, (weekMin.get(wk) || 0) + r.paidMin);
        if (!found.ruleOf) found.ruleOf = R;
      }
      const R0 = found.ruleOf || Engine.youthRules(ageNow, S.leave && S.leave.workWeek);
      for (const [k, m] of dayMin) {
        if (m > R0.dayHours * 60 + 1) found.day.push({ k, txt: `${U.fmtDate(k, 'dm')} (${U.hm(m)})` });
        if (U.dow(k) === 5 && m > R0.eveHours * 60 + 1) found.eve.push({ k, txt: `${U.fmtDate(k, 'dm')} (${U.hm(m)})` });
      }
      for (const [wk, m] of weekMin) if (m > R0.weekHours * 60 + 1) found.week.push({ k: wk, txt: `השבוע של ${U.fmtDate(wk, 'dm')} (${U.hm(m)})` });
      const law = 'חוק עבודת הנוער. יש חריגים בהיתר של משרד העבודה; כדאי לבדוק עם המעסיק.';
      const raise = (type, title, body) => {
        const list = found[type];
        if (!list.length) return;
        const last = list.map((x) => x.k).sort().pop();
        alerts.push({ key: `youth-${type}-${last}`, type: 'youth', severity: 'warn', push: 'anomaly', ref: list[list.length - 1].id || null,
          title, body: body + ' ' + list.slice(-4).map((x) => x.txt).join(', ') + (list.length > 4 ? ` ועוד ${list.length - 4}` : '') + '.', explain: law });
      };
      raise('night', 'עבודת לילה לנוער', `מתחת לגיל 18 אסור לעבוד ${R0.nightFrom === 20 ? 'בין 20:00 ל-08:00 (עד גיל 16)' : 'בין 22:00 ל-06:00'}. נרשמו:`);
      raise('day', `יום עבודה ארוך מ-${R0.dayHours} שעות`, `לנוער מותר עד ${R0.dayHours} שעות ביום. נרשמו:`);
      raise('week', 'שבוע של יותר מ-40 שעות', 'לנוער מותר עד 40 שעות בשבוע.');
      raise('breaks', 'הפסקה קצרה מהחוק', `ביום של יותר מ-6 שעות מגיעות לנער 45 דקות הפסקה (חצי שעה ברצף). לא נרשמה הפסקה כזו ב:`);
      raise('eve', 'ערב שבת ארוך מ-7 שעות', 'ביום שישי ובערב חג מותר לנוער לעבוד עד 7 שעות. נרשמו:');
    }

    if (on('long')) {
      for (const r of done) {
        if (r.dateKey < recentFrom) continue;
        if (r.paidHours > (+cfg.longShiftHours || 12)) {
          alerts.push({ key: 'long-' + r.id, type: 'long', severity: 'warn', push: 'anomaly', ref: r.id,
            title: 'משמרת ארוכה מ-' + cfg.longShiftHours + ' שעות',
            body: `ב-${U.fmtDate(r.dateKey, 'dm')} עבדת ${U.hm(r.paidMin)} שעות. מגיעה לך מנוחה טובה.`,
            explain: 'הסף שהוגדר: ' + cfg.longShiftHours + ' שעות במשמרת אחת (ניתן לשינוי בהגדרות).' });
        }
      }
    }
    if (on('rest8')) {
      for (let i = 1; i < done.length; i++) {
        const a = done[i - 1], b = done[i];
        if (b.dateKey < recentFrom) continue;
        const gapH = (b.start - a.rawEnd) / U.HOUR;
        if (gapH >= 0 && gapH < (+cfg.minRestHours || 8)) {
          alerts.push({ key: 'rest8-' + b.id, type: 'rest8', severity: 'warn', push: 'anomaly', ref: b.id,
            title: 'פחות מ-' + cfg.minRestHours + ' שעות מנוחה',
            body: `בין המשמרת שהסתיימה ב-${U.epochHM(a.rawEnd)} (${U.fmtDate(a.dateKey, 'short')}) לזו שהתחילה ב-${U.epochHM(b.start)} היו רק ${U.num(gapH, 1)} שעות.`,
            explain: 'הסף שהוגדר: ' + cfg.minRestHours + ' שעות מנוחה בין משמרות.' });
        }
      }
    }
    if (on('streak') && done.length) {
      const days = new Set(done.map((r) => r.dateKey));
      const lastDay = done[done.length - 1].dateKey;
      let streak = 0;
      for (let k = lastDay; days.has(k); k = U.addDays(k, -1)) streak++;
      if (streak >= (+cfg.streakDays || 6) && U.diffDays(lastDay, today) <= 1) {
        alerts.push({ key: 'streak-' + U.addDays(lastDay, -streak + 1) + '-' + streak, type: 'streak', severity: 'warn', push: 'anomaly',
          title: streak + ' ימי עבודה ברצף', body: `עבדת ${streak} ימים ברצף בלי יום חופש. כדאי לתכנן יום מנוחה.`,
          explain: 'הסף שהוגדר: ' + cfg.streakDays + ' ימים ברצף.' });
      }
    }
    if (on('weekHours')) {
      for (const w of [{ from: ws, to: U.addDays(ws, 6) }, lastWeek]) {
        const t = Engine.totals(model, w.from, w.to);
        if (t.hours > (+cfg.weekHoursMax || 50)) {
          alerts.push({ key: 'weekh-' + w.from, type: 'weekHours', severity: 'warn', push: 'anomaly',
            title: 'שבוע של יותר מ-' + cfg.weekHoursMax + ' שעות',
            body: `בשבוע שמתחיל ב-${U.fmtDate(w.from, 'dm')} נרשמו ${U.num(t.hours, 1)} שעות.`,
            explain: 'הסף שהוגדר: ' + cfg.weekHoursMax + ' שעות בשבוע.' });
        }
      }
    }

    /* ---- money ---- */
    const curSum = Engine.periodSummary(model, curP.key, emp.id);
    const planned = Engine.totals(model, today > curP.from ? U.addDays(today, 0) : curP.from, curP.to, { status: 'planned' });
    const elapsed = Math.max(1, U.diffDays(curP.from, today) + 1);
    const total = U.diffDays(curP.from, curP.to) + 1;
    const goal = +(S.goal && S.goal.amount) || 0;
    const goalNet = S.goal && S.goal.type === 'net';
    const curVal = goalNet ? curSum.net.net : curSum.gross;
    const pace = elapsed >= 3 ? (curSum.gross / elapsed) * total : null;
    const withPlanned = curSum.gross + planned.wage + planned.travel;
    const ratio = curSum.gross > 0 ? curSum.net.net / curSum.gross : 0.85;
    const projection = { period: curP, actual: curSum.gross, actualNet: curSum.net.net, pace, withPlanned, plannedCount: planned.shifts, elapsed, total };
    if (on('projection') && pace != null && curSum.gross > 0) {
      live.push({ type: 'projection', priority: 2, title: 'צפי לסוף ' + (emp.periodStartDay > 1 ? 'התקופה' : 'החודש'),
        body: `לפי הקצב הנוכחי: כ-${U.money(pace, 0)} ברוטו` + (planned.shifts ? `; עם ${planned.shifts} המשמרות המתוכננות: ${U.money(withPlanned, 0)}.` : '.'),
        explain: `${U.money(curSum.gross, 0)} עד היום ב-${elapsed} מתוך ${total} ימים, מוכפל לפי הקצב.` });
    }
    if (goal > 0) {
      const target = goal;
      const val = goalNet ? curVal : curSum.gross;
      if (on('goal') && val >= target) {
        alerts.push({ key: 'goal-' + curP.key, type: 'goal', severity: 'good', push: 'anomaly',
          title: 'עברת את היעד החודשי! 🎉', body: `הגעת ל-${U.money(val, 0)} ${goalNet ? 'נטו משוער' : 'ברוטו'} מתוך יעד של ${U.money(target, 0)}.`,
          explain: 'היעד מוגדר בהגדרות › יעדים.' });
      } else {
        const projVal = goalNet ? (pace || 0) * ratio : pace || 0;
        if (on('goal') && pace != null && elapsed / total >= 0.5 && projVal < target) {
          alerts.push({ key: 'goalrisk-' + curP.key, type: 'goal', severity: 'warn', push: 'anomaly',
            title: 'לפי הקצב, לא תגיע ליעד', body: `צפי: ${U.money(projVal, 0)} מתוך ${U.money(target, 0)}.`,
            explain: 'הצפי מבוסס על הקצב מתחילת התקופה. ההתראה נשלחת אחרי שעברה חצי מהתקופה.' });
        }
        if (on('goalShifts')) {
          const avgShift = done.length ? done.slice(-20).reduce((s, r) => s + r.wage + r.travel.amount, 0) / Math.min(20, done.length) : 0;
          const remaining = target - val;
          if (avgShift > 0 && remaining > 0) {
            const n = Math.ceil(remaining / (goalNet ? avgShift * ratio : avgShift));
            live.push({ type: 'goalShifts', priority: 1, title: 'עוד כ-' + n + ' משמרות ליעד',
              body: `חסרים ${U.money(remaining, 0)} ליעד של ${U.money(target, 0)}. משמרת ממוצעת שלך שווה כ-${U.money(avgShift, 0)}.`,
              explain: 'ממוצע 20 המשמרות האחרונות, כולל נסיעות.' });
          }
        }
      }
    }
    if (on('record') && enoughWeeks) {
      const lw = Engine.totals(model, lastWeek.from, lastWeek.to).gross;
      let best = 0;
      for (let k = U.addDays(lastWeek.from, -7); k >= U.weekStart(first, S.weekStart || 0); k = U.addDays(k, -7)) {
        best = Math.max(best, Engine.totals(model, k, U.addDays(k, 6)).gross);
      }
      if (lw > best && best > 0) {
        alerts.push({ key: 'recw-' + lastWeek.from, type: 'record', severity: 'good', push: 'anomaly',
          title: 'שיא אישי: השבוע הכי רווחי! 🏆', body: `${U.money(lw, 0)} ברוטו בשבוע שהסתיים. השיא הקודם: ${U.money(best, 0)}.`,
          explain: 'השוואה לכל השבועות מאז המשמרת הראשונה שנרשמה.' });
      }
      if (enoughMonths) {
        const lm = Engine.periodSummary(model, lastP.key, emp.id).gross;
        let bestM = 0;
        for (let pk = U.addMonthKey(lastP.key, -1), i = 0; i < 60 && pk >= U.monthKey(first); pk = U.addMonthKey(pk, -1), i++) {
          bestM = Math.max(bestM, Engine.periodSummary(model, pk, emp.id).gross);
        }
        if (lm > bestM && bestM > 0) {
          alerts.push({ key: 'recm-' + lastP.key, type: 'record', severity: 'good', push: 'anomaly',
            title: 'שיא אישי: החודש הכי רווחי! 🏆', body: `${U.money(lm, 0)} ברוטו ב${lastP.label}. השיא הקודם: ${U.money(bestM, 0)}.`,
            explain: 'השוואה לכל החודשים הקודמים.' });
        }
      }
    }
    if (on('travel')) {
      for (const P of [curP, lastP]) {
        const t = Engine.totals(model, P.from, P.to);
        if (t.travelRaw > t.travel + 0.5) {
          alerts.push({ key: 'travelcap-' + P.key, type: 'travel', severity: 'info', push: null,
            title: 'הנסיעות הגיעו לתקרה החודשית', body: `ב${P.label} צברת ${U.money(t.travelRaw, 0)} נסיעות, אבל התקרה היא ${U.money(emp.travelMonthlyCap, 0)}.`,
            explain: 'התקרה מוגדרת בהגדרות › מעסיק › נסיעות.' });
        }
      }
    }
    // one alert per payslip with open gaps
    const bySlip = {};
    for (const g of state.gaps || []) if (g.status === 'open') (bySlip[g.payslipId] = bySlip[g.payslipId] || []).push(g);
    for (const [pid, gs] of Object.entries(bySlip)) {
      if (!on('payslipGap')) break;
      const tot = gs.reduce((s, g) => s + (g.amount || 0), 0);
      alerts.push({ key: 'gap-' + pid + '-' + gs.map((g) => g.area).sort().join(','), type: 'payslipGap', severity: 'critical', push: 'critical', ref: pid,
        title: (gs.length > 1 ? gs.length + ' פערים' : 'פער') + ' בתלוש ' + U.fmtMonth(gs[0].period) + (tot ? ` — ${U.money(tot, 0)}` : ''),
        body: gs.map((g) => g.title + (g.amount ? ` (${U.money(g.amount, 0)})` : '')).join(' · '),
        explain: 'נמצא בניתוח התלוש. אפשר לסמן כל פער כ"הוחזר" בדוחות › תלושים.' });
    }

    /* ---- reminders ---- */
    const a = state.activeShift;
    if (on('timer') && a && a.start) {
      const h = (now - a.start) / U.HOUR;
      if (h > (+cfg.timerHours || 12)) {
        alerts.push({ key: 'timer-' + a.start, type: 'timer', severity: 'critical', push: 'critical',
          title: 'שכחת לסיים משמרת?', body: `הטיימר רץ כבר ${U.num(h, 1)} שעות (מאז ${U.epochHM(a.start)}).`,
          explain: 'הסף שהוגדר: ' + cfg.timerHours + ' שעות.' });
      }
    }
    for (const r of model.results.values()) {
      if (r.status !== 'planned') continue;
      if (on('plannedPast') && r.rawEnd < now) {
        alerts.push({ key: 'planned-' + r.id, type: 'plannedPast', severity: 'warn', push: 'critical', ref: r.id,
          title: 'משמרת מתוכננת שעברה', body: `המשמרת של ${U.fmtDate(r.dateKey, 'dm')} (⁦${U.epochHM(r.start)}–${U.epochHM(r.rawEnd)}⁩) לא סומנה כ"בוצעה".`,
          explain: 'משמרות מתוכננות לא נספרות בשכר עד שמסמנים אותן כבוצעו.' });
      }
      const mins = (r.start - now) / U.MIN;
      if (on('upcoming') && mins > 0 && mins <= (+cfg.upcomingMin || 60)) {
        alerts.push({ key: 'up-' + r.id, type: 'upcoming', severity: 'info', push: 'critical', ref: r.id,
          title: 'משמרת בעוד ' + Math.round(mins) + ' דקות', body: `${roleName(r.segments[0] ? r.segments[0].roleId : '')} · ⁦${U.epochHM(r.start)}–${U.epochHM(r.rawEnd)}⁩`,
          explain: 'תזכורת ' + cfg.upcomingMin + ' דקות לפני משמרת מתוכננת.' });
      }
    }
    if (on('idle') && done.length >= 3 && !a) {
      const lastKey = done[done.length - 1].dateKey;
      const gap = U.diffDays(lastKey, today);
      if (gap >= (+cfg.idleDays || 7)) {
        alerts.push({ key: 'idle-' + lastKey, type: 'idle', severity: 'info', push: 'anomaly',
          title: 'לא נרשמה משמרת כבר ' + gap + ' ימים', body: 'שכחת לרשום משמרות? אם היית בחופש — תהנה!',
          explain: 'המשמרת האחרונה: ' + U.fmtDate(lastKey) + '. הסף: ' + cfg.idleDays + ' ימים.' });
      }
    }
    if (on('suspicious')) {
      for (const iss of Engine.dataIssues(model)) {
        if (iss.ids.every((id) => { const r = model.results.get(id); return r && r.dateKey < U.addDays(today, -60); })) continue;
        alerts.push({ key: 'sus-' + iss.type + '-' + iss.ids.join('-'), type: 'suspicious', severity: 'warn', push: 'critical', ref: iss.ids[0],
          title: iss.type === 'overlap' ? 'משמרות חופפות' : 'נתון חשוד', body: iss.text,
          explain: 'בדיקת תקינות אוטומטית: חפיפות, משמרות ארוכות מ-' + cfg.suspiciousHours + ' שעות, סיום לפני התחלה.' });
      }
    }
    if (on('payslipDue')) {
      const pd = lastP.payDate;
      const has = (state.payslips || []).some((p) => p.period === lastP.key);
      if (today >= pd && !has && first && first <= lastP.to && U.diffDays(pd, today) <= 20) {
        alerts.push({ key: 'payslip-' + lastP.key, type: 'payslipDue', severity: 'info', push: 'critical',
          title: 'הגיע יום התשלום — הזן את התלוש', body: `העלה את התלוש של ${lastP.label} כדי לבדוק שקיבלת את כל מה שמגיע לך.`,

      }
    }
    if (on('backup') && first) {
      const lb = state.lastBackup;
      const days = lb ? U.diffDays(U.epochKey(lb), today) : U.diffDays(first, today);
      if (days >= (+cfg.backupDays || 30)) {
        alerts.push({ key: 'backup-' + U.weekStart(today), type: 'backup', severity: 'warn', push: 'critical',

          explain: 'הנתונים שמורים רק בטלפון. מומלץ לשמור קובץ גיבוי ב-Google Drive.' });
      }
    }
    if (on('recuperation') && S.startDate) {
      const L = Engine.leaveBalances(model, today);
      const rc = L.recuperation;
      if (rc && rc.eligible) {
        if (U.diffDays(rc.eligibleFrom, today) <= 45 && U.diffDays(rc.eligibleFrom, today) >= 0) {
          alerts.push({ key: 'recup-eligible', type: 'recuperation', severity: 'good', push: 'critical',

            explain: 'לפי צו ההרחבה: אחרי שנת עבודה, לפי ותק והיקף משרה. ההיקף מחושב מהשעות בפועל.' });
        }
        const rm = +S.leave.recuperationMonth || 0;
        if (rm > 0 && +today.slice(5, 7) === rm) {
          alerts.push({ key: 'recup-' + today.slice(0, 4), type: 'recuperation', severity: 'info', push: 'critical',
            title: 'בדוק שקיבלת דמי הבראה', body: `החודש המעסיק אמור לשלם הבראה. הערכה: ${U.money(rc.amount, 0)}.`,
            explain: 'חודש התשלום מוגדר בהגדרות › חופשה ומחלה.' });
        }
      }
    }

    /* ---- birthday ---- */
    if (S.birthDate && types.birthday !== false) {
      const b = S.birthDate.slice(5);
      if (today.slice(5) === b) {
        const age = Engine.ageAt(S.birthDate, today);
        alerts.push({ key: 'bday-' + today.slice(0, 4), type: 'birthday', severity: 'good', push: 'critical',
          title: 'מזל טוב! 🎂', body: `יום הולדת ${age} שמח${S.userName ? ', ' + S.userName : ''}! מאחלים שנה של משמרות טובות ומשכורות שמנות.`,
          explain: 'לפי תאריך הלידה שהוזן בהגדרות.' });
        if (age === 18) alerts.push({ key: 'turn18-' + today.slice(0, 4), type: 'birthday', severity: 'info', push: null,
          title: 'מהיום — ניכויים רגילים', body: 'מגיל 18 מנוכים ביטוח לאומי ומס בריאות, ובהמשך גם פנסיה. הנטו המשוער יחושב מעכשיו בהתאם.',
          explain: 'לפי תאריך הלידה שהוזן בהגדרות.' });
      }
    }

    /* ---- weekly summary ---- */
    let weekly = null;
    if (on('weekly')) {
      const wd = +cfg.weeklyDay, wh = +cfg.weeklyHour;
      let wStart = ws;
      let trigger = U.toEpoch(U.addDays(wStart, (wd - (S.weekStart || 0) + 7) % 7), U.pad(wh) + ':00');
      if (now < trigger) { wStart = U.addDays(ws, -7); trigger -= 7 * U.DAY; }
      const wEnd = U.addDays(wStart, 6);
      weekly = weeklySummary(model, wStart, wEnd, roleName, S);
      if (weekly && weekly.t.shifts > 0) {
        alerts.push({ key: 'weekly-' + wStart, type: 'weekly', severity: 'info', push: 'anomaly', data: { from: wStart, to: wEnd },
          title: 'הסיכום השבועי שלך', body: weekly.sentence, explain: weekly.explain });
      }
    }

    for (const al of alerts) {
      al.cat = (TYPE_INFO[al.type] || {}).cat || 'info';
      if (al.key.indexOf('undefined') >= 0) al.key = al.type + '-' + al.title;
    }
    return { alerts, live, projection, weekly, weekCmp };
  }

  /** Plain-language weekly sentence. */
  function weeklySummary(model, from, to, roleName, S) {
    const t = Engine.totals(model, from, to);
    const prev = [];
    for (let i = 1; i <= 4; i++) prev.push(Engine.totals(model, U.addDays(from, -7 * i), U.addDays(to, -7 * i)));
    const ah = avg(prev.map((p) => p.hours));
    const diff = t.hours - ah;
    let sentence = `השבוע עבדת ${U.num(t.hours, 1)} שעות ב-${t.shifts} משמרות והרווחת ${U.money(t.gross, 0)} ברוטו.`;
    const hasHistory = prev.some((p) => p.shifts > 0);
    if (hasHistory && Math.abs(diff) >= 1) {
      // which role drove the change?
      let driver = null, best = 0;
      const ids = new Set([...Object.keys(t.byRole), ...prev.flatMap((p) => Object.keys(p.byRole))]);
      for (const id of ids) {
        const d = (t.byRole[id] ? t.byRole[id].hours : 0) - avg(prev.map((p) => (p.byRole[id] ? p.byRole[id].hours : 0)));
        if (Math.sign(d) === Math.sign(diff) && Math.abs(d) > best) { best = Math.abs(d); driver = id; }
      }
      sentence += ` זה ${U.num(Math.abs(diff), 1)} שעות ${diff > 0 ? 'יותר' : 'פחות'} מהממוצע`;
      if (driver && ids.size > 1) sentence += `, בעיקר ב${roleName(driver)}`;
      sentence += '.';
    } else if (hasHistory) sentence += ' בערך כמו הממוצע שלך.';
    if (t.restHours >= 1) sentence += ` ${U.num(t.restHours, 1)} מהשעות היו בשבת/חג.`;
    return { from, to, t, avgHours: ah, sentence, explain: `השבוע ⁦${U.fmtDate(from, 'short')}–${U.fmtDate(to, 'short')}⁩, בהשוואה לממוצע 4 השבועות שלפניו (${U.num(ah, 1)} ש׳).` };
  }

  root.Insights = { run, metrics, compareSeries, weeklySummary, TYPE_INFO, pctDev };
})(typeof window !== 'undefined' ? window : globalThis);

    ytdGross: 'סכום הברוטו מתחילת השנה.',
    ytdTax: 'סך מס ההכנסה שנוכה מתחילת השנה.',
    taxableGross: 'השכר החייב במס: הברוטו אחרי הפחתות מסוימות.',
    workHours: 'סך השעות שהמעסיק רשם לחודש.',
    workDays: 'מספר ימי העבודה שהמעסיק רשם — משמש גם לחישוב הנסיעות.',
  };

  /* ---------------- text helpers ---------------- */
  const HEB = /[֐-׿]/;
  const revStr = (s) => s.split('').reverse().join('');
  /** Visual-order (reversed) Hebrew → logical order: reverse token order, reverse letters of Hebrew tokens. */
  function fixVisual(line) {
    return line.split(/\s+/).reverse().map((t) => (HEB.test(t) ? revStr(t) : t)).join(' ');
  }
  function normalize(s) {
    return s.replace(/[‎‏‪-‮]/g, '').replace(/[״“”]/g, '"').replace(/[׳‘’`]/g, "'").replace(/\s+/g, ' ').trim();
  }
  /** Numbers in a line, in reading order. Handles 1,234.56 / trailing minus / percents. */
  function numbersIn(line) {
    const clean = line.replace(/\b\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}\b/g, ' ');
    const re = /(-?)(\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?)(-?)(\s*%)?/g;
    const out = [];
    let m;
    while ((m = re.exec(clean))) {
      const raw = m[2];
      if (!raw.includes('.') && !raw.includes(',') && raw.length > 6) continue; // ids
      let v = parseFloat(raw.replace(/,/g, ''));
      if (m[1] === '-' || m[3] === '-') v = -v;
      out.push({ v, pct: !!m[4], dec: raw.includes('.'), raw: m[0] });
    }
    return out;
  }
  function matchField(line) {
    const n = normalize(line);
    for (const f of FIELDS) {
      for (const p of f.pats) {
        if (n.includes(p)) {
          // 150% lines that mention Shabbat/holiday belong to rest150
          if (f.key === 'ot150' && /שבת|חג|מנוחה/.test(n)) return FIELD.rest150;
          if (f.key === 'ot125' && /שבת|חג|מנוחה/.test(n) && /150/.test(n)) return FIELD.rest150;
          if (f.key === 'gross' && /למס|מצטבר/.test(n)) continue;
          if (f.key === 'net' && /מצטבר/.test(n)) continue;
          return f;
        }
      }

    return null;
  }
  /** Choose amount / qty / rate from a line's numbers. */
  function pickValues(f, nums) {
    const vals = nums.filter((x) => !x.pct).map((x) => x.v);
    const pcts = nums.filter((x) => x.pct).map((x) => x.v);
    if (!vals.length) return null;
    if (f.kind === 'info') return { value: vals[0] };
    if (vals.length >= 3) {
      for (let i = 0; i < vals.length; i++) for (let j = i + 1; j < vals.length; j++) for (let k = 0; k < vals.length; k++) {
        if (k === i || k === j) continue;
        const prod = vals[i] * vals[j];
        if (vals[k] !== 0 && Math.abs(prod - vals[k]) / Math.abs(vals[k]) < 0.015) {
          return { value: vals[k], qty: vals[i], rate: vals[j], pct: pcts[0] };

      }

    if (vals.length === 2 && f.hours) {
      // qty + amount (rate missing)

    return { value: vals[vals.length - 1], pct: pcts[0] };

  /** Group pdf.js text items into logical lines (right-to-left). */
  function linesFromPdfItems(items) {
    const rows = [];
    for (const it of items) {
      if (!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5];
      let row = rows.find((r) => Math.abs(r.y - y) < 3);
      if (!row) { row = { y, items: [] }; rows.push(row); }
      row.items.push({ x, s: it.str, w: it.width || 0 });
    }
    rows.sort((a, b) => b.y - a.y);
    return rows.map((r) => r.items.sort((a, b) => b.x - a.x).map((i) => i.s).join(' '));
  }

  const MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
  function detectPeriod(text) {
    const counts = {};
    const bump = (y, m) => { if (y < 2000 || y > 2100 || m < 1 || m > 12) return; const k = y + '-' + U.pad(m); counts[k] = (counts[k] || 0) + 1; };
    let m;
    const re1 = /(?:^|[^\d])(\d{1,2})[\/.-](20\d{2})(?!\d)/g;
    while ((m = re1.exec(text))) bump(+m[2], +m[1]);
    MONTHS.forEach((name, i) => {
      const re = new RegExp(name + "\\s*['׳]?\\s*(20\\d{2})", 'g');
      let mm;
      while ((mm = re.exec(text))) { bump(+mm[1], i + 1); bump(+mm[1], i + 1); }
    });
    const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    return best ? best[0] : null;
  }

  /**
   * Parse raw text (one line per row).
   * Returns { fields:{key:{value,qty,rate,pct,line}}, other:[{line,value,guess}], period, lineCount }
   */
  function parseText(text) {
    const rawLines = text.split(/\r?\n/).map(normalize).filter(Boolean);
    const fields = {};
    const other = [];
    for (const raw of rawLines) {
      let f = matchField(raw);
      let line = raw;
      if (!f && HEB.test(raw)) {
        const alt = fixVisual(raw);
        f = matchField(alt);
        if (f) line = alt;
      }
      const nums = numbersIn(line);
      if (!f) {
        const vals = nums.filter((x) => !x.pct && x.dec);
        if (vals.length && HEB.test(line)) other.push({ line, value: vals[vals.length - 1].v, guess: null });
        continue;
      }
      const pv = pickValues(f, nums);
      if (!pv) continue;
      if (fields[f.key]) {
        // a second line for the same field: sum earnings (e.g. two roles' base pay), keep first for others
        if (f.kind === 'pay') {
          const cur = fields[f.key];
          cur.value += pv.value;
          if (pv.qty != null) cur.qty = (cur.qty || 0) + pv.qty;
          cur.line += ' | ' + line;
          cur.rate = cur.qty ? cur.value / cur.qty : cur.rate;
        }
        continue;
      }
      fields[f.key] = Object.assign({ line }, pv);
    }
    return { fields, other, period: detectPeriod(text), lineCount: rawLines.length };
  }

  /* ---------------- redaction (before optional AI) ---------------- */
  function redact(text) {
    let count = 0;
    const lines = text.split(/\r?\n/).map((line) => {
      let l = line;
      if (/(רחוב|רח'|רח׳|כתובת|מיקוד|ת\.ד|דירה|שכונת|ישוב:|יישוב:)/.test(l)) { count++; return '[כתובת הוסתרה]'; }
      if (/(בנק|סניף|חשבון|IBAN|מס' חשבון)/i.test(l)) {
        l = l.replace(/\d[\d\-\s]{2,}\d/g, () => { count++; return '[פרטי בנק הוסתרו]'; });
      }
      if (/(ת\.ז|ת"ז|ת״ז|תעודת זהות|מספר זהות|מס' זהות|זהות)/.test(l)) {
        l = l.replace(/\d[\d\-\s]{4,}\d/g, () => { count++; return '[ת״ז הוסתרה]'; });
      }
      l = l.replace(/\b\d{9}\b/g, () => { count++; return '[מספר הוסתר]'; });
      l = l.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, () => { count++; return '[אימייל הוסתר]'; });
      l = l.replace(/(?:\+972[-\s]?|\b0)(?:5\d|[2-489]|7\d)[-\s]?\d{3}[-\s]?\d{4}\b/g, () => { count++; return '[טלפון הוסתר]'; });
      return l;
    });
    return { text: lines.join('\n'), count };
  }

  /** JSON schema for the optional AI extraction (structured output).
   *  Kept flat with no optional/union types: qty and rate are 0 when absent. */
  function aiSchema() {
    return {
      type: 'object',
      properties: {
        period: { type: 'string', description: 'Pay month as YYYY-MM, or empty string' },
        fields: {
          type: 'array',
          items: {
            type: 'object',
            properties: {
              key: { type: 'string', enum: FIELDS.map((f) => f.key) },
              value: { type: 'number' }, qty: { type: 'number' }, rate: { type: 'number' },
            },
            required: ['key', 'value', 'qty', 'rate'], additionalProperties: false,
          },
        },
        otherLines: {
          type: 'array',
          items: {
            type: 'object',
            properties: { label: { type: 'string' }, amount: { type: 'number' }, type: { type: 'string', enum: ['payment', 'deduction', 'employer', 'info'] } },
            required: ['label', 'amount', 'type'], additionalProperties: false,
          },
        },
        notes: { type: 'string' },
      },
      required: ['period', 'fields', 'otherLines', 'notes'], additionalProperties: false,

  }
  function aiPrompt() {
    return 'You read the text of an Israeli payslip (תלוש שכר) produced by PDF text extraction or Hebrew OCR. ' +
      'Hebrew words may appear reversed (visual order) and table columns may be out of order; reconstruct the meaning carefully. ' +
      'Personal details were replaced with placeholders such as [ת״ז הוסתרה]; ignore them.\n' +
      'Return the monthly amounts in ILS for every field key below that appears in the payslip (omit keys that do not appear). ' +
      'For hour-based lines also return qty (hours) and rate (ILS per hour); use 0 when a line has no quantity or rate. ' +
      'Deductions are positive numbers. Do not invent values. Year-to-date (מצטבר) columns go only to the ytd* keys.\n' +
      'Field keys: ' + FIELDS.map((f) => `${f.key} = ${f.label}`).join('; ') + '.\n' +

  /** Convert AI JSON to the same {fields, other, period} shape as parseText. */
  function fromAi(json) {

      fields[x.key] = { value: +x.value, qty: x.qty ? +x.qty : undefined, rate: x.rate ? +x.rate : undefined, line: 'AI' };
    }

  /* ---------------- analysis ---------------- */
  const val = (F, k) => (F[k] && F[k].value != null && !isNaN(F[k].value) ? +F[k].value : null);

  /** App-side expectations for a pay period. */
  function expected(model, pk, useAuto) {
    const emp = model.ctx.primaryEmployer();
    const P = Engine.periodByKey(pk, emp);
    const results = useAuto && model.autoResults && model.autoResults.size ? model.autoResults : model.results;
    const m = Object.assign({}, model, { results });
    const t = Engine.totals(m, P.from, P.to);
    const pay = { base: 0, ot125: 0, ot150: 0, rest150: 0, rest175: 0, rest200: 0 };
    const hrs = { base: 0, ot125: 0, ot150: 0, rest150: 0, rest175: 0, rest200: 0 };
    const shifts = [];
    for (const r of results.values()) {
      if (r.status !== 'done' || r.dateKey < P.from || r.dateKey > P.to) continue;
      shifts.push(r);
      for (const l of r.lines) {
        const k = l.rest ? ['rest150', 'rest175', 'rest200'][l.tier] : ['base', 'ot125', 'ot150'][l.tier];
