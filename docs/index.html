      ${st.type === 'custom' ? `<div class="grid2"><label class="field"><span class="lbl">מתאריך</span><input class="input" type="date" id="rep-from" value="${st.from}"></label><label class="field"><span class="lbl">עד תאריך</span><input class="input" type="date" id="rep-to" value="${st.to}"></label></div>`

        ${t.leavePay ? `<div class="small" style="margin-top:4px">כולל ימי חופשה/מחלה: <b>${U.money(t.leavePay, 0)}</b></div>` : ''}

        ${longest ? `<div class="kv" style="margin-top:8px"><span>המשמרת הארוכה ביותר</span><b>${U.fmtDate(longest.dateKey, 'short')} · <span class="num">${U.hm(longest.paidMin)}</span> ש׳</b></div>` : ''}
        ${t.bestDay ? `<div class="kv"><span>היום הרווחי ביותר</span><b>${U.fmtDate(t.bestDay.key, 'short')} · ${U.money(t.bestDay.amount, 0)}</b></div>` : ''}</div>
      ${st.type === 'year' ? yearExtras(t, r) : ''}
      </div>
      ${st.type === 'month' && t.shifts > 0 && App.recap ? `<button class="btn recap-btn block" data-act="recap-open" data-pk="${Engine.periodOf(r.from, S.employers[0]).key}">✨ הסיכום של החודש כסיפור</button>` : ''}
      <div class="btn-row" style="margin-top:8px">
        <button class="btn tonal" data-act="rep-share-img">${icon('image')} תמונה</button>
        <button class="btn tonal" data-act="rep-pdf">${icon('printer')} PDF</button>
        <button class="btn tonal" data-act="rep-csv">${icon('table')} CSV</button>

  }

  /* ---------------- charts ---------------- */
  function chartsView() {

/* ============================================================

(function (root) {

  const LIBS = {

    pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
    tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    anthropic: 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm',
  };
  const loaded = {};
  function loadScript(src) {
    if (loaded[src]) return loaded[src];
    loaded[src] = new Promise((res, rej) => {
      const s = document.createElement('script');

      s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error('לא ניתן לטעון רכיב (נדרש אינטרנט בשימוש הראשון)')); };
      document.head.appendChild(s);

    return loaded[src];
  }
  const DISCLAIMER = `<div class="disclaimer">${icon('info', 's')}<div>הניתוח הוא כלי עזר בלבד ואינו ייעוץ משפטי או חשבונאי. חישובים שתלויים בהסכם קיבוצי, בחוזה או בוותק מסומנים ברמת ביטחון נמוכה. במקרה של ספק — פנה למשאבי אנוש, לרו״ח, לארגון העובדים או לאתר "כל זכות".</div></div>`;

  /* ---------------- extraction ---------------- */
  async function extractPdf(file, progress) {
    await loadScript(LIBS.pdf);
    const pdfjs = root.pdfjsLib;
    pdfjs.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
    const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
    let lines = [];
    for (let p = 1; p <= Math.min(doc.numPages, 4); p++) {
      progress(`קורא עמוד ${p} מתוך ${doc.numPages}…`);
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      lines = lines.concat(Payslip.linesFromPdfItems(tc.items));
    }
    const text = lines.join('\n');
    if (text.replace(/\s/g, '').length > 80) return { text, source: 'pdf' };
    // scanned PDF → render & OCR
    progress('ה-PDF סרוק — מריץ זיהוי טקסט…');
    const page = await doc.getPage(1);
    const vp = page.getViewport({ scale: 2.5 });
    const canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    return { text: await ocr(canvas, progress), source: 'ocr' };
  }
  async function ocr(image, progress) {
    await loadScript(LIBS.tesseract);
    progress('טוען מנוע זיהוי עברית (פעם ראשונה ~10MB)…');
    const worker = await root.Tesseract.createWorker('heb+eng', 1, {
      logger: (m) => { if (m.status === 'recognizing text') progress(`מזהה טקסט… ${Math.round(m.progress * 100)}%`); },
    });

      const { data } = await worker.recognize(image);
      return data.text;
    } finally { await worker.terminate(); }
  }
  async function extract(file, progress) {
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) return extractPdf(file, progress);
    return { text: await ocr(file, progress), source: 'ocr' };
  }

  /* ---------------- flow: upload → extract → verify ---------------- */
  App.actions['payslip-new'] = () => {

      title: 'ניתוח תלוש שכר',
      body: `<div class="small muted" style="margin-bottom:12px">העלה את התלוש (PDF או צילום). הקריאה מתבצעת בטלפון — התלוש לא נשלח לשום מקום.</div>
        <label class="btn big" style="margin-bottom:10px">${icon('upload')} בחר קובץ PDF או תמונה<input type="file" accept="application/pdf,image/*" id="ps-file" hidden></label>
        <label class="btn tonal block" style="margin-bottom:10px">${icon('camera')} צלם את התלוש<input type="file" accept="image/*" capture="environment" id="ps-cam" hidden></label>
        <button class="btn outlined block" data-manual>${icon('edit')} הזנה ידנית (בלי קובץ)</button>
        <div class="tiny muted" style="margin-top:12px">טיפ: PDF מקורי מדויק יותר מצילום. בצילום — תאורה טובה, ישר מלמעלה, כל התלוש בפריים.</div>${DISCLAIMER}`,
      onMount: (el) => {
        const go = async (file) => {
          if (!file) return;
          UI.closeTop();
          setTimeout(() => startExtraction(file), 320);

      },
    });
  };
  function defaultPeriod() {
    const emp = S.employers[0];
    return U.addMonthKey(Engine.periodOf(U.todayKey(), emp).key, -1);
  }
  async function startExtraction(file) {
    let statusEl = null;
    UI.openSheet({
      title: 'קורא את התלוש…',
      body: `<div class="empty"><div class="art">${icon('receipt')}</div><h3 id="ps-status">מתחיל…</h3><div class="small">${esc(file.name)}</div></div>`,
      onMount: (el) => { statusEl = el.querySelector('#ps-status'); },

   * and the AI option wait folded at the bottom. */
  const GROUPS = [['pay', 'תשלומים', 'wallet', 'mint', true], ['ded', 'ניכויים', 'minus', 'orange', true], ['emp', 'הפרשות המעסיק', 'shield', 'sky', true], ['total', 'סיכומים', 'receipt', 'violet', false], ['info', 'מידע נוסף', 'info', 'sky', false]];
  const SOURCE = { pdf: ['file', 'נקרא מ-PDF'], ocr: ['camera', 'נקרא מצילום'], ai: ['sparkle', 'נותח בעזרת AI'], manual: ['edit', 'הזנה ידנית'] };
  const ESSENTIAL = ['gross', 'net', 'base', 'workHours'];
  function verifySheet(draft) {
    const d = { period: draft.period, fields: Store.clone(draft.fields) || {}, other: (draft.other || []).map((o) => Object.assign({ guess: o.guess || 'ignore' }, o)), text: draft.text || '', source: draft.source, fileId: draft.fileId, fileName: draft.fileName, id: draft.id, notes: draft.notes || '' };
    let sheetEl = null;

    const shown = (f) => {
      const v = val(f.key);

    };

  /* ---------------- analysis ---------------- */
  const STATUS = { ok: ['okc', 'תקין', '✅'], warn: ['alert', 'כדאי לבדוק', '⚠️'], bad: ['xc', 'חסר או שגוי', '❌'] };

  function prevSlipOf(period, id) {
    return S.payslips.filter((p) => p.period < period && p.id !== id).sort((a, b) => b.period.localeCompare(a.period))[0];

  function analysisHtml(slip, a) {

      <div class="status-summary"><div class="ok">✅ ${counts.ok}<div class="tiny">תקין</div></div><div class="warn">⚠️ ${counts.warn}<div class="tiny">לבדוק</div></div><div class="bad">❌ ${counts.bad}<div class="tiny">חסר/שגוי</div></div></div>
      ${a.totalMissing > 0 ? `<div class="card tonal"><div class="small">הפרש משוער לטובתך</div><div class="hero-num">${money(a.totalMissing)}</div><div class="tiny">סכום הממצאים המסומנים ❌. בדוק את הפירוט לפני פנייה למעסיק.</div></div>` : counts.bad === 0 ? `<div class="card tonal"><b>${icon('okc', 's')} לא נמצאו חוסרים</b><div class="small">התלוש תואם למשמרות שרשמת${counts.warn ? ', עם כמה נקודות לבדיקה' : ''}.</div></div>` : ''}
      ${a.overridesInPeriod ? `<div class="banner warn">${icon('hand')}<div>${a.overridesInPeriod} משמרות בתקופה כוללות עקיפה ידנית. ממצאים שנובעים מהן מסומנים.</div></div>` : ''}
      <div class="small muted" style="margin:0 4px 10px">תקופה: ⁦${U.fmtDate(a.expected.P.from)}–${U.fmtDate(a.expected.P.to)}⁩ · ${a.expected.shifts.length} משמרות · ${U.hours(a.expected.t.hours)} ש׳</div>
      ${a.findings.slice().sort((x, y) => order[x.status] - order[y.status]).map((f) => `<div class="finding ${f.status}">
        <div class="ft"><span>${STATUS[f.status][2]}</span><span>${esc(f.area)} · ${esc(f.title)}</span>${f.amount > 0 && f.status !== 'ok' ? `<span class="amt">${U.money(f.amount)}</span>` : ''}</div>
        <div class="fd">${esc(f.detail)}</div>
        ${f.fromOverride ? `<div class="fd" style="color:var(--override)">${icon('hand', 's')} ${esc(f.fromOverride)}</div>` : ''}
        ${f.note ? `<div class="fd small">${icon('info', 's')} ${esc(f.note)}</div>` : ''}
        ${f.shifts && f.shifts.length ? `<div style="margin-top:6px">${f.shifts.slice(0, 6).map((id) => { const r = App.result(id); return r ? `<button class="chip" data-act="shift-open" data-id="${id}">${U.fmtDate(r.dateKey, 'short')} · ${U.hm(r.paidMin)}</button>` : ''; }).join(' ')}</div>` : ''}
        <div class="fb">על מה זה מבוסס: ${esc(f.basis)} · <span class="conf ${f.confidence}">${CONF[f.confidence]}</span></div></div>`).join('')}
      ${msg ? `<div class="section-title">${icon('send', 's')} מה לעשות</div><div class="card"><div class="small" style="margin-bottom:8px">הודעה מוכנה למעסיק / משאבי אנוש (אפשר לערוך):</div><textarea class="input" id="ps-msg" rows="10" aria-label="הודעה למעסיק">${esc(msg)}</textarea>
        <div class="btn-row" style="margin-top:8px"><button class="btn tonal" data-copy-msg>${icon('copy')} העתק</button><button class="btn tonal" data-share-msg>${icon('share')} שתף</button></div></div>` : ''}
      ${changes.length ? `<div class="section-title">${icon('alert', 's')} שינויים מהתלוש הקודם</div><div class="card">${changes.map((c) => `<div class="kv"><span>${esc(c.text)}</span></div>`).join('')}</div>` : ''}

  function analysisSheet(slip) {

  async function saveSlip(slip, a) {
    const counts = { ok: 0, warn: 0, bad: 0 };
    a.findings.forEach((f) => counts[f.status]++);
    const rec = {
      id: slip.id, period: slip.period, employerId: S.employers[0].id, fields: slip.fields, other: slip.other,
      text: slip.text, source: slip.source, fileId: slip.fileId || null, fileName: slip.fileName || '',
      summary: { counts, totalMissing: a.totalMissing, gross: slip.fields.gross ? slip.fields.gross.value : null, net: slip.fields.net ? slip.fields.net.value : null },
    };
    const ops = [{ store: 'payslips', put: rec }];
    // open gaps from this slip (replace previous gaps of the same slip)
    S.gaps.filter((g) => g.payslipId === slip.id && g.status === 'open').forEach((g) => ops.push({ store: 'gaps', del: g.id }));
    for (const f of a.findings.filter((x) => x.status === 'bad' && x.amount > 0)) {
      ops.push({ store: 'gaps', put: { id: slip.id + '_' + f.area, payslipId: slip.id, period: slip.period, area: f.area, title: f.title, amount: Math.round(f.amount * 100) / 100, status: 'open' } });
    }
    // did this slip pay back earlier gaps? (a "differences" line close to an open gap)
    const diff = slip.fields.diff ? Math.abs(+slip.fields.diff.value) : 0;
    if (diff > 0) {
      const open = S.gaps.filter((g) => g.status === 'open' && g.period < slip.period);
      const total = open.reduce((s, g) => s + g.amount, 0);
      for (const g of open) {
        if (Math.abs(g.amount - diff) <= g.amount * 0.2 || (open.length > 1 && Math.abs(total - diff) <= total * 0.2)) ops.push({ store: 'gaps', put: Object.assign({}, g, { status: 'maybe', note: `בתלוש ${U.fmtMonth(slip.period)} יש שורת הפרשים של ${U.money(diff)}` }) });
      }
    }
    // notable changes vs previous slip → notifications
    const prev = prevSlipOf(slip.period, slip.id);
    for (const c of Payslip.compareSlips(prev && prev.fields, slip.fields)) {
      ops.push({ store: 'notifications', put: { id: 'pschg-' + slip.period + '-' + c.type, key: 'pschg-' + slip.period + '-' + c.type, type: 'payslipGap', cat: 'money', severity: 'warn', title: 'שינוי בתלוש ' + U.fmtMonth(slip.period), body: c.text, explain: 'השוואה לתלוש הקודם (' + U.fmtMonth(prev.period) + ').', createdAt: Date.now(), read: false } });
    }
    await App.saveOps(ops, 'שמירת תלוש', 'התלוש נשמר בארכיון');
  }

  };

        <div class="list">${gaps.map((g) => `<div class="item" style="cursor:default"><span class="lead" style="background:${g.status === 'maybe' ? 'var(--warn-bg)' : 'var(--bad-bg)'};color:${g.status === 'maybe' ? 'var(--warn)' : 'var(--bad)'}">${icon(g.status === 'maybe' ? 'refresh' : 'xc')}</span>

  async function callClaude(text) {
    if (!navigator.onLine) throw new Error('אין חיבור לאינטרנט');
    const mod = await import(/* webpackIgnore: true */ LIBS.anthropic);
    const Anthropic = mod.default || mod.Anthropic;
    const client = new Anthropic({ apiKey: S.settings.ai.apiKey, dangerouslyAllowBrowser: true });
    const model = S.settings.ai.model || 'claude-opus-5-5';
    const params = {
      model,
      max_tokens: 16000,
      system: Payslip.aiPrompt(),
      messages: [{ role: 'user', content: text }],
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: Payslip.aiSchema() } },
    };
    let res;
    try {
      if (model.startsWith('claude-haiku')) res = await client.messages.create(params); // no server-side fallback for Haiku
      else res = await client.beta.messages.create(Object.assign({ betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default' }, params));
    } catch (err) {
      if (err instanceof Anthropic.AuthenticationError) throw new Error('מפתח ה-API לא תקין (401). בדוק אותו בהגדרות.');
      if (err instanceof Anthropic.PermissionDeniedError) throw new Error('למפתח אין הרשאה למודל הזה (403).');
      if (err instanceof Anthropic.NotFoundError) throw new Error('המודל לא נמצא (404). בחר מודל אחר בהגדרות.');
      if (err instanceof Anthropic.RateLimitError) throw new Error('יותר מדי בקשות (429). נסה שוב בעוד דקה.');
      if (err instanceof Anthropic.APIConnectionError) throw new Error('בעיית תקשורת עם השרת. בדוק את החיבור.');
      if (err instanceof Anthropic.APIError) throw new Error(`שגיאת API ${err.status || ''}: ${err.message}`);
      throw err;
    }
    if (res.stop_reason === 'refusal') throw new Error('הבקשה נדחתה על ידי המודל' + (res.stop_details && res.stop_details.explanation ? ': ' + res.stop_details.explanation : '.'));
    if (res.stop_reason === 'max_tokens') throw new Error('התשובה נקטעה. נסה לקצר את הטקסט.');
    const block = res.content.find((b) => b.type === 'text');
    if (!block) throw new Error('לא התקבלה תשובה');
    return JSON.parse(block.text);
  }
})(typeof window !== 'undefined' ? window : globalThis);

        ${App.multiEmp() ? `<label class="field" style="margin-top:12px"><span class="lbl">מעסיק</span><select class="input" id="re-emp">${S.employers.map((e) => `<option value="${e.id}" ${e.id === d.employerId ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select></label>` : ''}`;
    };
    const read = () => {
      d.name = el.querySelector('#re-name').value.trim().slice(0, 40);
      el.querySelectorAll('[data-rr]').forEach((i) => { const r = d.rates[+i.dataset.rr]; if (r) r.rate = UI.numIn(i); });
      el.querySelectorAll('[data-rf]').forEach((i) => { const r = d.rates[+i.dataset.rf]; if (r) r.from = i.value; });
      const em = el.querySelector('#re-emp'); if (em) d.employerId = em.value;
    };
    // the list may just have changed (a rate removed), so the screen is redrawn from d without reading it again
    const redraw = () => { el.querySelector('.sh-body').innerHTML = body(); };
    UI.openSheet({
      title: orig ? 'עריכת תפקיד' : 'תפקיד חדש', body: body(),
      foot: `${orig ? `<button class="btn danger" data-del style="flex:0 0 auto">${icon('trash')}</button>` : ''}<button class="btn" data-save>${icon('check')} שמור</button>`,
      onMount: (sh) => {
        el = sh;
        sh.addEventListener('click', async (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          if (b.dataset.color) { read(); d.color = b.dataset.color; redraw(); }
          if (b.hasAttribute('data-radd')) { read(); d.rates.push({ from: U.todayKey(), rate: d.rates[d.rates.length - 1].rate }); redraw(); }
          if (b.dataset.rdel) { read(); d.rates.splice(+b.dataset.rdel, 1); redraw(); }
          if (b.hasAttribute('data-save')) {
            read();
            if (!d.name) { UI.invalid('הזן שם'); return; }
            if (d.rates.some((r) => !(r.rate > 0))) { UI.invalid('הזן תעריף לשעה'); return; }
            UI.closeTop();
            await App.saveOps([{ store: 'roles', put: d }], orig ? 'עריכת תפקיד' : 'הוספת תפקיד', 'התפקיד נשמר');

              UI.closeTop();
              await App.saveOps([{ store: 'roles', del: d.id }], 'מחיקת תפקיד', 'התפקיד נמחק');

      },
    });

    /* answers -> what gets saved (a skipped question gets the usual answer) */
    function finalJobs() {

      }
      if (key === 'travel') {
        const el = q('#ob-live-travel');
        if (el) el.innerHTML = A.travel && A.travel !== 'no' ? `${icon('car', 's')} בחודש של 15 ימי עבודה זה עוד <b>${money(finalTravel() * 15)}</b>` : '';
      }
      if (key === 'age') {
        const el = q('#ob-live-age');
        const a = age();
        if (!el) return;
        el.innerHTML = a == null ? '' : `${icon('shield', 's')} ${a < 18 ? `שכר המינימום שלך: <b>${U.money(minWage())}</b> לשעה, ובלי מס בכלל` : `שכר המינימום: <b>${U.money(minWage())}</b> לשעה`}`;

        const el = q('#ob-preview');
        const city = A.city || '';
        if (!el) return;
        if (!city) { el.innerHTML = ''; return; }
        const cfg = Object.assign({}, st.rest, { city, dayRules: [] });
        const w = HebCal.restWindows(today, U.addDays(today, 10), cfg).find((x) => x.end > Date.now());
        el.innerHTML = w ? `${icon('candle', 's')} ${esc(w.label)} הקרובה ב${esc(city)}: נכנסת ${U.HEB_DAYS[U.dow(U.epochKey(w.start))]} ב-${U.epochHM(w.start)}, יוצאת ב-${U.epochHM(w.end)}` : '';
      }
    }
    function draw() {
      const key = STEPS[step];
      const last = key === 'done';
      const qi = step; // questions are steps 1..6
      let foot;
      if (key === 'hi') {
        foot = `<button class="btn big ob-go" data-next>בואו נתחיל</button>
          <button class="btn tonal" data-demo>${icon('flask')} רק להציץ (נתונים לדוגמה)</button>

          <div class="tiny muted ob-consent">בהמשך אתה מאשר את ${App.legalLinks ? App.legalLinks() : 'תנאי השימוש ומדיניות הפרטיות'}.</div>`;
      } else if (last) {
        const ready = !needsLogin() || root.Cloud.sdkReady();

          : `<button class="btn big ob-go" data-save ${saving ? 'disabled' : ''}>${saving ? 'רגע…' : 'כניסה לאפליקציה'}</button>`;
      } else {
        foot = `<button class="btn big ob-go" data-next>${qi === QUESTIONS ? 'סיום' : 'הבא'}</button>`;
      }
      const top = key === 'hi' || last ? '' : `<div class="ob-top">
        <button class="icon-btn" data-back aria-label="הקודם">${icon('right')}</button>
        <div class="ob-dots" role="progressbar" aria-valuemin="1" aria-valuemax="${QUESTIONS}" aria-valuenow="${qi}" aria-label="שאלה ${qi} מתוך ${QUESTIONS}">${Array.from({ length: QUESTIONS }, (_, i) => `<i class="${i + 1 < qi ? 'done' : i + 1 === qi ? 'on' : ''}"></i>`).join('')}</div>

      v.innerHTML = `<div class="wizard ob ob3 step-${key}"><div class="ob-bg" aria-hidden="true"><i></i><i></i><i></i></div>${top}

        <div class="foot col">${foot}</div></div>`;
      live();

      if (city) city.onchange = () => { if (city.value) { A.city = city.value; draw(); } };

    function go(next) {

    // the answers are saved once; the demo button and the last step share that one save
    let saving$ = null;
    const ensureSaved = (withDemo) => saving$ || (saving$ = save(withDemo));
    async function save(withDemo) {
      const jobs = withDemo && !jobValid().length ? Defaults.defaultRoles(emp.id).map((r) => Object.assign(r, { rate: r.rates[0].rate })) : finalJobs();
      emp.travelPerDay = finalTravel();
      const ops = [{ store: 'employers', put: emp }];
      jobs.forEach((j, i) => {
        const rates = j.rates && j.rates.length ? j.rates.slice().sort((a, b) => a.from.localeCompare(b.from)) : [{ from: '2000-01-01', rate: j.rate }];
        rates[rates.length - 1] = Object.assign({}, rates[rates.length - 1], { rate: j.rate });
        ops.push({ store: 'roles', put: { id: j.id || 'r_' + U.uid(), name: j.name, color: j.color || Defaults.ROLE_COLORS[i % Defaults.ROLE_COLORS.length], employerId: emp.id, rates, archived: false } });
      });
      S.roles.filter((r) => !jobs.some((x) => x.id === r.id)).forEach((r) => ops.push({ store: 'roles', del: r.id }));
      st.userName = A.name;
      st.gender = A.gender === 'm' || A.gender === 'f' ? A.gender : '';
      if (st.gender === 'f') st.tax.creditPoints = 2.75; else if (st.gender === 'm') st.tax.creditPoints = 2.25;
      st.birthDate = A.birth || null;
      if (A.city) st.rest.city = A.city;
      st.startDate = A.start || null;
      st.onboarded = true;
      // the answers are in memory either way; a storage hiccup is reported but never blocks the way in
      try {
        await Store.apply(ops, null);
        await Store.setSettings((s) => Object.assign(s, st));
        if (withDemo) await App.demo.load();
      } catch (e) {
        console.warn('saving the setup answers', e);
        Object.assign(S.settings, st);
        UI.toast('לא הצלחנו לשמור בטלפון. התשובות יישמרו בחשבון שלך.');
      }
      saved = true;
      if (S.meta.lastRole == null && jobs[0]) Store.setMeta({ lastRole: jobs[0].id }).catch(() => {});
      return true;
    }
    function enterApp() {
      v.onclick = null;
      v.oninput = null;
      App.blocking = null;
      nav.style.display = '';
      App.go = prevGo;
      if (needsLogin()) return; // still on the save step
      App.firstRun = !demo; // the home screen walks a new user through the first steps
      if (!demo && !S.meta.guide) Store.setMeta({ guide: Date.now() }).catch(() => {});
      App.afterLogin();
      setTimeout(() => App.runInsights(), 500);
    }
    function finishStep(redirect) {
      if (saving) return;
      const Cloud = root.Cloud;
      if (needsLogin()) {
        // open the Google window first, inside this tap (the browser blocks it after any waiting); save meanwhile
        let p;
        try { p = Cloud.signIn(redirect ? { redirect: true } : null); } catch (e) { p = Promise.reject(e); }
        p.catch(() => {}); // handled below, after the answers are saved
        saving = true; msg = ''; blocked = false; draw();
        ensureSaved(false).then(() => p).then(async (user) => {
          if (!user) return; // full-page sign-in: the page comes back signed in and finishes there
          await Cloud.connect(user);
          UI.toast('מחובר כ-' + (user.displayName || user.email));
          saving = false;
          enterApp();
        }).catch((e) => {
          console.warn('sign-in', e);
          saving = false;
          blocked = e && e.code === 'auth/popup-blocked';
          msg = blocked ? 'הדפדפן חסם את חלון ההתחברות של Google. לחצו שוב על הכפתור 👇' : Cloud.errorText(e);
          draw();
        });
        return;
      }
      saving = true; draw();
      ensureSaved(false).then(async () => {
        // signed in already (back from Google, or from Settings): make sure the account is connected
        if (Cloud && Cloud.user && !Cloud.connected && !App.localOnly) { try { await Cloud.connect(Cloud.user); } catch (e) { console.warn(e); } }
        saving = false;
        enterApp();
      });
    }
    v.onclick = async (e) => {
      const b = e.target.closest('button, a');
      if (!b || b.disabled) return;
      if (b.dataset.legal) return; // the terms links open their own sheet
      if (b.hasAttribute('data-next')) {
        if (step === 0 && App.acceptLegal) App.acceptLegal().catch((x) => console.warn(x)); // never waits: the next screen comes first
        go(step + 1);
      } else if (b.hasAttribute('data-back')) go(step - 1);
      else if (b.hasAttribute('data-skip')) {
        // a skipped question keeps the usual answer
        const key = STEPS[step];
        if (key === 'job') { A.jobs.forEach((j) => { j.name = ''; j.rate = ''; }); v.querySelectorAll('[data-jn], [data-jr]').forEach((i) => { i.value = ''; }); }
        if (key === 'travel' && !A.travel) A.travel = 'idk';

      } else if (b.hasAttribute('data-demo')) {
        if (App.acceptLegal) App.acceptLegal().catch((x) => console.warn(x));

        go(STEPS.length - 1);
        await ensureSaved(true);

      } else if (b.hasAttribute('data-have')) {

        v.onclick = null; v.oninput = null; App.go = prevGo;
        App.blocking = null;
        App.showLogin();
      } else if (b.hasAttribute('data-save')) finishStep(false);

      else if (b.hasAttribute('data-later')) { App.localOnly = true; finishStep(false); }
      else if (b.dataset.gender) {

        v.querySelectorAll('[data-gender]').forEach((x) => x.classList.toggle('on', x === b));
        if (fx) fx.play('on');
        if (v.querySelector('#ob-name').value.trim()) autoNext();
      } else if (b.dataset.adult) { A.adult = true; A.birth = ''; const bi = v.querySelector('#ob-birth'); if (bi) bi.value = ''; b.classList.add('on'); if (fx) fx.play('on'); autoNext(); }

          <div class="tiny muted" style="margin-bottom:10px">יוצרים מפתח באתר console.anthropic.com ‹ API Keys.</div>
          <button class="btn block" data-save-key>${icon('check')} שמור והתחל</button></div>
          ${legalNote()}`;
      }
      const msgs = chat();
      return `<div class="chat-consent">${icon('shield', 's')}<div>השאלות נשלחות ל-Anthropic לעיבוד. <label class="chat-share"><input type="checkbox" id="as-share" ${shareData() ? 'checked' : ''}> לצרף סיכום מספרי מהאפליקציה (תעריפים, שעות, סכומים, יתרות — בלי שם או פרטים מזהים)</label></div></div>
        ${msgs.length ? '' : `<div class="chat-empty"><div class="chat-hello">שלום! במה אפשר לעזור?</div><div class="chips chat-sugg">${SUGGESTIONS.map((q) => `<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`}
        <div class="chat-log" id="as-log">${msgs.map((m) => `<div class="msg ${m.role}">${m.role === 'user' ? esc(m.text) : render(m.text)}</div>`).join('')}</div>
        ${legalNote()}`;
    }
    const legalNote = () => `<div class="tiny muted chat-legal">התשובות נוצרות אוטומטית, עלולות לכלול טעויות ואינן ייעוץ משפטי, חשבונאי או מס. <a href="#" data-legal="disclaimer">הבהרה משפטית</a></div>`;
    function foot() {
      return S.settings.ai.apiKey ? `<textarea class="input chat-input" id="as-input" rows="1" placeholder="כתוב שאלה…"></textarea><button class="icon-btn chat-send" data-send aria-label="שלח">${icon('send')}</button>` : '';
    }
    function redraw() {
      sheetEl.querySelector('.sh-body').innerHTML = body();
      const f = sheetEl.querySelector('.sh-foot');
      if (f) f.innerHTML = foot();
      scrollDown();
    }
    function scrollDown() { const b = sheetEl.querySelector('.sh-body'); b.scrollTop = b.scrollHeight; }

    async function send(text) {
      text = (text || '').trim();
      if (!text || busy) return;
      if (!navigator.onLine) { UI.toast('אין חיבור לאינטרנט'); return; }
      busy = true;
      const history = chat().concat([{ role: 'user', text }]);
      await Store.setMeta({ chat: history.slice(-MAX_HISTORY) });
      redraw();
      const log = sheetEl.querySelector('#as-log');
      const bubble = document.createElement('div');
      bubble.className = 'msg assistant typing';
      bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      log.appendChild(bubble);
      scrollDown();
      let acc = '';
      let t = null;
      let Anthropic = null;
      try {
        const mod = await import(/* webpackIgnore: true */ SDK);
        Anthropic = mod.default || mod.Anthropic;
        const client = new Anthropic({ apiKey: S.settings.ai.apiKey, dangerouslyAllowBrowser: true });
        const model = S.settings.ai.model || 'claude-opus-5-5';
        const system = [{ type: 'text', text: SYSTEM, cache_control: { type: 'ephemeral' } }];
        if (shareData()) system.push({ type: 'text', text: 'נתוני המשתמש מהאפליקציה (JSON, סכומים בש"ח):\n' + JSON.stringify(App.assistantContext()) });
        // failed exchanges (an error reply and the question before it) are not sent back
        const ok = history.slice(-MAX_HISTORY).filter((m, i, a) => !m.error && !(m.role === 'user' && a[i + 1] && a[i + 1].error));
        while (ok.length && ok[0].role !== 'user') ok.shift();
        const messages = ok.map((m) => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
        const params = { model, max_tokens: 16000, system, messages, output_config: { effort: 'medium' } };
        const stream = model.startsWith('claude-haiku')
          ? client.messages.stream(params) // no server-side fallback for Haiku
          : client.beta.messages.stream(Object.assign({ betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default' }, params));
        stream.on('text', (d) => {
          acc += d;
          if (!t) t = setTimeout(() => { t = null; bubble.classList.remove('typing'); bubble.innerHTML = render(acc); scrollDown(); }, 60);
        });
        const final = await stream.finalMessage();
        if (final.stop_reason === 'refusal') acc = acc || 'לא אוכל לענות על השאלה הזו. אפשר לשאול על זכויות בעבודה, שכר או האפליקציה.';
        if (!acc) acc = 'לא התקבלה תשובה. נסה לנסח מחדש.';
        await Store.setMeta({ chat: chat().concat([{ role: 'assistant', text: acc }]).slice(-MAX_HISTORY) });
      } catch (err) {
        console.error(err);
        let msg = 'משהו השתבש. נסה שוב בעוד רגע.';
        if (!Anthropic) msg = 'לא ניתן לטעון את רכיב ה-AI. בדוק את החיבור לאינטרנט.';
        else if (err instanceof Anthropic.AuthenticationError) msg = 'מפתח ה-API לא תקין. אפשר לעדכן אותו בהגדרות › מפתח AI.';
        else if (err instanceof Anthropic.PermissionDeniedError) msg = 'למפתח אין הרשאה למודל שנבחר. אפשר לבחור מודל אחר בהגדרות › מפתח AI.';
        else if (err instanceof Anthropic.NotFoundError) msg = 'המודל שנבחר לא זמין. בחר מודל אחר בהגדרות › מפתח AI.';
        else if (err instanceof Anthropic.RateLimitError) msg = 'יותר מדי בקשות כרגע. נסה שוב בעוד דקה.';
        else if (err instanceof Anthropic.APIConnectionError) msg = 'בעיית תקשורת. בדוק את החיבור לאינטרנט.';
        else if (err instanceof Anthropic.APIError && (err.status === 402 || err.type === 'billing_error')) msg = 'נגמרה היתרה בחשבון ה-API שלך אצל Anthropic.';
        else if (err instanceof Anthropic.APIError) msg = 'שגיאה מהשרת (' + (err.status || '') + '). נסה שוב בעוד רגע.';
        bubble.classList.add('error');
        acc = acc ? acc + '\n\n(התשובה נקטעה)' : msg;
        await Store.setMeta({ chat: chat().concat([{ role: 'assistant', text: acc, error: true }]).slice(-MAX_HISTORY) });
      } finally {
        clearTimeout(t);
        busy = false;
        if (sheetEl.isConnected) redraw();
      }
    }

    UI.openSheet({
      title: 'עוזר זכויות ושכר', full: true, cls: 'chat-sheet', body: body(), foot: foot() || ' ',
      onMount: (el) => {
        sheetEl = el;
        scrollDown();
        el.addEventListener('click', async (e) => {
          const b = e.target.closest('button,a,input');
          if (!b) return;
          if (b.dataset.q) send(b.dataset.q);
          if (b.hasAttribute('data-send')) { const i = el.querySelector('#as-input'); const v = i.value; i.value = ''; send(v); }
          if (b.hasAttribute('data-save-key')) {
            const k = el.querySelector('#as-key').value.trim();
            if (!/^sk-ant-/.test(k)) { UI.toast('המפתח צריך להתחיל ב-sk-ant-'); return; }
            await Store.setSettings((s) => { s.ai.apiKey = k; });
            redraw();
          }
          if (b.dataset.legal) { e.preventDefault(); App.sheetsApi.legal(b.dataset.legal); }
          if (b.id === 'as-share') await Store.setMeta({ chatShareData: b.checked });
        });
        el.addEventListener('keydown', (e) => {
          if (e.target.id === 'as-input' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const v = e.target.value; e.target.value = ''; send(v); }
        });
        el.addEventListener('input', (e) => { if (e.target.id === 'as-input') { e.target.style.height = 'auto'; e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px'; } });
        const head = el.querySelector('.sh-head');
        const clear = document.createElement('button');
        clear.className = 'icon-btn'; clear.setAttribute('aria-label', 'שיחה חדשה'); clear.innerHTML = icon('refresh');
        clear.onclick = async () => { if (!chat().length) return; if (await UI.confirm('להתחיל שיחה חדשה?', 'השיחה הנוכחית תימחק מהטלפון.', 'שיחה חדשה')) { await Store.setMeta({ chat: [] }); redraw(); } };
        head.insertBefore(clear, head.querySelector('[data-close]'));
      },
    });
  }
})(typeof window !== 'undefined' ? window : globalThis);

    { id: 'vacation', ic: 'beach', t: 'חופשה שנתית', b: (c) => `<p>מגיעים ימי חופשה בתשלום לפי הוותק והיקף המשרה. אסור לוותר עליהם, וכשעוזבים את העבודה מקבלים פדיון על הימים שלא נוצלו.</p>${c.bal ? `<p>היתרה שלך לפי האפליקציה: <b>${U.num(c.bal.vacationAccrued - c.bal.vacationUsed, 1)}</b> ימים.</p>` : ''}`, l: () => link(KZ('חופשה שנתית לעובדים בשכר שעתי או יומי')) },

    { id: 'pension', ic: 'shield', t: 'פנסיה', b: (c) => `<p>חובה מגיל <b>21 לגבר ו-20 לאישה</b>, אחרי 6 חודשי עבודה (3 חודשים אם כבר יש לך קרן פעילה). ההפרשה: 6% ממך, 6.5% מהמעסיק ועוד 6% לפיצויים.</p><p>${c.pension}</p>`, l: () => link(KZ('חובת ביטוח פנסיוני לעובדים')) },

  async function myTickets() {

      const newest = unread.reduce((m, t) => Math.max(m, t.updated || 0), 0);

        Store.setMeta({ supportTold: newest }).catch(() => {});

  Support.forget = async function () {

      const { fs, db } = await Cloud().sdk();

        const msgs = await fs.getDocs(fs.collection(db, 'tickets', t.id, 'msgs'));
        for (const m of msgs.docs) await fs.deleteDoc(m.ref);

        <input class="input" type="search" id="sp-q" placeholder="חיפוש: משמרת, תלוש, שבת…" aria-label="חיפוש בשאלות נפוצות">

  /* ---------------- a new request ---------------- */
  Support.newTicket = function (preReason) {
    let reason = preReason || '';
    const anon = !signedIn();
    const entry = UI.openSheet({
      title: 'פנייה חדשה', full: true,

    const send = entry.sh.querySelector('[data-sp-send]');
    function draw() {
      box.innerHTML = `${App.mascotSays ? App.mascotSays(reason ? 'think' : 'happy', reason ? 'ספרו לנו בכמה מילים 👇' : 'על מה הפנייה?', { size: 64 }) : ''}
        <div class="sp-reasons">${REASONS.map(([k, ic, tint, l]) => `<button class="sp-r ${k === reason ? 'on' : ''}" data-r="${k}">${UI.tile(ic, tint)}<span>${esc(l)}</span></button>`).join('')}</div>

      const t = box.querySelector('#sp-text');
      const m = box.querySelector('#sp-mail');

    };
    const check = () => { send.disabled = !val().ok; };
    box.addEventListener('click', (e) => {
      const b = e.target.closest('[data-r]');

      draw();
      if (typed) box.querySelector('#sp-text').value = typed;
      if (Fx()) Fx().play('on');
      setTimeout(() => { const t = box.querySelector('#sp-text'); if (t) t.focus(); }, 60);

      const v = val();

      const recent = (S.meta.ticketTimes || []).filter((t) => Date.now() - t < 24 * 3600000);

    const body = entry.sh.querySelector('.sh-body');
    let t = null;
    const { fs, db } = await Cloud().sdk();
    const ref = fs.doc(db, 'tickets', tid);
    async function load() {
      const snap = await fs.getDoc(ref);
      if (!snap.exists()) { body.innerHTML = '<div class="small muted">הפנייה לא נמצאה.</div>'; return; }
      t = snap.data();
      const msgs = (await fs.getDocs(fs.collection(db, 'tickets', tid, 'msgs'))).docs.map((d) => d.data()).sort((a, b) => a.t - b.t);
      const label = reasonOf(t.reason)[3];

      if (!asAdmin && t.last === 'admin' && !t.seen) {
        fs.updateDoc(ref, { seen: true }).catch(() => {});

    // a finger that moves is swiping, not holding
    el.addEventListener('pointermove', (e) => { if (!held && (Math.abs(e.clientX - x0) > 12 || Math.abs(e.clientY - y0) > 12)) clearTimeout(holdT); });
    el.addEventListener('pointercancel', () => { clearTimeout(holdT); el.classList.remove('paused'); });
    el.addEventListener('pointerup', (e) => {
      clearTimeout(holdT);
      el.classList.remove('paused');
      if (e.target.closest('button')) return;
      if (held) { held = false; return; } // it was a hold: just carry on
      const dx = e.clientX - x0, dy = e.clientY - y0;
      if (dy > 90 && dy > Math.abs(dx)) { close(); return; } // swipe down closes
      if (Math.abs(dx) > 40) { if (dx < 0) next(); else prev(); return; }
      if (e.clientX > innerWidth * 0.66) prev(); else next();
    });
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.hasAttribute('data-st-close')) close();
      else if (b.hasAttribute('data-st-share')) shareImage(data);
    });
    show(0);
    return { el, close };
  }

      if (document.fonts && document.fonts.ready) await document.fonts.ready;

      g.beginPath(); g.arc(W * 0.85, H * 0.12, 260, 0, Math.PI * 2); g.fill();

      if (s.best) rows.push(`🏆 היום הכי רווחי: ${money0(s.best.amount)}`);
      if (s.extras) rows.push(`⭐ תוספות: ${money0(s.extras.amount)}`);

      g.font = F(600, 54);
      rows.forEach((t, k) => {

        const rw = 880, rh = 88, rx = (W - rw) / 2;

        g.fillStyle = '#fff'; g.fillText(t, W / 2, y);

      g.font = F(600, 44); g.globalAlpha = 0.8; g.fillText('Shaati · שעתי', W / 2, H - 80); g.globalAlpha = 1;
      const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
      if (!blob) throw new Error('no image');
      await UI.shareFile(`shaati-${data.key}.png`, blob, 'הסיכום החודשי שלי');
    } catch (e) {
      console.warn('recap image', e);
      UI.toast('לא הצלחנו ליצור תמונה');
    }
  }

  function kpi(label, value, sub) {

  }
  function barList(entries, total) {
    return entries.map(([label, n]) => `<div class="adm-bar"><span class="nm">${esc(label)}</span><span class="track"><i style="width:${pct(n, total)}%"></i></span><span class="vv">${n} · ${pct(n, total)}%</span></div>`).join('');

    const a1 = activeIn(1), a7 = activeIn(7), a30 = activeIn(30);
    const new7 = rows.filter((r) => r.first >= since(7)).length;
    const new30 = rows.filter((r) => r.first >= since(30)).length;
    const days = Array.from({ length: 30 }, (_, i) => U.addDays(k, i - 29));
    const byFirst = new Map(days.map((d) => [d, 0]));
    rows.forEach((r) => { if (byFirst.has(r.first)) byFirst.set(r.first, byFirst.get(r.first) + 1); });
    const returning = rows.filter((r) => (r.days || 0) >= 3).length;
    const loyal = rows.filter((r) => (r.days || 0) >= 10).length;
    const count = (key) => { const m = new Map(); rows.forEach((r) => m.set(r[key] || '?', (m.get(r[key] || '?') || 0) + 1)); return [...m].sort((a, b) => b[1] - a[1]); };
    const PL = { android: 'אפליקציית אנדרואיד', pwa: 'מותקן מהדפדפן', web: 'דפדפן', '?': 'לא ידוע' };
    const AG = { u18: 'מתחת ל-18', '18p': '18 ומעלה', '?': 'לא הוזן' };
    const sum = (key) => rows.reduce((s, r) => s + (+r[key] || 0), 0);

  const MAX = 150; // the indicator never moves further than this
  const RESIST = 190; // higher = lighter pull
  const REST = 62; // where the page waits while refreshing
  const SLOP = 10; // finger movement that still counts as a tap
  const FOLLOW = 0.62; // how far the page moves compared with the indicator
  const LOGO = '<svg viewBox="0 0 1024 1024" aria-hidden="true"><path class="g" pathLength="1" d="M300 660 A258 258 0 0 1 603 271 L603 600"/><path class="y" pathLength="1" d="M420 422 L420 753 A258 258 0 0 0 720 362"/></svg>';
  const ind = document.createElement('div');
  ind.className = 'ptr';
  ind.setAttribute('aria-hidden', 'true');
  ind.innerHTML = `<div class="ptr-disc">${LOGO}<span class="ptr-check">✓</span></div>`;
  document.body.appendChild(ind);
  const disc = ind.firstChild;
  const view = () => document.getElementById('view');

  let x0 = 0, y0 = null, t0 = 0, pulling = false, dist = 0, armed = false, busy = false, raf = 0, settleTimer = 0;
  const blocked = (target) => busy || App.blocking || root.scrollY > 0
    || document.querySelector('.sheet, .dialog, #intro, #lock, .coach')
    || (target.closest && target.closest('input, textarea, select, .chart, [data-no-ptr]'));
  const resist = (dy) => MAX * (1 - Math.exp(-dy / RESIST));

  function paint(d) {
    const p = Math.min(1, d / THRESHOLD);
    ind.style.transform = `translate3d(-50%, ${(d - 56).toFixed(1)}px, 0)`;
    ind.style.opacity = d > 0 ? Math.min(1, d / 30).toFixed(2) : '0';
    if (!ind.classList.contains('spin') && !ind.classList.contains('done')) disc.style.transform = `rotate(${Math.round(d * 2.6)}deg) scale(${(0.6 + 0.4 * p).toFixed(3)})`;
    disc.style.setProperty('--p', p.toFixed(3));
    const v = view();
    if (v) v.style.transform = d > 0.5 ? `translate3d(0, ${(d * FOLLOW).toFixed(1)}px, 0)` : '';
  }
  const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(dist); }); };
  /** Animate to a distance with a little spring at the end. */
  function springTo(d, ms) {
    ms = ms || 420;
    clearTimeout(settleTimer);
    cancelAnimationFrame(raf); raf = 0;
    const v = view();
    ind.classList.add('settle');
    if (v) v.style.transition = `transform ${ms}ms cubic-bezier(.22, 1.3, .36, 1)`;
    dist = d;
    paint(d);
    return new Promise((r) => {
      settleTimer = setTimeout(() => {
        ind.classList.remove('settle');
        if (v) { v.style.transition = ''; if (!d) { v.style.willChange = ''; v.style.transform = ''; } }
        r();
      }, ms + 20);
    });
  }
  // a pull that began on a button must not press it when the finger lifts
  function swallowNextClick() {
    const kill = (e) => { e.stopPropagation(); e.preventDefault(); };
    root.addEventListener('click', kill, true);
    setTimeout(() => root.removeEventListener('click', kill, true), 450);
  }

  let tgt = null;
  function unbind() {
    if (!tgt) return;
    tgt.removeEventListener('touchmove', move);
    tgt.removeEventListener('touchend', end);
    tgt.removeEventListener('touchcancel', cancel);
    tgt = null;
  }
  document.addEventListener('touchstart', (e) => {
    if (pulling) cancel();
    if (e.touches.length !== 1 || blocked(e.target) || !(e.target.closest && e.target.closest('#view'))) { y0 = null; return; }
    y0 = e.touches[0].clientY;
    x0 = e.touches[0].clientX;
    t0 = e.timeStamp;
    pulling = false; dist = 0; armed = false;
    unbind();
    tgt = e.target;
    tgt.addEventListener('touchmove', move, { passive: true });
    tgt.addEventListener('touchend', end, { passive: true });
    tgt.addEventListener('touchcancel', cancel, { passive: true });
  }, { passive: true });

  function move(e) {
    if (y0 == null || e.timeStamp < t0) return; // a late event from the previous gesture
    if (e.touches.length !== 1) { cancel(); return; } // a second finger: not a pull any more
    const dy = e.touches[0].clientY - y0;
    const dx = e.touches[0].clientX - x0;
    if (!pulling) {
      // a sideways swipe, a scroll up, or a page that has scrolled: not a pull
      if (root.scrollY > 0 || dy < -SLOP || (Math.abs(dx) > SLOP && Math.abs(dx) > Math.abs(dy))) { y0 = null; return; }
      if (dy < SLOP) return;
      pulling = true;
      clearTimeout(settleTimer);
      const v = view();
      if (v) { v.style.transition = ''; v.style.willChange = 'transform'; }
      ind.classList.remove('settle', 'done', 'spin', 'armed');
    }
    dist = Math.max(0, resist(dy - SLOP));
    if (dist >= THRESHOLD && !armed) { armed = true; ind.classList.add('armed'); Fx.haptic(12); Fx.play('tick'); }
    else if (dist < THRESHOLD - 6 && armed) { armed = false; ind.classList.remove('armed'); }
    schedule();
  }

  function cancel() {
    unbind();
    y0 = null;
    if (!pulling) return;
    pulling = false; armed = false;
    ind.classList.remove('armed');
    swallowNextClick();
    springTo(0, 320);
  }

  async function end() {
    unbind();
    if (y0 == null) return;
    y0 = null;
    if (!pulling) return;
    pulling = false;
    swallowNextClick();
    if (!armed) { await springTo(0, 360); return; }
    busy = true;
    try {
      ind.classList.remove('armed');
      ind.classList.add('spin');
      await springTo(REST, 380);
      const t0 = Date.now();
      try { await App.refresh(); } catch (e) { console.warn('refresh', e); }
      const left = 650 - (Date.now() - t0);
      if (left > 0) await Fx.sleep(left);
      ind.classList.remove('spin');
      ind.classList.add('done');
      Fx.play('pop'); Fx.haptic(10);
      await Fx.sleep(420);
      await springTo(0, 420);
    } finally {
      ind.classList.remove('done', 'spin', 'armed');
      busy = false;
    }
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
