    return { P, t, pay, hrs, shifts, net, avgRate: t.hours ? t.wage / t.hours : 0, baseRate: hrs.base ? pay.base / hrs.base : 0 };
  }

  /**
   * Compare a verified payslip to the recorded shifts.
   * slip = { period:'YYYY-MM', fields:{...}, other:[{line,value,guess}] }
   */
  function analyze(slip, model) {
    const S = model.ctx.settings;
    const F = slip.fields || {};
    const E = expected(model, slip.period, false);
    const A = expected(model, slip.period, true);
    const overridesInPeriod = E.shifts.filter((r) => r.overridden || r.dayRuleHit);
    const hasOv = overridesInPeriod.length > 0;
    const findings = [];
    let fid = 0;
    const add = (o) => findings.push(Object.assign({ id: 'f' + (++fid), amount: 0, shifts: [], confidence: 'medium', fromOverride: null }, o));
    const ovNote = (appVal, autoVal, slipVal, tol) => {
      if (!hasOv || Math.abs(appVal - autoVal) < tol) return null;
      if (slipVal != null && Math.abs(slipVal - autoVal) <= Math.abs(slipVal - appVal)) {
        return `הפער נובע כנראה מעקיפה ידנית שהזנת ב-${overridesInPeriod.length} משמרות: בלי העקיפה האפליקציה הייתה מחשבת ${U.num(autoVal, 2)} — קרוב למה שבתלוש.`;
      }
      return `שים לב: ${overridesInPeriod.length} משמרות בתקופה כוללות עקיפה ידנית (חישוב אוטומטי: ${U.num(autoVal, 2)}).`;
    };
    const dates = (rs) => rs.map((r) => U.fmtDate(r.dateKey, 'short')).join(', ');

    /* 1. total hours */
    let covered = []; // shifts already identified as unpaid — excluded from the OT / rest checks to avoid double counting
    const slipHours = HOUR_FIELDS.reduce((s, k) => s + (qty(F, k) || 0), 0) || val(F, 'workHours');
    const appHours = E.t.hours;
    if (slipHours == null || slipHours === 0) {
      add({ area: 'שעות', status: 'warn', title: 'לא זוהו שעות בתלוש', detail: `באפליקציה רשומות ${U.hours(appHours)} שעות לתקופה. אם התלוש מציג שעות, הוסף אותן במסך האימות כדי לבדוק התאמה.`, basis: 'אין כמות שעות בשורות התלוש שזוהו.', confidence: 'low' });
    } else {
      const diff = appHours - slipHours;
      if (diff > 0.25) {
        // try to name the missing shift(s)
        // which shift(s) are probably missing? 1) the last shifts of the period (cut-off), 2) a single shift of that length
        let suspects = [], how = '', conf = 'medium';
        let acc = 0; const tail = [];
        for (let i = E.shifts.length - 1; i >= 0 && acc < diff - 0.3; i--) { acc += E.shifts[i].paidHours; tail.unshift(E.shifts[i]); }
        if (tail.length && Math.abs(acc - diff) <= 0.3) {
          suspects = tail; conf = 'high';
          how = tail.length > 1 ? 'המשמרות האחרונות בתקופה — ייתכן שנכנסו לתלוש הבא' : 'המשמרת האחרונה בתקופה — ייתכן שנכנסה לתלוש הבא';
        } else {
          const same = E.shifts.filter((r) => Math.abs(r.paidHours - diff) <= 0.3);
          if (same.length === 1) { suspects = same; how = 'משמרת באורך השעות החסרות'; conf = 'high'; }
          else if (same.length > 1) { suspects = same; how = 'אחת מהמשמרות באורך הזה'; }
        }
        if (conf === 'high') covered = suspects;
        const exact = conf === 'high' ? suspects.reduce((x, r) => x + r.wage, 0) : 0;
        const amount = exact || diff * E.avgRate;
        add({ area: 'שעות', status: 'bad', title: 'שעות שלא שולמו', amount, shifts: suspects.map((r) => r.id),
          detail: `רשמת ${U.hours(appHours)} שעות, בתלוש ${U.hours(slipHours)}. חסרות ${U.hours(diff)} שעות` + (suspects.length ? ` (${how}: ${dates(suspects)})` : '') + (exact ? `. השכר על ${suspects.length > 1 ? 'המשמרות האלה' : 'המשמרת הזו'} לפי החישוב: ${U.money(amount)} (כולל תוספות).` : `. לפי שכר ממוצע של ${U.money(E.avgRate)} לשעה ≈ ${U.money(amount)}.`),
          basis: 'השוואת סך השעות בתלוש לשעות ששולמו לפי המשמרות שרשמת לתקופה ' + '⁦' + U.fmtDate(E.P.from, 'short') + '–' + U.fmtDate(E.P.to, 'short') + '⁩.',
          confidence: conf, fromOverride: ovNote(appHours, A.t.hours, slipHours, 0.1) });
      } else if (diff < -0.25) {
        add({ area: 'שעות', status: 'warn', title: 'בתלוש יש יותר שעות ממה שרשמת', detail: `בתלוש ${U.hours(slipHours)} שעות, באפליקציה ${U.hours(appHours)}. אולי שכחת לרשום משמרת?`, basis: 'השוואת סך השעות.', confidence: 'medium' });
      } else {
        add({ area: 'שעות', status: 'ok', title: 'סך השעות תואם', detail: `${U.hours(slipHours)} שעות בתלוש מול ${U.hours(appHours)} באפליקציה.`, basis: 'השוואת סך השעות.', confidence: 'high' });
      }
    }

    /* 2. hourly base rate */
    const bq = qty(F, 'base'), bv = val(F, 'base');
    if (bq && bv && E.hrs.base > 0) {
      const slipRate = F.base.rate || bv / bq;
      // rates actually used in the period (per role, by date)
      const rates = [];
      for (const r of E.shifts) for (const l of r.lines) if (!l.rest && l.tier === 0) rates.push(l.rate);
      const minRate = rates.length ? Math.min(...rates) : E.baseRate;
      const maxRate = rates.length ? Math.max(...rates) : E.baseRate;
      const mixed = maxRate - minRate > 0.01;
      if (slipRate < minRate - 0.02) {
        // below even the lowest agreed rate → certainly underpaid on every regular hour
        const amount = (E.baseRate - slipRate) * bq;
        add({ area: 'תעריף', status: 'bad', title: 'תעריף לשעה נמוך מהמוסכם', amount,
          detail: `בתלוש ${U.money(slipRate)} לשעה, ${mixed ? `נמוך מהתעריף הנמוך ביותר שלך בתקופה (${U.money(minRate)})` : `התעריף שהגדרת ${U.money(minRate)}`}. על ${U.hours(bq)} שעות רגילות ≈ ${U.money(amount)}.`,
          basis: 'שכר יסוד ÷ שעות רגילות בתלוש, מול התעריף לפי תאריך המשמרת (כולל היסטוריית תעריפים).',
          confidence: mixed ? 'medium' : 'high', fromOverride: ovNote(E.baseRate, A.baseRate, slipRate, 0.01) });
      } else if (mixed && slipRate < E.baseRate - 0.02 && Math.abs(bq - E.hrs.base) <= 0.25) {
        add({ area: 'תעריף', status: 'warn', title: 'תעריף ממוצע נמוך מהצפוי', amount: (E.baseRate - slipRate) * bq,
          detail: `בתלוש ${U.money(slipRate)} לשעה בממוצע; לפי המשמרות שרשמת הממוצע המשוקלל ${U.money(E.baseRate)} (תעריפים ⁦${U.money(minRate)}–${U.money(maxRate)}⁩). ייתכן שחלק מהשעות שולמו בתעריף של תפקיד זול יותר — או שחסרות שעות בתפקיד היקר.`,
          basis: 'השוואת ממוצע משוקלל; תלוי בתמהיל התפקידים.', confidence: 'low' });
      } else {
        add({ area: 'תעריף', status: 'ok', title: 'התעריף לשעה תקין', detail: `${U.money(slipRate)} לשעה בתלוש (באפליקציה: ${mixed ? '⁦' + U.money(minRate) + '–' + U.money(maxRate) + '⁩' : U.money(E.baseRate)}).` + (mixed && Math.abs(bq - E.hrs.base) > 0.25 ? ' הממוצע לא הושווה כי מספר השעות שונה.' : ''), basis: 'שכר יסוד ÷ שעות רגילות.', confidence: mixed ? 'medium' : 'high' });
      }
    }

    /* 3. Shabbat & holiday */
    const slipRestH = (qty(F, 'rest150') || 0) + (qty(F, 'rest175') || 0) + (qty(F, 'rest200') || 0);
    const slipRestPay = (val(F, 'rest150') || 0) + (val(F, 'rest175') || 0) + (val(F, 'rest200') || 0);
    const covSum = (f) => covered.reduce((x, r) => x + f(r), 0);
    const appRestH = E.t.restHours - covSum((r) => r.restHours);
    if (appRestH > 0.01 || slipRestH > 0 || slipRestPay > 0) {
      const restShifts = E.shifts.filter((r) => r.restHours > 0 && !covered.includes(r));
      if (slipRestH === 0 && slipRestPay === 0 && appRestH > 0.25) {
        const amount = E.t.restPremium;
        add({ area: 'שבת וחג', status: 'bad', title: 'לא שולמה תוספת שבת/חג', amount, shifts: restShifts.map((r) => r.id),
          detail: `רשמת ${U.hours(appRestH)} שעות בשבת/חג (${dates(restShifts)}), ובתלוש לא מופיעה שורת שבת/חג. התוספת (מעבר ל-100%) ≈ ${U.money(amount)}.`,
          basis: 'חלון השבת/חג לפי ' + (S.rest.mode === 'city' ? 'זמני כניסה ויציאה ב' + S.rest.city : 'השעות הקבועות שהגדרת') + ', ' + (model.ctx.primaryEmployer().restPct || 150) + '%.',
          confidence: 'medium', fromOverride: ovNote(appRestH, A.t.restHours, 0, 0.1) });
      } else if (slipRestH > 0 && appRestH - slipRestH > 0.25) {
        const missingH = appRestH - slipRestH;
        const amount = missingH * E.avgRate * ((model.ctx.primaryEmployer().restPct || 150) - 100) / 100;
        add({ area: 'שבת וחג', status: 'bad', title: 'חסרות שעות שבת/חג', amount, shifts: restShifts.map((r) => r.id),
          detail: `באפליקציה ${U.hours(appRestH)} שעות שבת/חג, בתלוש ${U.hours(slipRestH)}. ${U.hours(missingH)} שעות כנראה שולמו כרגילות; התוספת החסרה ≈ ${U.money(amount)}.`,
          basis: 'השוואת שעות 150%/175%/200% בתלוש לשעות בתוך חלון השבת/חג.', confidence: 'medium',
          fromOverride: ovNote(appRestH, A.t.restHours, slipRestH, 0.1) });
      } else if (slipRestH > 0 && slipRestPay > 0) {
        const eff = slipRestPay / slipRestH;
        const exp = E.pay.rest150 + E.pay.rest175 + E.pay.rest200;
        const expRate = appRestH > 0 ? exp / appRestH : 0;
        if (expRate > 0 && eff < expRate * 0.97) {
          const amount = (expRate - eff) * slipRestH;
          add({ area: 'שבת וחג', status: 'bad', title: 'תעריף שבת/חג נמוך', amount, detail: `בתלוש ${U.money(eff)} לשעת שבת, צפוי ${U.money(expRate)}. ≈ ${U.money(amount)}.`, basis: 'סכום ÷ שעות בשורות השבת/חג.', confidence: 'medium' });
        } else add({ area: 'שבת וחג', status: 'ok', title: 'שעות שבת/חג תקינות', detail: `${U.hours(slipRestH)} שעות בתלוש מול ${U.hours(appRestH)} באפליקציה.`, basis: 'שעות 150%/175%/200%.', confidence: 'medium' });
      } else if (slipRestH > appRestH + 0.25) {
        add({ area: 'שבת וחג', status: 'warn', title: 'בתלוש יותר שעות שבת/חג', detail: `בתלוש ${U.hours(slipRestH)}, באפליקציה ${U.hours(appRestH)}. ייתכן שהמעסיק מגדיר את חלון השבת אחרת — אפשר לכוון בהגדרות › שבת וחגים.`, basis: 'השוואת שעות.', confidence: 'low' });
      } else add({ area: 'שבת וחג', status: 'ok', title: 'שעות שבת/חג תקינות', detail: `${U.hours(slipRestH)} שעות.`, basis: 'השוואת שעות.', confidence: 'medium' });
    }

    /* 4. overtime */
    const slipOt = (qty(F, 'ot125') || 0) + (qty(F, 'ot150') || 0);
    const appOt1 = E.t.hoursBy.ot1 - covSum((r) => r.hoursBy.ot1), appOt2 = E.t.hoursBy.ot2 - covSum((r) => r.hoursBy.ot2);
    const appOt = appOt1 + appOt2;
    if (appOt > 0.25 || slipOt > 0) {
      const otShifts = E.shifts.filter((r) => r.hoursBy.ot1 + r.hoursBy.ot2 > 0 && !covered.includes(r));
      if (appOt - slipOt > 0.25) {
        const missing125 = Math.max(0, appOt1 - (qty(F, 'ot125') || 0));
        const missing150 = Math.max(0, appOt2 - (qty(F, 'ot150') || 0));
        const amount = E.avgRate * (missing125 * 0.25 + missing150 * 0.5);
        add({ area: 'שעות נוספות', status: 'bad', title: 'שעות נוספות חסרות', amount, shifts: otShifts.map((r) => r.id),
          detail: `באפליקציה ${U.hours(appOt1)} ש׳ ב-125% ו-${U.hours(appOt2)} ש׳ ב-150% (${dates(otShifts)})${covered.length ? ', לא כולל המשמרות שחסרות לגמרי' : ''}; בתלוש ${U.hours(qty(F, 'ot125') || 0)} ו-${U.hours(qty(F, 'ot150') || 0)}. התוספת החסרה ≈ ${U.money(amount)}.`,
          basis: 'שעות נוספות יומיות אחרי ' + model.ctx.primaryEmployer().otThreshold + ' שעות (לפי ההגדרות).', confidence: 'medium',
          fromOverride: ovNote(appOt, A.t.hoursBy.ot1 + A.t.hoursBy.ot2, slipOt, 0.1) });
      } else add({ area: 'שעות נוספות', status: 'ok', title: 'שעות נוספות תקינות', detail: `${U.hours(slipOt)} בתלוש מול ${U.hours(appOt)} באפליקציה.`, basis: 'השוואת שעות 125%/150%.', confidence: 'medium' });
    }

    /* 5. travel */
    const slipTravel = val(F, 'travel');
    if (E.t.travel > 0 || slipTravel) {
      const d = E.t.travel - (slipTravel || 0);
      const emp = model.ctx.primaryEmployer();
      const basis = `${E.t.workDays} ימי עבודה × ${U.money(emp.travelPerDay)}` + (+emp.travelMonthlyCap ? `, תקרה ${U.money(emp.travelMonthlyCap)}` : '') + '.';
      if (d > 1) add({ area: 'נסיעות', status: 'bad', title: 'החזר נסיעות חסר', amount: d, detail: `צפוי ${U.money(E.t.travel)}, בתלוש ${U.money(slipTravel || 0)}.` + (val(F, 'workDays') ? ` המעסיק רשם ${val(F, 'workDays')} ימי עבודה.` : ''), basis, confidence: 'high', fromOverride: ovNote(E.t.travel, A.t.travel, slipTravel, 0.5) });
      else if (d < -1) add({ area: 'נסיעות', status: 'warn', title: 'נסיעות גבוהות מהצפוי', detail: `בתלוש ${U.money(slipTravel)}, צפוי ${U.money(E.t.travel)}. אולי התעריף היומי שהגדרת שונה?`, basis, confidence: 'medium' });
      else add({ area: 'נסיעות', status: 'ok', title: 'נסיעות תקינות', detail: U.money(slipTravel || 0), basis, confidence: 'high' });
    }

    /* 6. minimum wage */
    const rateForMin = bq && bv ? (F.base.rate || bv / bq) : E.baseRate;
    if (rateForMin > 0) {
      const MW = Engine.minWageFor(S, (slip.period || U.todayKey().slice(0, 7)) + '-15');
      const mw = MW.hourly;
      if (rateForMin + 0.005 < mw) {
        const h = bq || E.hrs.base;
        add({ area: 'שכר מינימום', status: 'bad', title: 'שכר נמוך משכר המינימום', amount: (mw - rateForMin) * h, detail: `${U.money(rateForMin)} לשעה, שכר המינימום ${U.money(mw)}.`, basis: 'שכר מינימום לשעה כפי שמוגדר בהגדרות (עדכן אם השתנה).', confidence: 'high' });
      } else add({ area: 'שכר מינימום', status: 'ok', title: 'מעל שכר המינימום', detail: `${U.money(rateForMin)} ≥ ${U.money(mw)} לשעה.`, basis: MW.custom ? 'שכר מינימום לשעה (מההגדרות).' : `שכר מינימום ${MW.youth ? 'לנוער בגיל ' + MW.age : 'למבוגר'} לפי החוק, מ-${U.fmtDate(MW.from)}.`, confidence: 'high' });
    }

    /* 7. pension */
    const gross = val(F, 'gross');
    // pensionable wage per the settings: "base" = all paid hours × hourly rate; "all" = gross without travel/recuperation
    const slipBaseRate = bq && bv ? (F.base.rate || bv / bq) : 0;
    const pBase = S.pension.base === 'base' && slipBaseRate && slipHours
      ? slipHours * slipBaseRate
      : (gross || E.t.gross) - (slipTravel || 0) - (val(F, 'recuperation') || 0);
    const active = Engine.pensionActive(S, E.P.to);
    const pe = val(F, 'pensionEmployee'), pr = val(F, 'pensionEmployer');
    if (S.pension.enabled) {
      if (active && !pe) {
        const amount = pBase * ((+S.pension.employerPct || 0) + (+S.pension.severancePct || 0)) / 100;
        add({ area: 'פנסיה', status: 'bad', title: 'לא נמצאה הפרשה לפנסיה', amount,
          detail: `לפי תאריך תחילת העבודה (${S.startDate ? U.fmtDate(S.startDate) : '—'}) ההפרשות היו אמורות להתחיל אחרי ${S.pension.startAfterMonths} חודשים. חלק המעסיק (תגמולים + פיצויים) ≈ ${U.money(amount)} בחודש.`,
          basis: 'צו ההרחבה לפנסיה חובה. הסכום הוא כסף שהמעסיק אמור להפקיד לקרן, לא לנטו.', confidence: S.startDate ? 'medium' : 'low',
          note: 'אם הייתה לך קרן פנסיה פעילה לפני כן — ההפרשה אמורה להתחיל כבר אחרי 3 חודשים (ולעיתים רטרואקטיבית). כדאי לוודא מול המעסיק.' });
      } else if (pe) {
        const p = pBase > 0 ? (pe / pBase) * 100 : 0;
        const ok = Math.abs(p - S.pension.employeePct) <= 0.6;
        add({ area: 'פנסיה', status: ok ? 'ok' : 'warn', title: ok ? 'הפרשת עובד לפנסיה תקינה' : 'אחוז הפרשה לפנסיה לא צפוי',
          detail: `${U.money(pe)} = ${U.num(p, 2)}% מ-${U.money(pBase)} (צפוי ~${S.pension.employeePct}%).` + (pr ? ` מעסיק: ${U.money(pr)} (${U.num(pBase ? pr / pBase * 100 : 0, 2)}%).` : ''),
          basis: (S.pension.base === 'base' ? 'הבסיס המשוער: כל השעות × התעריף הבסיסי (בלי תוספות)' : 'הבסיס המשוער: ברוטו פחות נסיעות והבראה') + '. השכר הקובע לפנסיה עשוי להיות שונה לפי ההסכם — אפשר לשנות בהגדרות › נטו משוער.', confidence: 'low' });
        if (pr != null && pBase > 0 && pr / pBase * 100 < (+S.pension.employerPct || 6.5) - 0.6) {
          add({ area: 'פנסיה', status: 'warn', title: 'הפרשת המעסיק נמוכה', amount: pBase * S.pension.employerPct / 100 - pr, detail: `${U.num(pr / pBase * 100, 2)}% במקום ${S.pension.employerPct}%.`, basis: 'צו ההרחבה: לפחות 6.5% תגמולי מעסיק.', confidence: 'low' });
        }
      } else if (!active) {
        const minorP = Engine.isMinor(S, E.P.to);
        add({ area: 'פנסיה', status: 'ok', title: 'פנסיה עוד לא חובה', detail: minorP ? 'מתחת לגיל 18 אין חובת הפרשה לפנסיה.' : `ההפרשות מתחילות אחרי ${S.pension.startAfterMonths} חודשי עבודה.`, basis: 'צו ההרחבה לפנסיה חובה.', confidence: S.startDate ? 'medium' : 'low' });
      }
    }

    /* 8. recuperation */
    const L = Engine.leaveBalances(model, E.P.to);
    if (L.recuperation && L.recuperation.eligible) {
      const rm = +S.leave.recuperationMonth || 0;
      const month = +slip.period.slice(5, 7);
      const rec = val(F, 'recuperation');
      if (rm === 0 || rm === month) {
        const exp = rm === 0 ? L.recuperation.amount / 12 : L.recuperation.amount;
        if (!rec) add({ area: 'הבראה', status: 'warn', title: 'לא נמצאו דמי הבראה', amount: exp, detail: `לפי ותק ${U.num(L.seniorityYears, 1)} שנים והיקף משרה ~${U.num(L.jobPct * 100, 0)}%: ≈ ${U.money(exp)}.`, basis: 'צו ההרחבה לדמי הבראה (מגזר פרטי).', confidence: 'low', note: 'מעסיקים משלמים בחודשים שונים. אם קיבלת בחודש אחר — הכול בסדר.' });
        else add({ area: 'הבראה', status: 'ok', title: 'שולמו דמי הבראה', detail: `${U.money(rec)} (הערכה: ${U.money(exp)}).`, basis: 'צו ההרחבה לדמי הבראה.', confidence: 'low' });
      }
    }

    /* 9. leave balances */
    const vb = val(F, 'vacationBalance');
    if (vb != null) {
      const appV = L.vacationAccrued - L.vacationUsed;
      const ok = Math.abs(appV - vb) <= 1.5;
      add({ area: 'חופשה', status: ok ? 'ok' : 'warn', title: ok ? 'יתרת חופשה סבירה' : 'יתרת חופשה שונה מההערכה', detail: `בתלוש ${U.num(vb, 2)} ימים, הערכה באפליקציה ${U.num(appV, 2)}.`, basis: 'חוק חופשה שנתית, לפי היקף המשרה בפועל. תלוי בהסכם ובצבירה מלפני השימוש באפליקציה.', confidence: 'low' });
    }
    const sb = val(F, 'sickBalance');
    if (sb != null) {
      const appS = L.sickAccrued - L.sickUsed;
      const ok = Math.abs(appS - sb) <= 2;
      add({ area: 'מחלה', status: ok ? 'ok' : 'warn', title: ok ? 'יתרת מחלה סבירה' : 'יתרת מחלה שונה מההערכה', detail: `בתלוש ${U.num(sb, 2)} ימים, הערכה ${U.num(appS, 2)}.`, basis: '1.5 ימים לחודש מלא, יחסית להיקף המשרה.', confidence: 'low' });
    }

    /* 10. credit points */
    const cp = val(F, 'creditPoints');
    if (cp != null) {
      const ok = Math.abs(cp - S.tax.creditPoints) < 0.01;
      add({ area: 'נקודות זיכוי', status: ok ? 'ok' : 'warn', title: ok ? 'נקודות הזיכוי תואמות' : 'נקודות זיכוי שונות', detail: `בתלוש ${cp}, בהגדרות ${S.tax.creditPoints}.` + (ok ? '' : ' אם מגיעות לך יותר — מלא טופס 101 מעודכן.'), basis: 'טופס 101 שמילאת אצל המעסיק.', confidence: 'medium' });
    }

    /* 11-12. tax & social security */
    const minor = Engine.isMinor(S, E.P.to);
    if (minor) {
      const blm = (val(F, 'nationalInsurance') || 0) + (val(F, 'healthTax') || 0);
      const itm = val(F, 'incomeTax') || 0;

  /* ---------------- encoding ---------------- */

      if (Cloud.hasUnsynced() && !(await UI.confirm('החלפת חשבון', `בטלפון יש שינויים של ${prev} שעוד לא עלו לענן. אם תמשיך עם ${user.email || 'החשבון החדש'}, הם יימחקו מהטלפון.`, 'המשך בכל זאת', true))) {

  /* ---------------- live listeners (cloud → phone) ---------------- */

          const id = ch.doc.id;
          const local = S[st].find((x) => x.id === id);
          if (local && (local.updatedAt || 0) >= v.u) continue;

/* ============================================================
 * stats.js — anonymous usage statistics for the admin dashboard.
 *
 * Once a day, a signed-in device writes one small record to
 * stats/{random install id}: app version, platform, first/last day
 * of use, number of active days, shift and payslip counts, an age
 * group (under / over 18) and which features are on. No name, email,
 * user id, dates of shifts or amounts: the record cannot be linked

 * it off deletes the record.

      v: String(root.APP_VERSION || '').slice(0, 20),
      p: platform(),
      first: S.meta.firstActiveDay || k,

      days: Math.min(99999, S.meta.activeDays || 1),
      sh: Math.min(999999, done.length),
      s30: Math.min(99999, done.filter((s) => U.epochKey(s.start) >= from30).length),

        bio: !!S.settings.lock.bioId, dark: S.settings.theme === 'dark', fxOff: !!(S.settings.fx && S.settings.fx.effects === false),

      try { await Cloud.deleteAccountData(); location.reload(); } catch (e) { UI.dialog({ title: 'המחיקה נכשלה', text: Cloud.errorText(e), buttons: [{ label: 'סגור', value: true }] }); }
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* ---- app/views-home.js ---- */
/* ============================================================
 * views-home.js — home dashboard + shared shift list items.
 * ============================================================ */
(function (root) {
  'use strict';
  const { U, Engine, Store, UI, App, HebCal } = root;
  const S = Store.S;
  const { icon, esc, money } = UI;

  /* ---------------- shared fragments ---------------- */
  App.restTag = (r) => (r.restHours > 0.01 ? `<span class="tag rest">${icon('candle')}${esc(r.restLabels[0] || 'שבת/חג')}</span>` : '');
  App.ovTag = (r) => (r.overridden || r.dayRuleHit ? `<span class="tag override" title="עקיפה ידנית">${icon('hand')}ידני</span>` : '');
  App.shiftItem = function (r, opts) {
    opts = opts || {};
    const sh = App.shift(r.id);
    if (!sh) return '';
    const roles = [...new Set(r.segments.map((s) => s.roleId))];
    const role = App.role(roles[0]);
    const title = roles.map(App.roleName).join(' → ');
    const date = opts.noDate ? '' : U.fmtDate(r.dateKey, 'short') + ' · ' + U.HEB_DAYS[U.dow(r.dateKey)] + ' · ';
    const planned = r.status === 'planned' ? '<span class="tag planned">מתוכננת</span>' : '';
    const emp = App.multiEmp() ? ' · ' + esc(App.employer(r.employerId).name) : '';
    return `<button class="item" data-act="shift-open" data-id="${r.id}">
      <span class="role-bar" style="background:${role ? role.color : '#999'}"></span>
      <span class="body"><span class="t">${esc(date)}${esc(title)} ${App.restTag(r)} ${App.ovTag(r)} ${planned}</span>
      <span class="s"><span class="num">⁦${U.epochHM(r.start)}–${U.epochHM(r.rawEnd)}⁩</span> · ${U.hm(r.paidMin)} ש׳${emp}${sh.note ? ' · ' + esc(sh.note) : ''}</span></span>
      <span class="trail"><span class="a">${money(r.total, 0)}</span>${opts.showOk && r.status === 'planned' ? `<br><span class="tag good" data-act="mark-done" data-id="${r.id}">${icon('check')}בוצעה</span>` : ''}</span></button>`;
  };
  App.entryItem = function (e) {
    const v = App.model.entryVals.get(e.id) || { amount: 0, label: '' };
    const map = { vacation: ['beach', 'יום חופשה'], sick: ['thermo', 'יום מחלה'], adjustment: [e.type === 'deduction' ? 'minus' : 'gift', v.label] };
    const [ic, label] = map[e.kind] || ['info', ''];
    const sub = e.kind === 'sick' && v.dayIndex ? `יום ${v.dayIndex} · ${v.pct}%` : e.note || '';
    const sign = e.kind === 'adjustment' && e.type === 'deduction' ? '−' : '';
    return `<button class="item" data-act="entry-open" data-id="${e.id}"><span class="lead" style="background:var(--surface-3)">${icon(ic)}</span>
      <span class="body"><span class="t">${U.fmtDate(e.date, 'short')} · ${esc(label)} ${e.status === 'planned' ? '<span class="tag planned">מתוכנן</span>' : ''}</span><span class="s">${esc(sub)}</span></span>
      <span class="trail"><span class="a">${sign}${money(v.amount, 0)}</span></span></button>`;
  };
  App.severityIcon = { info: 'info', warn: 'alert', critical: 'alert', good: 'okc' };
  App.insightRow = (a, opts) => `<div class="insight sev-${a.severity || 'info'} ${opts && opts.notif ? 'notif' + (a.read ? '' : ' unread') : ''}" ${a.id ? `data-nid="${esc(a.id)}"` : ''}>
    <span class="ic">${icon(App.severityIcon[a.severity] || 'bulb', 's')}</span>
    <div style="flex:1;min-width:0"><div class="t">${esc(a.title)}</div><div class="b">${esc(a.body)}</div>${a.explain ? `<div class="x">${icon('info', 's')} ${esc(a.explain)}</div>` : ''}${opts && opts.notif ? `<div class="when">${UI.timeAgo(a.createdAt)}</div>` : ''}</div></div>`;

  function greeting() {
    const h = new Date().getHours();
    return h < 5 ? 'לילה טוב' : h < 12 ? 'בוקר טוב' : h < 17 ? 'צהריים טובים' : h < 21 ? 'ערב טוב' : 'לילה טוב';
  }

  /* ---------------- home: one number, one action, one highlight ----------------
   * The home screen answers three questions at a glance: how much have I earned this month,
   * what do I do now (start / stop a shift), and is there anything I should know (one line).
   * Everything else is one tap away: the number opens the summary, the line opens insights,
   * the + button holds every kind of entry (and payslips), the ✨ opens the assistant. */

  /* ---------------- action: start, or the running shift ---------------- */
  function actionBlock() {
    const a = S.activeShift;
    if (a) {
      const role = App.role(App.currentRole());
      const onBreak = App.onBreak();
      const others = App.roles(a.employerId).filter((r) => r.id !== App.currentRole());
      return `<div class="card timer-card running"><span class="aurora" aria-hidden="true" style="${App.phase()}"><i></i><i></i><i></i></span>
        <div class="tc-head"><span class="pulse" style="${App.phase()}"></span>${onBreak ? 'בהפסקה' : 'משמרת פעילה'}${role ? ' · ' + esc(role.name) : ''}<span class="spacer"></span><span class="tiny">מ-${U.epochHM(a.start)}</span></div>
        <div class="clock" data-clock="net">0:00:00</div>
        <div class="meta">עד עכשיו <b data-live-pay></b>${(a.breaks || []).length ? ' · הפסקות לא נספרות' : ''}</div>
        <div class="tc-actions">
          <button class="btn big" data-act="timer-stop">${icon('stop')} סיים משמרת</button>
          <button class="icon-btn tonal lg" data-act="timer-break" aria-label="${onBreak ? 'חזור מהפסקה' : 'הפסקה'}">${icon(onBreak ? 'play' : 'coffee')}</button>
          ${others.length ? `<button class="icon-btn tonal lg" data-act="timer-switch" aria-label="החלף תפקיד">${icon('swap')}</button>` : ''}
        </div></div>`;
    }
    const roles = App.roles();
    const sel = S.meta.lastRole && App.role(S.meta.lastRole) ? S.meta.lastRole : roles[0] && roles[0].id;
    const role = App.role(sel);
    return `<div class="home-action">
      <button class="btn big start" style="${App.phase()}" data-act="timer-start" data-role="${sel || ''}">${icon('play')} התחל משמרת</button>
      ${roles.length > 1 && role ? `<button class="role-chip" data-act="choose-role" aria-label="בחר תפקיד"><span class="sw" style="background:${role.color}"></span><span class="rc-n">${esc(role.name)}</span><span class="chev">${icon('left', 's')}</span></button>` : ''}
    </div>`;
  }

  /* ---------------- payday ---------------- */
  function paydayCard() {
    const emp = S.employers[0];
    const today = U.todayKey();
    const P = Engine.periodOf(today, emp);
    const due = [Engine.periodOf(U.addDays(P.from, -1), emp), P].find((x) => x.payDate === today);
    if (!due) return '';
    const sum = Engine.periodSummary(App.model, due.key, emp.id);
    if (!(sum.gross > 0)) return '';
    App.celebrateOnce('payday-' + today, () => root.Fx.celebrate('money'));
    return `<div class="card payday"><div class="pd-title"><span class="pd-emoji" aria-hidden="true">💸</span> היום יום משכורת!</div>
      <div style="margin-top:6px;opacity:.92">על ${esc(due.label)} מגיעים לך כ-<b>${money(sum.net.net, 0)}</b> ${sum.net.minor ? '' : 'נטו '}(${money(sum.gross, 0)} ברוטו). כשהתלוש מגיע, כדאי לבדוק שהוא תואם.</div>
      <button class="btn" data-act="payslip-new">${icon('file')} בדיקת תלוש</button></div>`;
  }

  /* ---------------- the month, in one number ---------------- */
  function hero() {
    const emp = S.employers[0];
    const P = Engine.periodOf(U.todayKey(), emp);
    const sum = Engine.periodSummary(App.model, P.key, emp.id);
    const proj = App.insights && App.insights.projection;
    const goal = +S.settings.goal.amount || 0;
    const goalNet = S.settings.goal.type === 'net';
    const curVal = goalNet ? sum.net.net : sum.gross;
    const pct = goal ? Math.min(100, (curVal / goal) * 100) : 0;
    if (goal && pct >= 100) App.celebrateOnce('goal-' + P.key, () => { root.Fx.celebrate('money'); UI.toast('הגעת ליעד החודשי! 🎯'); });
    const projPct = goal && proj && proj.withPlanned ? Math.min(100, ((goalNet ? proj.withPlanned * (sum.gross ? sum.net.net / sum.gross : 0.85) : proj.withPlanned) / goal) * 100) : 0;
    const periodName = emp.periodStartDay > 1 ? 'תקופת השכר' : esc(P.label);
    // the whole card opens the summary on a tap; keyboards and screen readers get a real button for it
    // (the card itself holds the "what is gross?" buttons, so it can't be one)
    return `<section class="home-hero" data-act="go-summary"><button class="vh" data-act="go-summary">פירוט ${periodName}</button>
      <span class="aurora" aria-hidden="true" style="${App.phase()}"><i></i><i></i><i></i></span><span class="hh-dial" aria-hidden="true" style="${App.phase()}"></span>
      <div class="hh-label">${UI.term ? UI.term('gross', 'ברוטו') : 'ברוטו'} ${emp.periodStartDay > 1 ? 'בתקופת השכר' : 'ב' + periodName} עד עכשיו</div>
      <div class="hero-num">${money(sum.gross, 0)}</div>
      <div class="hh-stats"><span><b>${money(sum.net.net, 0)}</b><small>${UI.term ? UI.term('net', sum.net.minor ? 'נטו' : 'נטו משוער') : 'נטו'}</small></span><span><b class="num">${U.hm(sum.hours * 60)}</b><small>שעות</small></span><span><b>${sum.shifts}</b><small>${sum.shifts === 1 ? 'משמרת' : 'משמרות'}</small></span></div>
      ${goal ? `<div class="hh-goal"><div class="progress thin"><b style="width:${projPct}%"></b><i style="width:${pct}%"></i></div>
        <div class="hh-goal-l">${U.num(pct, 0)}% מיעד ${money(goal, 0)}${proj && proj.pace ? ` · צפי ${money(proj.pace, 0)}` : ''}</div></div>`
        : (proj && proj.pace ? `<div class="hh-goal-l">צפי לסוף ${emp.periodStartDay > 1 ? 'התקופה' : 'החודש'}: ${money(proj.pace, 0)}</div>` : '')}
    </section>`;
  }

  /* ---------------- one line worth knowing (opens everything else) ---------------- */
  function highlight() {
    const now = Date.now();
    const sevOrder = { critical: 0, warn: 1, good: 2, info: 3 };
    const unread = S.notifications.filter((n) => !n.read && n.cat !== 'summary').sort((a, b) => (sevOrder[a.severity] - sevOrder[b.severity]) || b.createdAt - a.createdAt);
    const urgent = unread.filter((n) => n.severity === 'critical' || n.severity === 'warn');
    const next = [...App.model.results.values()].filter((r) => r.status === 'planned' && r.start > now && r.start - now < 36 * 3600000).sort((a, b) => a.start - b.start)[0];
    const weekly = S.notifications.filter((n) => n.type === 'weekly' && !n.read && now - n.createdAt < 4 * U.DAY).sort((a, b) => b.createdAt - a.createdAt)[0];
    const live = App.insights ? App.insights.live.slice().sort((a, b) => b.priority - a.priority) : [];
    let item = null;
    const soon = !S.activeShift && [...App.model.results.values()].filter((r) => r.status === 'planned' && r.start > now - 60 * 60000 && r.start < now + 30 * 60000).sort((a, b) => a.start - b.start)[0];
    if (soon) item = { act: 'start-planned', id: soon.id, ic: 'play', cls: 'go', t: `התחל את המשמרת של ${U.epochHM(soon.start)}` };
    else if (urgent[0]) item = { act: 'insights', ic: 'alert', cls: 'sev-' + urgent[0].severity, t: urgent[0].title };
    else if (next) item = { act: 'shift-open', id: next.id, ic: 'calendar', cls: '', t: `משמרת ${U.epochKey(next.start) === U.todayKey() ? 'היום' : 'מחר'} ב-${U.epochHM(next.start)} · ${App.roleName(next.segments[0].roleId)}` };
    else if (weekly) item = { act: 'insights', ic: 'sparkle', cls: '', t: 'הסיכום השבועי שלך מוכן' };
    else if (unread[0]) item = { act: 'insights', ic: App.severityIcon[unread[0].severity] || 'bulb', cls: 'sev-' + (unread[0].severity || 'info'), t: unread[0].title };
    else if (live[0]) item = { act: 'insights', ic: 'bulb', cls: '', t: live[0].title };
    if (!item) return '';
    const more = item.cls === 'go' ? 0 : Math.max(0, unread.length - (unread.some((n) => n.title === item.t) ? 1 : 0));
    return `<button class="highlight ${item.cls}" data-act="${item.act}"${item.id ? ` data-id="${item.id}"` : ''}>
      <span class="hl-ic">${icon(item.ic, 's')}</span><span class="hl-t">${esc(item.t)}</span>${more ? `<span class="hl-more">+${more}</span>` : ''}${icon('left', 's')}</button>`;
  }

  /* ---------------- saving up for something ---------------- */
  function savingCard() {
    const g = S.settings.saving || {};
    const price = +g.price || 0;
    if (!(price > 0) || !g.name) return '';
    const today = U.todayKey();
    const from = g.from && g.from <= today ? g.from : today;
    const sum = Engine.rangeSummary(App.model, from, today);
    const have = Math.max(0, (sum.net && sum.net.net) || 0);
    const pct = Math.min(100, (have / price) * 100);
    const done = have >= price;
    // hours still needed, at the net per hour of the last three months
    const recent = Engine.rangeSummary(App.model, U.addDays(today, -90), today);
    const role = App.roles()[0];
    const perHour = recent.hours > 0 ? recent.net.net / recent.hours : role ? Engine.roleRate(role, today) : 0;
    const hoursLeft = !done && perHour > 0 ? Math.ceil((price - have) / perHour) : null;
    if (done) App.celebrateOnce('saving-' + g.name + '-' + price, () => { root.Fx.celebrate('money'); UI.toast(`יש לך מספיק בשביל ${g.name}! 🎉`); });
    return `<button class="save-card ${done ? 'done' : ''}" data-act="settings-open" data-k="goal" aria-label="יעד חיסכון: ${esc(g.name)}, ${Math.floor(pct)}%">
      <span class="sv-top"><span class="sv-e" aria-hidden="true">${done ? '🎉' : '🎯'}</span><b>${esc(g.name)}</b><span class="sv-pct">${Math.floor(pct)}%</span></span>
      <span class="progress thin"><i style="width:${pct}%"></i></span>
      <span class="sv-sub">${done ? `יש לך מספיק! הרווחת ${money(have, 0)} מאז שהתחלת לחסוך` : `הרווחת ${money(have, 0)} מתוך ${money(price, 0)}${hoursLeft ? ` · עוד כ-${hoursLeft} שעות עבודה` : ''}`}</span></button>`;
  }

  /* ---------------- four big doors to the things people look for ---------------- */
  function shortcuts() {
    const d = (act, ic, label, tint) => `<button class="sc" data-act="${act}">${UI.tile(ic, tint)}<span>${label}</span></button>`;
    return `<div class="shortcuts">${d('shift-new', 'plus', 'משמרת חדשה', 'violet')}${d('rights', 'shield', 'הזכויות שלי', 'mint')}${d('payslip-new', 'receipt', 'בדיקת תלוש', 'amber')}${d('games', 'game', 'משחקים', 'pink')}</div>`;
  }

  function birthdayCard() {
    const b = S.settings.birthDate;
    if (!b || b.slice(5) !== U.todayKey().slice(5)) return '';
    const age = Engine.ageAt(b, U.todayKey());
    App.celebrateOnce('bday-' + U.todayKey(), () => root.Fx.celebrate('big'));
    return `<div class="card bday"><div class="bday-confetti" aria-hidden="true"></div><div class="bday-title">מזל טוב${S.settings.userName ? ', ' + esc(S.settings.userName) : ''}!</div>
      <div>יום הולדת ${age} שמח 🎂 שתהיה שנה של משמרות טובות, בוסים הוגנים ותלושים בלי הפתעות.</div>${age === 18 ? '<div class="small" style="margin-top:6px">מהיום החישוב כולל ניכויי חובה רגילים.</div>' : ''}</div>`;
  }
  function banners() {
    let h = '';
    if (Store.isMemoryOnly && Store.isMemoryOnly()) h += `<div class="banner slim warn">${icon('alert', 's')}<div style="flex:1">${root.Cloud && root.Cloud.user ? 'הדפדפן לא שומר נתונים בטלפון כרגע. הכול נשמר בחשבון שלך.' : 'הדפדפן לא שומר נתונים בטלפון. התחבר לחשבון כדי לא לאבד אותם.'}</div></div>`;
    if (S.settings.demo) h += `<div class="banner slim">${icon('flask', 's')}<div style="flex:1">מצב הדגמה — נתונים לדוגמה</div><button class="btn text sm" data-act="demo-clear">מחק</button></div>`;
    const B = S.settings.backup;
    const last = Math.max(B.lastBackup || 0);
    if (!S.meta.cloudUid && S.shifts.length > 5 && Date.now() - last > (+S.settings.alerts.backupDays || 30) * U.DAY) {
      h += `<div class="banner slim warn">${icon('cloud', 's')}<div style="flex:1">${last ? 'עבר זמן מאז הגיבוי האחרון' : 'עוד לא גיבית'}</div><button class="btn text sm" data-act="backup-now">גבה</button></div>`;
    }
    const issues = Engine.dataIssues(App.model).filter((i) => i.type === 'overlap');
    if (issues.length) h += `<div class="banner slim warn">${icon('alert', 's')}<div style="flex:1">${esc(issues[0].text)}</div><button class="btn text sm" data-act="shift-open" data-id="${issues[0].ids[1]}">בדוק</button></div>`;
    return h;
  }

  App.views.home = function () {
    if (!S.meta.ms && App.milestones) App.milestones(); // notes where the user is, so the next medal is a real one
    const unread = S.notifications.filter((n) => !n.read && n.cat !== 'summary').length;
    const today = U.todayKey();
    const hd = HebCal.hebrewDate(today);
    const hol = HebCal.holidaysOn(today).map((h) => h.name).join(', ');
    const results = [...App.model.results.values()];
    const now = Date.now();
    // planned shifts whose time has passed wait for a "done" tap, so they come first
    const pending = results.filter((r) => r.status === 'planned' && r.start < now).sort((a, b) => b.start - a.start).slice(0, 2);
    const recent = results.filter((r) => r.status === 'done').sort((a, b) => b.start - a.start).slice(0, 3);
    const name = S.settings.userName ? ', ' + esc(String(S.settings.userName).split(' ')[0]) : '';
    const date = U.fmtDate(today, 'long').replace(/\s\d{4}$/, '');
    return `
      <div class="home-top"><div class="titles"><h1>${greeting()}${name} <span class="wave">👋</span></h1>
        <div class="sub">${date} · ${esc(hd.toString().replace(/\s\S+$/, ''))}${hol ? ' · ' + esc(hol) : ''}</div></div>
        <span id="sync-dot">${App.syncDot ? App.syncDot() : ''}</span>
        <button class="icon-btn" data-act="support" aria-label="עזרה ותמיכה">${icon('help')}</button>
        <button class="icon-btn" data-act="insights" aria-label="התראות ותובנות">${icon('bell')}${unread ? `<span class="dot-badge">${unread > 9 ? '9+' : unread}</span>` : ''}</button></div>
      ${birthdayCard()}
      ${paydayCard()}
      ${banners()}
      ${App.recapCard ? App.recapCard() : ''}
      ${hero()}
      ${actionBlock()}
      ${App.guideCard ? App.guideCard() : ''}
      ${highlight()}
      ${savingCard()}
      ${shortcuts()}
      ${pending.length + recent.length ? `<div class="home-list-head"><span>${pending.length ? 'לסמן כבוצעה' : 'משמרות אחרונות'}</span><button class="btn text sm" data-act="go-shifts">הכול</button></div>
        <div class="list home-list">${pending.map((r) => App.shiftItem(r, { showOk: true })).join('')}${recent.slice(0, Math.max(1, 3 - pending.length)).map((r) => App.shiftItem(r)).join('')}</div>`
        : S.meta.guide && !S.meta.guideDone ? '' : `<div class="empty fun">${App.mascot ? App.mascot('sleepy', { size: 92 }) : ''}<h3>עוד אין משמרות</h3><div>בתחילת משמרת לוחצים על "התחל משמרת".<br>משמרת שכבר התקיימה מוסיפים בכפתור <b>+</b>.</div></div>`}
    `;
  };

  /* ---------------- actions ---------------- */
  App.actions['pick-role'] = async (el) => { await Store.setMeta({ lastRole: el.dataset.id }); App.rerender(); };
  App.actions['start-planned'] = (el) => { const sh = App.shift(el.dataset.id); if (sh && !S.activeShift) App.startShift(sh.roleId, { fromPlanned: sh.id }); };
  App.actions['choose-role'] = () => App.sheetsApi.pickRole('תפקיד למשמרת', async (rid) => { await Store.setMeta({ lastRole: rid }); App.rerender(); });
  App.actions['timer-start'] = async (el) => {
    const roles = App.roles();
    let id = el && el.dataset && el.dataset.role;
    if (!id && roles.length > 1 && !S.meta.lastRole) {
      App.sheetsApi.pickRole('באיזה תפקיד?', (rid) => App.startShift(rid));
      return;
    }
    App.startShift(id || S.meta.lastRole || (roles[0] && roles[0].id));
  };
  App.actions['timer-stop'] = () => App.stopShift();
  App.actions['timer-break'] = () => App.toggleBreak();
  App.actions['timer-switch'] = () => {
    const a = S.activeShift;
    App.sheetsApi.pickRole('לאיזה תפקיד עברת?', (rid) => App.switchRole(rid), App.roles(a.employerId).filter((r) => r.id !== App.currentRole()));
  };
  App.actions['go-summary'] = () => { App.reportsState.sub = 'summary'; App.reportsState.type = 'month'; App.reportsState.anchor = U.todayKey(); App.go('reports'); };
  App.actions['go-shifts'] = () => { App.reportsState.sub = 'list'; App.go('reports'); };
  App.actions['mark-done'] = async (el, e) => {
    e.stopPropagation();

    if (o.rest) Object.assign(ov.rest, { on: true, scope: o.rest.scope || 'auto', fromT: o.rest.from ? U.epochHM(o.rest.from) : '', toT: o.rest.to ? U.epochHM(o.rest.to) : '', pct: o.rest.pct || '', amount: o.rest.amount != null ? o.rest.amount : '' });
    if (o.ot) Object.assign(ov.ot, { on: true, mode: o.ot.mode, hours: o.ot.hours || '', pct: o.ot.pct || '', amount: o.ot.amount != null ? o.ot.amount : '' });

  /** Planned copies of a shift on the same weekday for the next n weeks (same local times, DST-safe). */
  App.weeklyCopies = function (sh, n) {
    const at = (epoch, i) => U.toEpoch(U.addDays(U.epochKey(epoch), 7 * i), U.epochHM(epoch));
    const ops = [];
    for (let i = 1; i <= n; i++) {
      const start = at(sh.start, i), end = at(sh.end, i);
      const busy = S.shifts.some((x) => x.employerId === sh.employerId && x.start < end && x.end > start);
      if (busy) continue;
      ops.push({ store: 'shifts', put: {
        id: U.uid(), kind: 'shift', employerId: sh.employerId, roleId: sh.roleId, status: 'planned', start, end,
        breakMin: sh.breakMin || 0, breakPaid: sh.breakPaid !== false, noTravel: !!sh.noTravel,
        splits: (sh.splits || []).map((x) => ({ at: at(x.at, i), roleId: x.roleId })), items: [], note: '',
      } });
    }
    return ops;
  };

  App.saveTemplate = async function (sh) {
    const name = await UI.promptText('שמירת תבנית', 'שם התבנית', `${App.roleName(sh.roleId)} ⁦${U.epochHM(sh.start)}–${U.epochHM(sh.end)}⁩`);
    if (!name) return;
    await App.saveOps([{ store: 'templates', put: {
      id: U.uid(), name, roleId: sh.roleId, employerId: sh.employerId, startT: U.epochHM(sh.start), endT: U.epochHM(sh.end),
      breakMin: sh.breakMin || 0, breakPaid: sh.breakPaid !== false, noTravel: !!sh.noTravel,
      splits: (sh.splits || []).map((x) => ({ t: U.epochHM(x.at), roleId: x.roleId })),
    } }], 'שמירת תבנית', 'התבנית נשמרה');
  };

  /* ---------------- shift editor ---------------- */
  App.sheetsApi.shiftEditor = function (id, opts) {
    const orig = id ? App.shift(id) : null;
    const d = draftFrom(orig, opts);
    let sheetEl = null;

    const roleChips = (sel, attr) => App.roles(d.employerId).map((r) => `<button class="chip ${r.id === sel ? 'on' : ''}" ${attr}="${r.id}"><span class="sw" style="background:${r.color}"></span>${esc(r.name)}</button>`).join('');
    const ovCount = () => ['rest', 'ot', 'night', 'travel', 'rate'].filter((k) => d.ov[k].on).length;
    const sel = (f, options, v) => `<select class="input" data-f="${f}">${options.map(([val, lab]) => `<option value="${val}" ${String(v) === String(val) ? 'selected' : ''}>${lab}</option>`).join('')}</select>`;
    const inp = (f, v, extra) => `<input class="input" data-f="${f}" value="${esc(v == null ? '' : v)}" ${extra || ''}>`;
    const numIn = (f, v, ph) => inp(f, v, `type="number" inputmode="decimal" step="any" placeholder="${ph || ''}"`);
    // shift length in minutes from the two times (an end before the start means the next day)
    const toMin = (t) => +t.slice(0, 2) * 60 + +t.slice(3, 5);
    const lengthMin = () => { if (!d.startT || !d.endT) return null; const m = toMin(d.endT) - toMin(d.startT); return m <= 0 ? m + 1440 : m; };
    const durChips = () => `<div class="dur-row"><span class="dur-l">${lengthMin() ? `משך המשמרת: <b class="num">${U.hm(lengthMin())}</b> שעות` : 'משך המשמרת (בחירה מהירה)'}</span><div class="chips">${[4, 5, 6, 7, 8, 9].map((h) => `<button class="chip ${lengthMin() === h * 60 ? 'on' : ''}" data-dur="${h}">${h} ש׳</button>`).join('')}</div></div>`;

    function ovBlock(key, title, sub, inner) {
      const o = d.ov[key];
      return `<div class="ov-block ${o.on ? 'on' : ''}"><label class="ov-head"><span class="t">${title}<div class="tiny muted" style="font-weight:400">${sub}</div></span><span class="tiny">${o.on ? 'ידני' : 'אוטומטי'}</span><input type="checkbox" class="switch" data-f="ov.${key}.on" ${o.on ? 'checked' : ''}></label>${o.on ? `<div class="ov-in">${inner}</div>` : ''}</div>`;
    }
    function body() {
      const emp = App.employer(d.employerId);
      const rest = d.ov.rest, ot = d.ov.ot, night = d.ov.night, trv = d.ov.travel, rate = d.ov.rate;
      const overnight = d.startT && d.endT && d.endT <= d.startT;
      return `
        <div class="seg" style="margin-bottom:14px"><button data-status="done" class="${d.status === 'done' ? 'on' : ''}">בוצעה</button><button data-status="planned" class="${d.status === 'planned' ? 'on' : ''}">מתוכננת</button></div>
        ${App.multiEmp() ? `<label class="field"><span class="lbl">מעסיק</span>${sel('employerId', S.employers.map((e) => [e.id, esc(e.name)]), d.employerId)}</label>` : ''}
        <label class="field"><span class="lbl">תאריך</span>${inp('date', d.date, `type="date" min="2000-01-01" max="${U.addDays(U.todayKey(), 366)}"`)}</label>
        <div class="grid2">
          <label class="field"><span class="lbl">התחלה</span>${inp('startT', d.startT, 'type="time"')}</label>
          <label class="field"><span class="lbl">סיום ${overnight ? '<span class="tag planned">למחרת</span>' : ''}</span>${inp('endT', d.endT, 'type="time"')}</label>
        </div>
        ${durChips()}
        <div class="field"><span class="lbl">תפקיד</span><div class="chips">${roleChips(d.roleId, 'data-role')}</div></div>
        <details class="collapse" ${d.splits.length ? 'open' : ''}><summary>${icon('swap', 's')} פיצול בין תפקידים ${d.splits.length ? `<span class="tag">${d.splits.length}</span>` : ''}</summary><div class="in">
          <div class="tiny muted" style="margin-bottom:8px">לדוגמה: התחלת כסדרן, ומ-19:00 עברת לאחמ״ש.</div>
          ${d.splits.map((s, i) => `<div class="seg-line" style="margin-bottom:8px"><label class="field" style="margin:0"><span class="lbl">משעה</span>${inp('splits.' + i + '.t', s.t, 'type="time"')}</label>
            <label class="field" style="margin:0"><span class="lbl">תפקיד</span>${sel('splits.' + i + '.roleId', App.roles(d.employerId).map((r) => [r.id, esc(r.name)]), s.roleId)}</label>
            <button class="icon-btn" data-rm-split="${i}" aria-label="הסר">${icon('x')}</button></div>`).join('')}
          <button class="btn text sm" data-add-split>${icon('plus', 's')} הוסף מעבר תפקיד</button></div></details>
        <div class="grid2">
          <label class="field"><span class="lbl">הפסקה (דקות)</span>${numIn('breakMin', d.breakMin || '', '0')}</label>
          <label class="switch-row" style="padding-top:26px"><span class="body"><span class="t small">בתשלום</span></span><input type="checkbox" class="switch" data-f="breakPaid" ${d.breakPaid ? 'checked' : ''}></label>
        </div>
        <label class="switch-row"><span class="body"><span class="t">בלי נסיעות</span><span class="s">המשמרת לא תזכה בנסיעות (${U.money(emp.travelPerDay)} ליום)</span></span><input type="checkbox" class="switch" data-f="noTravel" ${d.noTravel ? 'checked' : ''}></label>
        <details class="collapse" ${d.items.length ? 'open' : ''}><summary>${icon('gift', 's')} תוספות וניכויים ${d.items.length ? `<span class="tag">${d.items.length}</span>` : ''}</summary><div class="in">
          ${d.items.map((it, i) => `<div style="display:grid;grid-template-columns:1.1fr 1fr 40px;gap:8px;align-items:end;margin-bottom:8px">
            ${sel('items.' + i + '.type', [['bonus', 'בונוס'], ['tips', 'טיפים'], ['addition', 'תוספת'], ['deduction', 'ניכוי']], it.type)}
            ${numIn('items.' + i + '.amount', it.amount, '₪')}
            <button class="icon-btn" data-rm-item="${i}" aria-label="הסר">${icon('x')}</button>
            <div style="grid-column:1/3">${inp('items.' + i + '.label', it.label || '', 'placeholder="תיאור (לא חובה)"')}</div></div>`).join('')}
          <button class="btn text sm" data-add-item>${icon('plus', 's')} הוסף שורה</button></div></details>
        <label class="field"><span class="lbl">הערה</span><textarea class="input" data-f="note" rows="2" maxlength="500" placeholder="לא חובה">${esc(d.note)}</textarea></label>
        <details class="collapse" ${ovCount() ? 'open' : ''}><summary>${icon('hand', 's')} עקיפות ידניות ${ovCount() ? `<span class="tag override">${ovCount()}</span>` : ''}</summary><div class="in">
          <div class="tiny muted" style="margin-bottom:10px">כל רכיב מחושב אוטומטית. הפעל "ידני" רק אם המעסיק מחשב אחרת.</div>
          ${ovBlock('rest', 'תעריף שבת/חג', 'ביטול, הפעלה ידנית, טווח שעות, אחוז או סכום', `
            <div class="field"><span class="lbl">היקף</span>${sel('ov.rest.scope', [['off', 'בטל שבת/חג במשמרת'], ['all', 'החל על כל המשמרת'], ['range', 'רק בטווח שעות'], ['auto', 'זיהוי אוטומטי, אחוז/סכום אחר']], rest.scope)}</div>
            ${rest.scope === 'range' ? `<div class="grid2"><label class="field"><span class="lbl">שבת/חג משעה</span>${inp('ov.rest.fromT', rest.fromT, 'type="time"')}</label><label class="field"><span class="lbl">עד שעה</span>${inp('ov.rest.toT', rest.toT, 'type="time"')}</label></div>` : ''}
            ${rest.scope !== 'off' ? `<div class="grid2"><label class="field"><span class="lbl">אחוז</span>${numIn('ov.rest.pct', rest.pct, String(emp.restPct))}</label><label class="field"><span class="lbl">או סכום תוספת ₪</span>${numIn('ov.rest.amount', rest.amount, 'אוטומטי')}</label></div>` : ''}`)}
          ${ovBlock('ot', 'שעות נוספות', 'ביטול, סף אחר, אחוז או סכום', `
            <div class="field">${sel('ov.ot.mode', [['off', 'בטל שעות נוספות'], ['threshold', 'סף שעות אחר'], ['pct', 'אחוז אחיד לשעות הנוספות'], ['amount', 'סכום תוספת ידני']], ot.mode)}</div>
            ${ot.mode === 'threshold' ? `<label class="field"><span class="lbl">שעות נוספות אחרי (שעות)</span>${numIn('ov.ot.hours', ot.hours, String(emp.otThreshold))}</label>` : ''}
            ${ot.mode === 'pct' ? `<label class="field"><span class="lbl">אחוז</span>${numIn('ov.ot.pct', ot.pct, '125')}</label>` : ''}
            ${ot.mode === 'amount' ? `<label class="field"><span class="lbl">סכום התוספת ₪ (מעבר ל-100%)</span>${numIn('ov.ot.amount', ot.amount, '0')}</label>` : ''}`)}
          ${ovBlock('night', 'תוספת לילה', emp.nightEnabled ? 'מוגדרת: ' + emp.nightValue + (emp.nightType === 'fixed' ? ' ₪ לשעה' : '%') : 'לא מוגדרת אצל המעסיק', `
            <div class="field">${sel('ov.night.mode', [['off', 'בטל תוספת לילה'], ['all', 'כל המשמרת נחשבת לילה'], ['pct', 'אחוז אחר'], ['amount', 'סכום ידני']], night.mode)}</div>
            ${night.mode === 'pct' ? `<label class="field"><span class="lbl">אחוז תוספת</span>${numIn('ov.night.pct', night.pct, '20')}</label>` : ''}
            ${night.mode === 'amount' ? `<label class="field"><span class="lbl">סכום ₪</span>${numIn('ov.night.amount', night.amount, '0')}</label>` : ''}`)}
          ${ovBlock('travel', 'נסיעות', 'ביטול או סכום אחר למשמרת', `
            <div class="field">${sel('ov.travel.mode', [['off', 'בלי נסיעות'], ['amount', 'סכום אחר']], trv.mode)}</div>
            ${trv.mode === 'amount' ? `<label class="field"><span class="lbl">סכום ₪</span>${numIn('ov.travel.amount', trv.amount, String(emp.travelPerDay))}</label>` : ''}`)}
          ${ovBlock('rate', 'תעריף לשעה', 'לכל המשמרת, במקום תעריף התפקיד', `<label class="field"><span class="lbl">₪ לשעה</span>${numIn('ov.rate.rate', rate.rate, '0')}</label>`)}
          ${ovCount() ? `<label class="field"><span class="lbl">סיבה (לא חובה)</span>${inp('reason', d.reason, 'placeholder="למשל: המעסיק לא מחשיב את השעה הזו כשבת"')}</label>
          <button class="btn outlined block" data-reset-ov>${icon('refresh', 's')} חזור לחישוב אוטומטי</button>` : ''}
        </div></details>
        <div class="section-title">${icon('wallet', 's')} חישוב</div>
        <div class="card" id="ed-preview"></div>`;
    }
    function preview() {
      const el = sheetEl && sheetEl.querySelector('#ed-preview');
      if (!el) return;
      const sh = shiftFrom(d);
      if (!d.date || !d.startT || !d.endT) { el.innerHTML = '<div class="muted small">מלא תאריך ושעות</div>'; return; }
      const r = App.previewShift(sh);
      el.innerHTML = App.timelineHtml(r) + `<div class="row-flex" style="margin:10px 0"><div class="hero-num" style="font-size:1.8rem">${money(r.total)}</div><span class="spacer"></span><div class="small muted"><span class="num">${U.hm(r.paidMin)}</span> ש׳</div></div>` + App.breakdownHtml(r, sh);
    }
    function redraw() {
      const b = sheetEl.querySelector('.sh-body');
      const y = b.scrollTop;
      b.innerHTML = body();
      b.scrollTop = y;
      preview();
    }
    function setPath(path, value) {
      const parts = path.split('.');
      let o = d;
      for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
      o[parts[parts.length - 1]] = value;
    }

    const entry = UI.openSheet({
      title: orig ? 'עריכת משמרת' : opts && opts.status === 'planned' ? 'משמרת מתוכננת' : 'משמרת חדשה',
      full: true,
      body: body(),
      foot: `${orig ? `<button class="btn danger" data-del style="flex:0 0 auto">${icon('trash')}</button>` : ''}<button class="btn" data-save>${icon('check')} שמור</button>`,
      onMount: (el) => {
        sheetEl = el;
        preview();
        let t = null;
        el.addEventListener('input', (e) => {
          const f = e.target.dataset.f;
          if (!f) return;
          const v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
          setPath(f, v);
          if (f === 'date' && !d.statusTouched) {
            const ns = d.date > U.todayKey() ? 'planned' : 'done';
            if (ns !== d.status) { d.status = ns; redraw(); return; }
          }
          // the times come from the picker in one go: redraw so "the next day" and the length chips follow
          const structural = e.target.type === 'checkbox' || e.target.tagName === 'SELECT' || f === 'startT' || f === 'endT';
          if (structural) {
            if (f === 'ov.rest.scope' && v === 'range' && !d.ov.rest.fromT) {
              const r = App.previewShift(shiftFrom(Object.assign({}, d, { ov: emptyOv() })));
              if (r.autoRestRange) { d.ov.rest.fromT = U.epochHM(r.autoRestRange.from); d.ov.rest.toT = U.epochHM(r.autoRestRange.to); }
              else { d.ov.rest.fromT = d.startT; d.ov.rest.toT = d.endT; }
            }
            redraw();
          } else { clearTimeout(t); t = setTimeout(preview, 120); }
        });
        el.addEventListener('click', async (e) => {
          const t2 = e.target.closest('button');
          if (!t2) return;
          if (t2.dataset.status) { d.status = t2.dataset.status; d.statusTouched = true; redraw(); }
          else if (t2.dataset.role) { d.roleId = t2.dataset.role; redraw(); }
          else if (t2.dataset.dur) {
            if (!d.startT) { UI.invalid('קודם בוחרים שעת התחלה'); return; }
            const m = (toMin(d.startT) + +t2.dataset.dur * 60) % 1440;
            d.endT = `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
            redraw();
            if (root.Fx) root.Fx.play('tick');
          }
          else if (t2.hasAttribute('data-add-split')) {
            const others = App.roles(d.employerId).filter((r) => r.id !== d.roleId);
            d.splits.push({ t: '', roleId: (others[0] || App.roles()[0]).id }); redraw();
          } else if (t2.dataset.rmSplit != null) { d.splits.splice(+t2.dataset.rmSplit, 1); redraw(); }
          else if (t2.hasAttribute('data-add-item')) { d.items.push({ id: U.uid(), type: 'bonus', amount: '', label: '' }); redraw(); }
          else if (t2.dataset.rmItem != null) { d.items.splice(+t2.dataset.rmItem, 1); redraw(); }
          else if (t2.hasAttribute('data-reset-ov')) { d.ov = emptyOv(); d.reason = ''; redraw(); UI.toast('חזרה לחישוב אוטומטי — שמור כדי להחיל'); }
          else if (t2.hasAttribute('data-save')) save();
          else if (t2.hasAttribute('data-del')) {
            if (!(await UI.confirm('למחוק את המשמרת?', 'אפשר לבטל מיד אחרי.', 'מחק', true))) return;
            UI.closeTop();
            await App.saveOps([{ store: 'shifts', del: orig.id }], 'מחיקת משמרת', 'המשמרת נמחקה');
          }
        });
      },
    });

    async function save() {
      if (!d.date || !d.startT || !d.endT) { UI.invalid('מלא תאריך, שעת התחלה ושעת סיום'); return; }
      if (!d.roleId) { UI.invalid('בחר תפקיד'); return; }
      if (d.date < '2000-01-01' || d.date > U.addDays(U.todayKey(), 366)) { UI.invalid('התאריך לא הגיוני'); return; }
      const sh = shiftFrom(d);
      // numbers that would quietly change the pay the wrong way
      if (!(sh.breakMin >= 0) || sh.breakMin > 24 * 60) { UI.invalid('אורך ההפסקה לא הגיוני'); return; }
      if (sh.breakMin > 0 && sh.breakMin >= (sh.end - sh.start) / 60000) { UI.invalid('ההפסקה ארוכה מהמשמרת עצמה'); return; }
      if ((sh.items || []).some((x) => !(+x.amount > 0) || +x.amount > 1e6)) { UI.invalid('סכום של תוספת או ניכוי צריך להיות חיובי (לניכוי בוחרים "ניכוי")'); return; }
      const negative = (o) => o && typeof o === 'object' && Object.values(o).some((v) => (typeof v === 'number' && v < 0) || negative(v));
      if (negative(sh.overrides)) { UI.invalid('בחישוב הידני אי אפשר מספר שלילי'); return; }
      // a shift that hasn't happened yet can't be "done": it can be saved as planned
      if (sh.status === 'done' && sh.end > Date.now() + 5 * 60000) {
        const started = sh.start <= Date.now();
        const ok = await UI.confirm(started ? 'המשמרת עוד לא נגמרה' : 'המשמרת הזאת עוד לא קרתה',
          started ? 'שעת הסיום עוד לא הגיעה. כדי למדוד משמרת שקורית עכשיו, לוחצים "התחל משמרת" בבית. לשמור אותה בינתיים כמשמרת מתוכננת?' : 'התאריך והשעה בעתיד. לשמור אותה כמשמרת מתוכננת? אחרי שתעבוד, מסמנים שהיא בוצעה בלחיצה.',
          'שמור כמתוכננת');
        if (!ok) return;
        sh.status = 'planned';
        d.status = 'planned';
      }
      const hours = (sh.end - sh.start) / U.HOUR;
      if (hours > (+S.settings.alerts.suspiciousHours || 20)) {
        if (!(await UI.confirm('משמרת ארוכה מאוד', `המשמרת נמשכת ${U.num(hours, 1)} שעות. לשמור?`, 'שמור'))) return;
      }
      const overlap = S.shifts.find((s) => s.id !== sh.id && s.employerId === sh.employerId && s.status === sh.status && s.start < sh.end && s.end > sh.start);
      if (overlap) {
        if (!(await UI.confirm('חפיפה עם משמרת אחרת', `קיימת משמרת ב-${U.fmtDate(U.epochKey(overlap.start))} ⁦${U.epochHM(overlap.start)}–${U.epochHM(overlap.end)}⁩. לשמור בכל זאת?`, 'שמור'))) return;
      }
      await Store.setMeta({ lastRole: d.roleId });
      UI.closeTop();
      await App.saveOps([{ store: 'shifts', put: sh }], orig ? 'עריכת משמרת' : 'הוספת משמרת', orig ? 'המשמרת עודכנה' : 'המשמרת נשמרה');
    }
    return entry;
  };

  /* ---------------- entries (vacation / sick / adjustments) ---------------- */
  App.sheetsApi.entryEditor = function (id, opts) {
    opts = opts || {};
    const orig = id ? S.entries.find((e) => e.id === id) : null;
    const d = orig ? Store.clone(orig) : { kind: opts.kind || 'vacation', type: opts.type || 'bonus', date: opts.date || U.todayKey(), status: 'done', employerId: S.employers[0].id, amount: '', label: '', note: '' };
    const titles = { vacation: 'יום חופשה', sick: 'יום מחלה', adjustment: d.type === 'deduction' ? 'ניכוי' : 'תוספת / בונוס' };
    const val = orig && App.model.entryVals.get(orig.id);
    const auto = d.kind !== 'adjustment' ? Engine.dayValue(d.date, App.model.ctx, App.model.results) : null;
    UI.openSheet({
      title: (orig ? 'עריכת ' : '') + titles[d.kind],
      body: `
        ${d.kind === 'adjustment' ? `<div class="field"><span class="lbl">סוג</span><select class="input" id="en-type">${[['bonus', 'בונוס'], ['tips', 'טיפים'], ['addition', 'תוספת חד-פעמית'], ['deduction', 'ניכוי (ארוחה, ביגוד, קנס…)']].map(([v, l]) => `<option value="${v}" ${d.type === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>` : ''}

        ${!rule && !info ? `<button class="btn outlined block" data-rule="force">${icon('candle', 's')} סמן כיום מנוחה (150%)</button>` : ''}`,
      onMount: (el) => {

/* ============================================================
 * views-calendar.js — month & week calendar.
 * ============================================================ */
(function (root) {
  'use strict';
  const { U, HebCal, Store, UI, App } = root;
  const S = Store.S;
  const { icon, esc } = UI;

  App.calState = { mode: 'month', anchor: U.todayKey() };

  function dayData() {
    const map = {};
    for (const r of App.model.results.values()) {
      const d = (map[r.dateKey] = map[r.dateKey] || { shifts: [], entries: [], total: 0, ov: false });
      d.shifts.push(r);
      if (r.status === 'done') d.total += r.total;
      if (r.overridden || r.dayRuleHit) d.ov = true;
    }
    for (const e of S.entries) {
      const d = (map[e.date] = map[e.date] || { shifts: [], entries: [], total: 0, ov: false });
      d.entries.push(e);
      const v = App.model.entryVals.get(e.id);
      if (v && e.status !== 'planned') d.total += e.type === 'deduction' ? 0 : v.amount;
    }
    return map;
  }
  const shortMoney = (n) => (n >= 1000 ? '₪' + (n / 1000).toFixed(1).replace('.0', '') + 'K' : '₪' + Math.round(n));

  function monthView(map) {
    const mk = App.calState.anchor.slice(0, 7);
    const first = mk + '-01';
    const start = U.weekStart(first, S.settings.weekStart || 0);
    const today = U.todayKey();
    const cfg = App.model.ctx.restCfg;
    let cells = '';
    let monthTotal = 0, monthHours = 0;
    for (let i = 0; i < 42; i++) {
      const k = U.addDays(start, i);
      if (i >= 35 && k.slice(0, 7) !== mk) break;
      const d = map[k];
      const inMonth = k.slice(0, 7) === mk;
      if (d && inMonth) { monthTotal += d.total; monthHours += d.shifts.filter((r) => r.status === 'done').reduce((s, r) => s + r.paidHours, 0); }
      const rest = HebCal.restDayInfo(k, cfg);
      const hol = HebCal.holidaysOn(k);
      const hd = HebCal.hebrewDate(k);
      const dots = d ? d.shifts.slice(0, 4).map((r) => { const role = App.role(r.segments[0] ? r.segments[0].roleId : null); return `<i class="${r.status === 'planned' ? 'pl' : ''}" style="background:${role ? role.color : '#999'};color:${role ? role.color : '#999'}"></i>`; }).join('') + d.entries.slice(0, 2).map((e) => `<i style="background:var(--outline)"></i>`).join('') : '';
      cells += `<button class="cal-day ${inMonth ? '' : 'other'} ${rest ? 'rest' : ''} ${k === today ? 'today' : ''}" data-act="cal-day" data-k="${k}" aria-label="${U.fmtDate(k, 'long')}">
        ${d && d.ov ? '<span class="ovr" title="עקיפה ידנית"></span>' : ''}${hol.some((h) => h.rest) ? '<span class="hol">🕯</span>' : hol.length ? '<span class="hol">•</span>' : ''}
        <span class="dn">${+k.slice(8)}</span><span class="hd">${hd.dayStr}</span><span class="dots">${dots}</span>${d && d.total ? `<span class="amt">${shortMoney(d.total)}</span>` : ''}</button>`;
    }

    const hm = HebCal.hebrewDate(first), hm2 = HebCal.hebrewDate(U.monthEnd(mk));
    const hebLabel = hm.monthStr === hm2.monthStr ? hm.monthStr + ' ' + hm.yearStr : hm.monthStr + '–' + hm2.monthStr + ' ' + hm2.yearStr;
    return `<div class="cal-nav"><button class="icon-btn" data-act="cal-nav" data-dir="-1" aria-label="הקודם">${icon('right')}</button><h2>${U.fmtMonth(mk)}<div class="tiny muted" style="font-weight:400">${esc(hebLabel)}</div></h2><button class="icon-btn" data-act="cal-nav" data-dir="1" aria-label="הבא">${icon('left')}</button></div>
      <div class="cal-dow">${dows.map((x) => `<span>${x}</span>`).join('')}</div>
      <div class="cal-grid swipe-area" id="cal-swipe">${cells}</div>
      <div class="row-flex small" style="margin:10px 4px"><span>סה״כ בחודש: <b>${UI.money(monthTotal, 0)}</b></span><span class="spacer"></span><span class="muted"><span class="num">${U.hm(monthHours * 60)}</span> ש׳</span></div>`;
  }

  function weekView(map) {
    const ws = U.weekStart(App.calState.anchor, S.settings.weekStart || 0);
    const cfg = App.model.ctx.restCfg;
    const today = U.todayKey();
    let rows = '', tot = 0, hrs = 0;
    for (let i = 0; i < 7; i++) {
      const k = U.addDays(ws, i);
      const d = map[k];
      const rest = HebCal.restDayInfo(k, cfg);
      const hol = HebCal.holidaysOn(k);
      const day0 = U.dayStart(k), day1 = U.dayStart(U.addDays(k, 1));
      const pos = (t) => Math.max(0, Math.min(100, ((t - day0) / (day1 - day0)) * 100));
      let bars = '';
      for (const w of HebCal.restWindows(U.addDays(k, -1), U.addDays(k, 1), cfg)) {
        if (w.end <= day0 || w.start >= day1) continue;
        bars += `<span class="rz" style="inset-inline-start:${pos(w.start)}%;width:${pos(w.end) - pos(w.start)}%"></span>`;
      }
      if (d) for (const r of d.shifts) for (const s of r.segments) {
        const role = App.role(s.roleId);
        if (s.end <= day0 || s.start >= day1) continue;
        bars += `<i style="inset-inline-start:${pos(s.start)}%;width:${Math.max(1.5, pos(s.end) - pos(s.start))}%;background:${role ? role.color : '#999'};opacity:${r.status === 'planned' ? 0.45 : 0.9}"></i>`;
      }
      if (d) { tot += d.total; hrs += d.shifts.filter((r) => r.status === 'done').reduce((s, r) => s + r.paidHours, 0); }
      const label = d ? d.shifts.map((r) => `${App.roleName(r.segments[0] && r.segments[0].roleId)} ⁦${U.epochHM(r.start)}–${U.epochHM(r.rawEnd)}⁩${r.status === 'planned' ? ' (מתוכננת)' : ''}`).concat(d.entries.map((e) => (e.kind === 'vacation' ? 'חופשה' : e.kind === 'sick' ? 'מחלה' : (App.model.entryVals.get(e.id) || {}).label))).join(' · ') : '';
      rows += `<div class="week-row ${rest ? 'rest' : ''} card-link" data-act="cal-day" data-k="${k}" ${k === today ? 'style="box-shadow:inset 3px 0 0 var(--primary)"' : ''}>
        <div class="wd"><div class="tiny muted">${U.HEB_DAYS[U.dow(k)]}</div><div class="n">${+k.slice(8)}</div><div class="tiny muted">${HebCal.hebrewDate(k).dayStr}</div></div>
        <div class="tl"><div class="row-flex small"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(hol.map((h) => h.name).join(', ') || label || '—')}</span>${d && d.total ? `<b>${UI.money(d.total, 0)}</b>` : ''}${d && d.ov ? ` <span class="tag override">${icon('hand')}</span>` : ''}</div>
        <div class="timeline">${bars}</div>${hol.length && label ? `<div class="tiny muted">${esc(label)}</div>` : ''}</div></div>`;
    }
    return `<div class="cal-nav"><button class="icon-btn" data-act="cal-nav" data-dir="-1" aria-label="הקודם">${icon('right')}</button><h2>${U.fmtDate(ws, 'dm')} – ${U.fmtDate(U.addDays(ws, 6), 'dm')}</h2><button class="icon-btn" data-act="cal-nav" data-dir="1" aria-label="הבא">${icon('left')}</button></div>
      <div class="list swipe-area" id="cal-swipe">${rows}</div>
      <div class="row-flex small" style="margin:0 4px 10px"><span>סה״כ בשבוע: <b>${UI.money(tot, 0)}</b></span><span class="spacer"></span><span class="muted"><span class="num">${U.hm(hrs * 60)}</span> ש׳</span></div>
      <div class="tiny muted" style="margin:0 4px">ציר הזמן: 00:00 ← 24:00 · אזור צהוב = שבת/חג</div>`;
  }

    const map = dayData();

        <button class="icon-btn" data-act="cal-export" aria-label="ייצוא ליומן">${icon('download')}</button></div>
      <div class="seg" style="margin-bottom:12px"><button class="${st.mode === 'month' ? 'on' : ''}" data-act="cal-mode" data-m="month">חודש</button><button class="${st.mode === 'week' ? 'on' : ''}" data-act="cal-mode" data-m="week">שבוע</button></div>
      ${st.mode === 'month' ? monthView(map) : weekView(map)}
      <div class="legend">${roles.map((r) => `<span><i style="background:${r.color}"></i>${esc(r.name)}</span>`).join('')}
        <span><i style="background:transparent;box-shadow:inset 0 0 0 1.5px var(--outline)"></i>מתוכננת</span>
        <span><i style="background:var(--rest-tint);border:1px solid var(--rest-mark)"></i>שבת/חג</span>
        <span><i style="background:var(--override)"></i>עקיפה ידנית</span></div>
      <button class="btn tonal block" data-act="shift-plan">${icon('plus')} תכנן משמרת</button>`;
  };
  App.views.calendar_mount = function (v) {

    if (el) UI.onSwipe(el, (dir) => App.actions['cal-nav']({ dataset: { dir: dir === 'right' ? '1' : '-1' } }));

  App.actions['cal-mode'] = (el) => { App.calState.mode = el.dataset.m; App.rerender(); };
  App.actions['cal-today'] = () => { App.calState.anchor = U.todayKey(); App.rerender(); };

    const dir = +el.dataset.dir;
    App.calState.anchor = App.calState.mode === 'month' ? U.addMonths(App.calState.anchor.slice(0, 7) + '-01', dir) : U.addDays(App.calState.anchor, 7 * dir);

  };
  App.actions['cal-day'] = (el) => App.sheetsApi.daySheet(el.dataset.k);
  App.actions['cal-export'] = () => {
    UI.openSheet({
      title: 'ייצוא ליומן',
      body: `<div class="list">
        <button class="item" data-r="upcoming"><span class="lead">${icon('calendar')}</span><span class="body"><span class="t">משמרות מתוכננות קדימה</span><span class="s">קובץ .ics עם תזכורת שעה לפני</span></span></button>
        <button class="item" data-r="month"><span class="lead">${icon('grid')}</span><span class="body"><span class="t">כל המשמרות בחודש המוצג</span><span class="s">קובץ .ics</span></span></button>
        <button class="item" data-r="all"><span class="lead">${icon('list')}</span><span class="body"><span class="t">כל המשמרות</span><span class="s">קובץ .ics</span></span></button></div>
        <div class="tiny muted" style="margin:4px">פתח את הקובץ בטלפון כדי להוסיף ל-Google Calendar. למשמרת בודדת: פתח אותה ← "הוסף ל-Google Calendar".</div>`,
      onMount: (el) => el.querySelectorAll('[data-r]').forEach((b) => (b.onclick = () => {

})(typeof window !== 'undefined' ? window : globalThis);

/* ============================================================
 * views-reports.js — periodic summaries (week / month / year /

 * ============================================================ */
(function (root) {

  const { U, Engine, Store, UI, App, Charts } = root;
  const S = Store.S;
  const { icon, esc, money } = UI;

  App.reportsState = { sub: 'summary', type: 'month', anchor: U.todayKey(), from: U.addDays(U.todayKey(), -30), to: U.todayKey(), f: { q: '', role: '', status: 'all', ov: false, from: '', to: '' } };

    const emp = S.employers[0];
    if (type === 'week') { const ws = U.weekStart(anchor, S.settings.weekStart || 0); return { from: ws, to: U.addDays(ws, 6), label: `${U.fmtDate(ws, 'dm')} – ${U.fmtDate(U.addDays(ws, 6), 'dm')}` }; }
    if (type === 'month') { const P = Engine.periodOf(anchor, emp); return { from: P.from, to: P.to, label: P.label, sub: emp.periodStartDay > 1 ? `⁦${U.fmtDate(P.from, 'short')}–${U.fmtDate(P.to, 'short')}⁩` : '' }; }
    if (type === 'year') { const y = anchor.slice(0, 4); return { from: y + '-01-01', to: y + '-12-31', label: 'שנת ' + y }; }
    return { from: st.from, to: st.to, label: `${U.fmtDate(st.from, 'short')} – ${U.fmtDate(st.to, 'short')}` };
  }
  function shiftAnchor(type, anchor, dir) {
    if (type === 'week') return U.addDays(anchor, 7 * dir);
    if (type === 'month') { const r = rangeFor('month', anchor); return dir > 0 ? U.addDays(r.to, 1) : U.addDays(r.from, -1); }
    if (type === 'year') return (+anchor.slice(0, 4) + dir) + '-06-01';
    return anchor;
  }
  function prevRange(type, r) {
    if (type === 'custom') { const len = U.diffDays(r.from, r.to) + 1; return { from: U.addDays(r.from, -len), to: U.addDays(r.from, -1) }; }
    return rangeFor(type, shiftAnchor(type, r.from, -1));
  }
  function firstData() {
    let f = null;
    for (const r of App.model.results.values()) if (r.status === 'done' && (!f || r.dateKey < f)) f = r.dateKey;
    return f;
  }
  /** Average of metric over N previous ranges (only ranges after data started). */
  function averages(type, r, n) {
    if (type === 'year' || type === 'custom') return null;
    const first = firstData();
    const list = [];
    let cur = r;
    const count = type === 'week' ? (n === 3 ? 13 : 52) : n;
    for (let i = 0; i < count; i++) {
      cur = prevRange(type, cur);
      if (!first || cur.to < first) break;
      list.push(Engine.rangeSummary(App.model, cur.from, cur.to));
    }
    if (!list.length) return null;
    const avg = (f) => list.reduce((s, x) => s + f(x), 0) / list.length;
    return { n: list.length, gross: avg((x) => x.gross), net: avg((x) => x.net.net), hours: avg((x) => x.hours), shifts: avg((x) => x.shifts), travel: avg((x) => x.travel), avgHourly: avg((x) => x.avgHourly), avgShift: avg((x) => x.avgShift) };
  }

  /* ---------------- summary ---------------- */
  App.summaryData = function (type, anchor) {
    const r = rangeFor(type, anchor);
    const t = Engine.rangeSummary(App.model, r.from, r.to);
    const pr = prevRange(type, r);
    const p = Engine.rangeSummary(App.model, pr.from, pr.to);
    return { r, t, pr, p };
  };

  function kpi(label, cur, prev, fmt, invert) {
    return `<div class="kpi"><div class="l">${label}</div><div class="v">${fmt(cur)}</div><div class="d">${UI.delta(cur, prev, { invert })}</div></div>`;
  }
  function compareTable(t, p, a3, a12, type) {
    const rows = [
      ['ברוטו', (x) => x.gross, (v) => U.money(v, 0)], ['נטו משוער', (x) => (x.net && x.net.net != null ? x.net.net : x.net), (v) => U.money(v, 0)],
      ['שעות', (x) => x.hours, (v) => U.num(v, 1)], ['משמרות', (x) => x.shifts, (v) => U.num(v, 1)],
      ['ממוצע לשעה', (x) => x.avgHourly, (v) => U.money(v)], ['שעות למשמרת', (x) => x.avgShift, (v) => U.num(v, 1)],
    ];
    const per = type === 'week' ? 'לשבוע' : 'לחודש';
    let h = `<div class="compare-row h"><span></span><span>קודמת</span>${a3 ? `<span>ממוצע 3 ח׳</span>` : ''}${a12 ? `<span>ממוצע 12 ח׳</span>` : ''}</div>`;
    for (const [lab, f, fmt] of rows) {
      const cur = f(t);
      const cell = (v) => `<span class="num">${fmt(v)}</span> ${UI.delta(cur, v, { compact: true })}`;
      const fa = (a) => (a ? f(Object.assign({}, a, { net: a.net })) : null);
      h += `<div class="compare-row"><span><b>${lab}</b><br><span class="num small">${fmt(cur)}</span></span><span class="small">${cell(f(p))}</span>${a3 ? `<span class="small">${cell(fa(a3))}</span>` : ''}${a12 ? `<span class="small">${cell(fa(a12))}</span>` : ''}</div>`;
    }
    return h + `<div class="tiny muted" style="margin-top:6px">החיצים: שינוי של התקופה הנוכחית ביחס לכל עמודה. ממוצעים ${per}${a3 ? ` (3 ח׳ = ${a3.n} ${type === 'week' ? 'שבועות' : 'תקופות'})` : ''}${a12 ? `, (12 ח׳ = ${a12.n})` : ''} — רק מתקופות שיש בהן נתונים.</div>`;
  }

  function yearExtras(t, r) {
    const y = r.from.slice(0, 4);
    const months = [];
    for (let m = 1; m <= 12; m++) {
      const mk = y + '-' + U.pad(m);
      const mt = Engine.totals(App.model, U.monthStart(mk), U.monthEnd(mk));
      months.push({ mk, t: mt });
    }
    const worked = months.filter((m) => m.t.shifts > 0);
    const best = worked.slice().sort((a, b) => b.t.gross - a.t.gross)[0];
    const worst = worked.slice().sort((a, b) => a.t.gross - b.t.gross)[0];
    const seasons = [['חורף (דצמ׳–פבר׳)', [12, 1, 2], '#2a78d6'], ['אביב (מרץ–מאי)', [3, 4, 5], '#1baf7a'], ['קיץ (יוני–אוג׳)', [6, 7, 8], '#eda100'], ['סתיו (ספט׳–נוב׳)', [9, 10, 11], '#eb6834']]
      .map(([name, ms, color]) => ({ name: name.split(' ')[0], full: name, color, value: months.filter((m) => ms.includes(+m.mk.slice(5))).reduce((s, m) => s + m.t.gross, 0) }));
    // previous year
    const py = String(+y - 1);
    const pt = Engine.rangeSummary(App.model, py + '-01-01', py + '-12-31');
    // Form-106 style + refund estimate
    const T = S.settings.tax;
    let withheld = 0, withheldSrc = 0, bl = 0, health = 0, pension = 0, pensionEr = 0, sev = 0, hish = 0, hishEr = 0, taxable = 0;
    const emp = S.employers[0];
    const monthsWithIncome = [];
    for (const m of months) {
      const P = Engine.periodByKey(m.mk, emp);
      const ps = Engine.periodSummary(App.model, m.mk, emp.id);
      const slip = S.payslips.find((x) => x.period === m.mk);
      const sf = slip ? slip.fields || {} : {};
      const g = slip && sf.gross ? +sf.gross.value : ps.gross;
      if (g > 0) monthsWithIncome.push(m.mk);
      taxable += g;
      const n = Engine.netEstimate({ gross: g, pensionBase: Engine.pensionBaseOf(ps, S.settings), deductions: 0, periodTo: P.to }, S.settings);
      const pick = (k, est) => (slip && sf[k] && sf[k].value != null ? (withheldSrc++, +sf[k].value) : est);
      withheld += slip && sf.incomeTax ? +sf.incomeTax.value : n.incomeTax;
      if (slip && sf.incomeTax) withheldSrc++;
      bl += pick('nationalInsurance', n.bl); health += pick('healthTax', n.health); pension += pick('pensionEmployee', n.pensionEmployee);
      pensionEr += pick('pensionEmployer', n.pensionEmployer); sev += pick('severance', n.severance); hish += pick('hishtalmutEmployee', n.hishtalmut); hishEr += pick('hishtalmutEmployer', n.hishtalmutEmployer);
    }
    const annual = Engine.netEstimate({ gross: taxable, pensionBase: pension / ((+S.settings.pension.employeePct || 6) / 100) || 0, pensionActive: pension > 0, deductions: 0, months: 12 }, S.settings);

      <div class="section-title">${icon('chart', 's')} לפי חודשים</div>
      <div class="card">${Charts.bars(months.map((m) => ({ label: U.HEB_MONTHS[+m.mk.slice(5) - 1].slice(0, 3), value: m.t.gross, tip: `${U.fmtMonth(m.mk)}: ${U.money(m.t.gross, 0)} · ${U.num(m.t.hours, 1)} ש׳` })), { label: 'ברוטו לפי חודש', axisFmt: (v) => '₪' + (v >= 1000 ? +(v / 1000).toFixed(1) + 'K' : v) })}
        ${best ? `<div class="kv"><span>${icon('up', 's')} החודש הכי טוב</span><b>${U.fmtMonth(best.mk)} · ${U.money(best.t.gross, 0)}</b></div>` : ''}
        ${worst && worst !== best ? `<div class="kv"><span>${icon('down', 's')} החודש הכי חלש</span><b>${U.fmtMonth(worst.mk)} · ${U.money(worst.t.gross, 0)}</b></div>` : ''}
        <div class="kv"><span>מול ${py}</span><span>${U.money(pt.gross, 0)} ${UI.delta(t.gross, pt.gross)}</span></div></div>
      <div class="section-title">${icon('sun', 's')} התפלגות עונתית</div>
      <div class="card">${Charts.hbars(seasons, (v) => U.money(v, 0))}</div>
      <div class="section-title">${icon('file', 's')} סיכום בסגנון טופס 106</div>
      <div class="card">
        ${[['סה״כ הכנסה ברוטו (משכורת)', taxable], ['מס הכנסה שנוכה', withheld], ['ביטוח לאומי (עובד)', bl], ['מס בריאות', health], ['הפרשת עובד לפנסיה', pension], ['הפרשת מעסיק לתגמולים', pensionEr], ['הפרשת מעסיק לפיצויים', sev], ['קרן השתלמות — עובד', hish], ['קרן השתלמות — מעסיק', hishEr]]
          .map(([l, v]) => `<div class="kv"><span>${l}</span><b class="money">${U.money(v)}</b></div>`).join('')}
        <div class="kv"><span>חודשי עבודה</span><b>${monthsWithIncome.length}</b></div>
        <div class="kv"><span>נקודות זיכוי</span><b>${T.creditPoints}</b></div>
        <div class="tiny muted" style="margin-top:8px">${withheldSrc ? 'חלק מהשורות מבוססות על תלושים שהזנת; השאר — הערכה.' : 'כל הנתונים הם הערכה לפי המשמרות. הזנת תלושים תשפר את הדיוק.'} הטופס הרשמי (106) מתקבל מהמעסיק.</div></div>
      <div class="card ${refund > 150 ? 'tonal' : ''}"><div class="card-head">${icon('wallet')}<h3>החזר מס — הערכה</h3></div>
        ${refund > 150 ? `<div>ייתכן שמגיע לך <b>החזר של כ-${U.money(refund, 0)}</b>.</div>` : refund < -150 ? `<div>לפי ההערכה, נוכה פחות מס מהחבות השנתית (כ-${U.money(-refund, 0)}). זה קורה לפעמים כשעובדים אצל כמה מעסיקים.</div>` : '<div>לפי ההערכה, המס שנוכה קרוב לחבות השנתית.</div>'}
        <div class="small" style="margin-top:6px">מס שנוכה: ${U.money(withheld, 0)} · חבות שנתית משוערת: ${U.money(liability, 0)}${gap12 > 0 ? ` · ${gap12} חודשים בלי הכנסה${yearDone ? '' : ' (כולל חודשים שעוד לא הגיעו)'}` : ''}</div>
        <div class="tiny" style="margin-top:8px;opacity:.85">מס הכנסה מנוכה כל חודש כאילו תעבוד כך כל השנה. בשנה עם חודשים בלי עבודה, או עם שינויים גדולים בהכנסה, לרוב נוכה יותר מדי. זו הערכה בלבד — מומלץ לבדוק בסימולטור של רשות המסים או מול יועץ מס / רו״ח.</div></div>`;
  }
