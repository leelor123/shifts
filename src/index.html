<script>(function(){try{var l=localStorage.getItem('shaati.lang'),h=document.documentElement.lang;if(l&&l!==h&&/^(he|ar|ru|en|fr|es)$/.test(l)&&!sessionStorage.getItem('langHop')){sessionStorage.setItem('langHop','1');location.replace((l==='he'?'index.html':'index.'+l+'.html')+location.search+location.hash)}else sessionStorage.removeItem('langHop');if(!/^(he|ar|ru|en|fr|es)$/.test(l||''))document.documentElement.classList.add('lp-first','lp-open')}catch(e){document.documentElement.classList.add('lp-first','lp-open')}})();
/* lp-first: no language chosen yet, so the language doors written into the page (#lp-static) show with the first frame,
   and lp-open keeps the screen under them unpainted (lang.js takes the doors over; app.js removes them if not needed) */
/* Rubik and Fredoka come from the app's own address (fonts/, their @font-face rules are in the styles) and the
   language's files are preloaded, so nothing waits for another server. A font chosen in the settings comes from
   Google: App.applyTheme gives this link its address. The show waits for the fonts before it leaves. */
(function(){var l=document.createElement('link');l.rel='stylesheet';l.id='font-link';document.head.appendChild(l);})();</script>
